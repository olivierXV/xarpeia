<style>
:root{--pg:#161311;--paper:#1d1916;--paper2:#231e1a;--rule:#4a4038;--ink:#eee6d8;--ink2:#c3b9a8;--mut:#968b7b;--lk:#e8a487;--red:#e0674a;--xa:#e6c27a;--la:#8fd0c4;--wdt:#9bc27a;--bar:#0e0c0b;--gold:#e6c27a;--teal:#8fd0c4;--wd:#7fae5c;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--pg:#f2ede2;--paper:#faf7ef;--paper2:#eee7d8;--rule:#b9ad98;--ink:#211c17;--ink2:#4b4339;--mut:#7a6f60;--lk:#9a3418;--red:#a8381b;--xa:#7d5a0c;--la:#1c6a60;--wdt:#3d6b22;--bar:#211c17;--gold:#9a7418;--teal:#1c6a60;--wd:#3d6b22;color-scheme:light}}
:root[data-theme="light"]{--pg:#f2ede2;--paper:#faf7ef;--paper2:#eee7d8;--rule:#b9ad98;--ink:#211c17;--ink2:#4b4339;--mut:#7a6f60;--lk:#9a3418;--red:#a8381b;--xa:#7d5a0c;--la:#1c6a60;--wdt:#3d6b22;--bar:#211c17;--gold:#9a7418;--teal:#1c6a60;--wd:#3d6b22;color-scheme:light}
*{box-sizing:border-box;border-radius:0!important}
body{margin:0;background:var(--pg);color:var(--ink);font:17px/1.65 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;overflow-x:clip}
a{color:var(--lk);text-underline-offset:3px}img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4,.cap,.tabs a,.util,.tag,dt,.d{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.cap{font-weight:700;font-size:11px;letter-spacing:.28em;text-transform:uppercase}
.util{background:var(--bar);color:#d8cfbf;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.util .wrap{display:flex;gap:18px;align-items:center;padding-top:6px;padding-bottom:6px;flex-wrap:wrap}.util .sp{margin-left:auto}
.lamp{display:inline-block;width:7px;height:7px;background:#5cc27a;margin-right:7px}.lamp.cl{background:#e5594d}
.btn{font:600 11px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;background:none;color:inherit;border:1px solid currentColor;padding:4px 10px;cursor:pointer}
.top{border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-top:18px;padding-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brand img{width:44px;height:44px}
.brand b{display:block;font:300 26px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.5em}
.brand small{display:block;font:600 9px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.tabs{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.tabs a{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ink2);padding:6px 0;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--red)}
.main{padding:34px 0 10px}
.g2{display:grid;gap:44px;grid-template-columns:1.45fr 1fr}
.box{margin:0 0 38px;padding:0}
.box>h3{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--ink);padding:0 0 9px;margin:0 0 14px;border-bottom:1px solid var(--rule);position:relative}
.box>h3::before{content:"";position:absolute;left:0;bottom:-3px;width:44px;height:5px;background:var(--red)}
.box.xa>h3::before{background:var(--gold)}.box.la>h3::before{background:var(--teal)}.box.wd>h3::before{background:var(--wd)}
.bd p{margin:0 0 .9em}.bd p:last-child{margin:0}.mut,.note{color:var(--mut)}.note{font-size:14px}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:10px 22px;margin:0}
dl.kv dt{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);padding-top:6px}dl.kv dd{margin:0}
ul.lk{list-style:none;margin:0;padding:0}
ul.lk li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule)}
ul.lk .t{font-weight:700}ul.lk .dots{flex:1}ul.lk .n{font-size:14px;color:var(--mut);text-align:right}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:12px 0;border-bottom:1px solid var(--rule)}
.tl li::before{display:none}
.tl b.d{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);padding-top:4px}
.tl li.la b.d{color:var(--la)}.tl li.both b.d,.tl li.xa b.d{color:var(--xa)}.tl li.wd b.d{color:var(--wdt)}
.tag{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:1px solid currentColor;padding:2px 6px;margin-left:10px;color:var(--mut);white-space:nowrap;vertical-align:middle}
.gates{display:inline-block;font:600 11px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--rule);background:var(--paper2)}
/* diptych (plan() in this version) */
.win{background:none;border:0;box-shadow:none}.win .tb,.win .cp{display:none}
.dip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--rule);min-height:300px;position:relative}
.dip a{display:flex;flex-direction:column;justify-content:flex-end;padding:22px 20px;text-decoration:none;color:var(--ink);min-height:300px}
.dip a:first-child{background:linear-gradient(180deg,transparent 40%,color-mix(in srgb,var(--gold) 22%,transparent));border-right:1px solid var(--rule)}
.dip a:last-child{background:linear-gradient(180deg,transparent 40%,color-mix(in srgb,var(--teal) 22%,transparent))}
.dip em{font:italic 14px Georgia,serif;color:var(--mut);display:block;margin-top:6px}
.dip .cap{margin-bottom:8px}.dip strong{font:300 clamp(13px,1.7vw,21px)/1.1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.dip a:first-child .cap{color:var(--xa)}.dip a:last-child .cap{color:var(--la)}
.dip a:hover strong{text-decoration:underline;text-underline-offset:6px}
.dipc{text-align:center;font:600 10px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--wdt);padding:9px;border:1px solid var(--rule);border-top:0}
.h1row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:center;padding:44px 0 34px}
.h1row h1{font:200 clamp(44px,7vw,92px)/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.14em;margin:12px 0 18px}
.lead{font-size:19px;color:var(--ink2);max-width:44ch}
.idx{margin:22px 0 14px;padding:0;list-style:none}
.idx li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule)}
.idx a{font-weight:700;text-decoration:none;color:var(--ink)}.idx a:hover{color:var(--red)}.idx .dots{flex:1}.idx .n{font-size:14px;color:var(--mut)}
.hero2{border-bottom:1px solid var(--rule);background:var(--paper2)}
.hero2 .wrap{display:block;padding-top:52px;padding-bottom:44px}
.hero2 .win{display:none}
.hero2 h1{font:200 clamp(48px,9vw,104px)/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.1em;margin:12px 0 18px}
.hero2 p{max-width:56ch;font-size:19px;color:var(--ink2);margin:0}
.hero2 .cap{color:var(--red)}.hero2.xa .cap,.hero2.xa h1{color:var(--xa)}.hero2.la .cap,.hero2.la h1{color:var(--la)}
.hero2.xa{border-top:6px solid var(--gold)}.hero2.la{border-top:6px solid var(--teal)}.hero2.hi{border-top:6px solid var(--red)}
footer{margin-top:30px;background:var(--bar);color:#d8cfbf;padding:28px 0}
footer .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
footer img.seal{width:56px;height:56px}footer small{display:block;color:#a79d8c;font-size:12px;margin-top:3px}
.flag{width:110px;margin-left:auto}
@media (max-width:860px){.g2,.h1row{grid-template-columns:1fr}.tabs{margin-left:0;width:100%;gap:16px}.util .sp{margin-left:0}.tl li{grid-template-columns:1fr;gap:2px}}
@media (max-width:520px){dl.kv{grid-template-columns:1fr}.brand b{font-size:20px;letter-spacing:.34em}.dip{grid-template-columns:1fr}.dip a{min-height:170px}.dip a:first-child{border-right:0;border-bottom:1px solid var(--rule)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="retro">
:root{--mono:"Courier New",Courier,monospace;--ser:Georgia,"Times New Roman",serif;--dot:var(--rule)}
body{font-family:var(--ser);background-image:radial-gradient(circle,color-mix(in srgb,var(--ink) 9%,transparent) .8px,transparent 1.1px);background-size:5px 5px}
h1,h2,h3,h4,.cap,.tabs a,.util,.tag,dt,.d,.btn,.gates,.dipc,.brand b,.brand small{font-family:var(--mono)!important}
.util{border-bottom:3px double #6a5f50}
#stGate::after{content:"_";margin-left:3px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.btn{border-style:solid;box-shadow:2px 2px 0 currentColor}.btn:active{box-shadow:none;transform:translate(2px,2px)}
.top{border-bottom:3px double var(--ink);background:var(--paper)}
.brand b{font-weight:700;letter-spacing:.32em;font-size:24px}
.brand small{letter-spacing:.14em;font-weight:700}
.tabs{gap:6px}
.tabs a{font-family:var(--mono);font-size:12px;letter-spacing:.08em;border:0;padding:5px 8px}
.tabs a::before{content:"[ "}.tabs a::after{content:" ]"}
.tabs a:hover{background:var(--ink);color:var(--pg)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--pg)}
.tabs a[aria-current="page"]::before{content:"▸ "}.tabs a[aria-current="page"]::after{content:" ◂"}
h1{font-family:var(--ser)!important;font-weight:700!important;text-transform:uppercase}
.h1row h1,.hero2 h1{font-weight:700!important;letter-spacing:.08em;text-shadow:4px 4px 0 var(--red)}
.hero2.xa h1{text-shadow:4px 4px 0 color-mix(in srgb,var(--gold) 45%,var(--pg))}
.hero2.la h1{text-shadow:4px 4px 0 color-mix(in srgb,var(--teal) 45%,var(--pg))}
.h1row h1{font-size:clamp(46px,7.4vw,96px)}

function now(){var q=location.search.match(/now=(\d{12})/);if(q){var s=q[1];return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12))}return new Date()}
function pad(n){return n<10?'0'+n:n}
function gates(){return {open:true,txt:'Gates of Xareionople: all four open'}}
function tick(){var G=gates();var d=now();document.getElementById('stDate').textContent=DY[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]+' '+(d.getFullYear()-1860)+' AAX · '+pad(d.getHours())+':'+pad(d.getMinutes());document.getElementById('stGate').innerHTML='<i class="lamp'+(G.open?'':' cl')+'"></i>'+G.txt;var g=document.getElementById('gt');if(g){g.innerHTML='<i class="lamp'+(G.open?'':' cl')+'"></i>'+G.txt}}
function box(t,h,c){return '<section class="box '+(c||'')+'"><h3>'+t+'</h3><div class="bd">'+h+'</div></section>'}
function plan(on){return '<div class="win"><div class="dip"><a class="cx" href="#/xareionople"><span class="cap">North · the walled city</span><strong>Xareionople</strong><em>Twenty-two blocks of wall, and four gates that stay open.</em><span class="go">Enter the city ›</span></a><a class="cl" href="#/latreionople"><span class="cap">South · the open port</span><strong>Latreionople</strong><em>High ground over the gulf, no sea wall. Its northern district, Carai, holds the Summer House and the Memorial.</em><span class="go">Enter the city ›</span></a></div><div class="dipc">Xareionople in the north and Latreionople in the south. Carai is a district of Latreionople.</div></div>'}
function hero(c,e,t,p,on){return '<div class="hero2 '+c+'"><div class="wrap"><div><div class="cap">'+e+'</div><h1>'+t+'</h1><p>'+p+'</p></div>'+plan(on)+'</div></div>'}

 box('Erimos at a glance','<dl class="kv"><dt>Cities</dt><dd>Xareionople in the north and Latreionople in the south. Carai is a district of Latreionople, and the Carai Woods lie on the western coast beside them.</dd><dt>Why “capital state”</dt><dd>The Federation’s courts, legislature and executive sit here, and so does the Commonwealth’s Dome, together with the companies that run the country’s media, machines and water.</dd><dt>Government</dt><dd>A Governor and a unicameral State Assembly</dd><dt>Motto</dt><dd><i>In nomine Latreviae</i>: in the name of Latrevia</dd></dl>')+
 box('The state government','<p>Erimos was made to hold two cities that had been nominally independent for most of history, because distance kept them apart. The state government is built so that neither can overrule the other.</p><dl class="kv"><dt>Governor</dt><dd>Ignacio Olivares. Elected by the whole state, and must win a majority in <b>both</b> cities.</dd><dt>Assembly</dt><dd>The Erimos State Assembly, unicameral, 72 members: 36 from each city. Carai’s seats count with Latreionople’s.</dd><dt>Speaker</dt><dd>Alternates between the cities each term.</dd><dt>Sittings</dt><dd>Alternately in Xareionople and Latreionople. The state has no seat of its own.</dd></dl>')+
 
 '</div><div>'+

 box('Seated in Latreionople','<p class="note">The Commonwealth.</p>'+lk([['The Commonwealth','Charter and Dome','commonwealth.html'],['The Presidency','President','commonwealth-presidency.html'],['The Commonwealth Congress','Legislature','congress.html'],['The Commonwealth courts','Judiciary','commonwealth-courts.html']]),'la')+

'xareionople':function(){
 return hero('xa','Erimos · North · formerly Jumongrad','Xareionople','The walled city. Where most of the country’s history was decided, and where it is still written down. Known to its own people as Xarei.','xa')+
 '<div class="wrap main"><div class="g2"><div>'+
 box('The walls and the gates','<p>Twenty-two blocks of wall surround the city. Xarpeius built them, and until 160 AAX they had never been breached. When Zarpaii’s forces came to Xareionople she did not assault them: the gates stayed shut, and General Vorenus handed the city over by agreement, without a shot.</p><p>The gates have been open ever since, day and night. The walls divide a district, not the city from its people. In law the West, North and East Gates can be closed again only by an emergency order. The South Gate cannot, whatever is ordered: it faces the road to Latreionople and stands beside the VBN Compound.</p><div id="gt" class="gates"></div>','xa')+
 box('The four gates',lk([['West Gate','Beside the Executive Palace'],['North Gate','Beside the Executive Palace and the Temple'],['East Gate','Beside Jumongrad City Hall'],['South Gate','By the VBN Compound; never closed']]),'xa')+
 box('Landmarks',lk([['The Imperial Palace','Seat of the old Empire'],['The Executive Palace','Federal executive','executive-palace.html'],['The Exile Memorial','Remembers the 1 AAX flight'],['Xareionople Temple','Faith and ceremony'],['Xareionople General Hospital','The city’s main hospital'],['Jumongrad City Hall','The old name, kept on the door']]),'xa')+
 box('Names','<p>The city was <b>Jumongrad</b> until 108 AAX. After Xarpeius’s death it took the name <b>Xareionople</b> (in full, Xareionopolis). Its people still say Xarei.</p>','xa')+
 '</div><div>'+
 box('The Federation sits here',lk([['The Federal Republic','','latrevia.html'],['The Executive Palace','','executive-palace.html'],['The Federal Assembly','','assembly.html'],['The Federal courts','','courts.html']]),'xa')+
 box('Business',lk([['VBN Compound','Broadcasting','corporate.vbn.html'],['Meridian Machines','Computers; founded here']]),'xa')+
 box('The Cup','<p><b>Xareionople United</b> play in the Kosmos Cup and host the Seam Derby on the north side.</p>','xa')+
 '</div></div></div>'},
'latreionople':function(){
 return hero('la','Erimos · South · formerly Luisitro','Latreionople','The open port. The main city stands on high ground above the Gulf of Latreionople and has never had a sea wall.','la')+
 '<div class="wrap main"><div class="g2"><div>'+
 box('The port and the high city','<p>Latreionople grew as a trading city on the gulf. Its streets run uphill from the Port of Erimos and are open to the water. The city kept open in peace, and in 157–158 AAX it paid for it: republican forces cut it off for six months, and the imperial governor surrendered. The Dome became Zarpaii’s headquarters.</p><p>For 47 years, from 1 to 49 AAX, the city was Luisaran. Its Spanish names and customs outlived the occupation.</p>','la')+
 box('Landmarks',lk([['The Dome of the Commonwealth','Where the Charter was adopted, 1 Ixarius 162 AAX'],['The Arch',''],['The Eternal Flame',''],['The Steps of the Dome',''],['Port of Erimos','On the Gulf of Latreionople']]),'la')+
 box('Carai district','<p>Carai is the northern, newer residential side of Latreionople. It holds the <b>Memorial to Xarpeius</b>, the road that leads to it from the Reflecting Pool, and the <b>Xarpeius Summer House</b>, the only building that faces the Carai Woods directly, near the district’s northern limit.</p><p>The <b>Carai Woods</b> are the old town of Carai, emptied by the fighting of 48–49 AAX and never rebuilt, until the forest took the site back. They are a patch of green on the western coast, just west of the Summer House, beside the two cities and not between them.</p>','wd')+
 '</div><div>'+
 box('The Commonwealth sits here',lk([['The Commonwealth','','commonwealth.html'],['The Presidency','','commonwealth-presidency.html'],['The Congress','','congress.html'],['The courts','','commonwealth-courts.html']]),'la')+
 box('Water','<p>Verzosa Water Company draws from the lakes east of the capital and supplies both cities. After the Reconquest its mains were the first thing to join them.</p>','la')+
 box('The Cup','<p><b>Latreionople FC</b> and <b>Carai Athletic</b> both play in the Kosmos Cup. Latreionople FC host the Seam Derby on the south side.</p>','la')+
 '</div></div></div>'},
