:root{
  --bg:#f3f2ed;--bg2:#eae8e0;--card:#fbfaf6;--ink:#0a0b10;--ink2:#3a3d48;--mut:#656874;--line:#d6d3c8;
  --brand:#1f43f0;--brand-ink:#fff;--night:#05060a;--night2:#0d1019;--night-ink:#f4f4f0;--night-mut:#9a9eae;--night-line:#1f2331;
  --vnc:#169c00;--v3:#e0206f;--vrs:#0a8fc0;--one:#1f43f0;--live:#e5262d;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07080c;--bg2:#0d0f16;--card:#111420;--ink:#f1f1ec;--ink2:#c9cbd4;--mut:#8e92a3;--line:#222637;
  --brand:#7a90ff;--brand-ink:#05060a;--vnc:#3cdc1c;--v3:#ff5aa0;--vrs:#2cc3f5;--one:#7a90ff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07080c;--bg2:#0d0f16;--card:#111420;--ink:#f1f1ec;--ink2:#c9cbd4;--mut:#8e92a3;--line:#222637;
  --brand:#7a90ff;--brand-ink:#05060a;--vnc:#3cdc1c;--v3:#ff5aa0;--vrs:#2cc3f5;--one:#7a90ff;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.lg{display:block;height:auto}
.soon{display:inline-flex;align-items:center;gap:8px;font:500 13px/1 "Bricolage Grotesque";letter-spacing:.04em;color:var(--mut)}
.soon::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mut);opacity:.6}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}

/* header */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;flex:none}
.brand .wm{height:23px;width:auto;aspect-ratio:681/443;color:var(--ink)}
.brand small{font:600 10.5px/1 "Bricolage Grotesque";letter-spacing:.24em;text-transform:uppercase;color:var(--mut);padding-left:12px;border-left:1px solid var(--line)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 11px;font:500 14.5px/1 "Bricolage Grotesque";color:var(--ink2);text-decoration:none;border-radius:8px}
nav.main a:hover{background:var(--bg2);color:var(--ink)}
.tools{display:flex;align-items:center;gap:10px}
.date{font:500 12.5px/1.2 "Bricolage Grotesque";color:var(--mut);white-space:nowrap;text-align:right}
.ib{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;font:inherit}
.ib:hover{background:var(--bg2)}
.ib svg{width:17px;height:17px}
.menu{display:none}
@media (max-width:980px){
  .date{display:none}.menu{display:inline-grid}
  nav.main{display:none;position:absolute;left:0;right:0;top:62px;flex-direction:column;background:var(--bg);padding:10px 16px 16px;border-bottom:1px solid var(--line);margin:0}
  nav.main.open{display:flex}
  nav.main a{padding:13px 8px;font-size:16px}
  .top .wrap{justify-content:space-between}
  .tools{margin-left:auto}
}
@media (max-width:480px){.brand small{display:none}}


/* footer */
footer{background:var(--night);color:var(--night-ink);padding-block:64px 36px}
footer .top2{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-start;padding-bottom:36px;border-bottom:1px solid var(--night-line)}
footer .wm{height:36px;aspect-ratio:681/443;color:#fff;width:auto}
footer .addr{color:var(--night-mut);font-size:15px;margin-top:14px;max-width:34ch}
footer .links{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:8px 40px}
footer .links a{color:#d8dae4;text-decoration:none;font:500 15px "Bricolage Grotesque"}footer .links a:hover{color:#fff;text-decoration:underline}
footer .partners{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:34px}
footer .partners small{font:600 11px/1 "Bricolage Grotesque";letter-spacing:.18em;text-transform:uppercase;color:var(--night-mut);margin-right:6px}
footer .legal{margin-top:32px;color:var(--night-mut);font-size:13.5px;max-width:90ch}


.visit{font:600 14px/1 "Bricolage Grotesque";color:var(--brand);text-decoration:none}.visit:hover{text-decoration:underline}.eyebrow{font:600 12px/1 "Bricolage Grotesque";letter-spacing:.2em;text-transform:uppercase}h1,h2,h3{margin:0}h1{font:600 clamp(46px,7vw,98px)/.96 "Bricolage Grotesque",system-ui,sans-serif}h1 em{font-style:italic}.lede{max-width:64ch;color:var(--ink2);font-size:19px}.note{color:var(--mut);font-size:14.5px}.rv{opacity:1}.js .rv{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.js .rv.in{opacity:1;transform:none}@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none}}

.hd2{padding-block:56px 18px}.hd2 h1{font-size:clamp(40px,6vw,76px);margin-block:.2em .25em}.hd2 h1 em{color:var(--vnc)}
.hd2 .eyebrow{color:var(--vnc)}.hd2 .lede{margin-top:.4em}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.days a{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font:500 14px/1 "Bricolage Grotesque";text-decoration:none;color:var(--ink2)}
.days a:hover{background:var(--card)}.days a[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:34px;padding-bottom:70px;align-items:start}
.lead{display:block;text-decoration:none;background:var(--night);color:#fff;border-radius:22px;padding:34px;border-top:5px solid var(--a);margin-bottom:22px}
.lead small,.sc small{font:600 10.5px/1 "Bricolage Grotesque";letter-spacing:.18em;text-transform:uppercase;color:var(--a)}
.lead h2{font:600 clamp(28px,4vw,46px)/1.08 "Bricolage Grotesque",system-ui,sans-serif;margin:.4em 0 .5em;color:#fff}
.lead p{color:#c7cad6;margin:0 0 16px;font-size:17.5px}.lead time{font:500 13px/1 "Bricolage Grotesque";color:var(--night-mut)}
.lead:hover h2{text-decoration:underline}
.g2,.g3{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sc{display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;min-width:0;border-top:3px solid var(--a)}
.sc h3{font:500 20px/1.25 "Bricolage Grotesque"}.sc p{margin:0;color:var(--ink2);font-size:15.5px}.sc time{margin-top:auto;font:500 12.5px/1.3 "Bricolage Grotesque";color:var(--mut)}
.sc:hover h3{text-decoration:underline}

function xcast(sk){var r=RNG('xcast'+sk),fa=CAST.filter(function(c){return c.role==='actor'&&isF(c.name)});if(!fa.length)fa=CAST.filter(function(c){return c.role==='actor'});var st=r.p(fa);
 return{star:st.name,show:st.show,mayor:mname(r),town:r.p(TOWNS),host:fname(r),out:r.f()<.5?'apology':'stand',c:String(r.i(40,210)),a:String(r.i(640,990)),lawyer:mname(r)}}
function fcast(sk){var r=RNG('fcast'+sk),a=r.p(CAST.filter(function(c){return c.role==='actor'})),b;do{b=r.p(CAST.filter(function(c){return c.role==='actor'&&c.show===a.show}))}while(b.name===a.name);return{a:a.name,b:b.name,show:a.show,ep:String(r.i(3,9))}}
function ecast(sk){var r=RNG('ecast'+sk),p=r.p(CAST.filter(function(c){return c.role==='presenter'})),s=r.p(CAST.filter(function(c){return c.role==='presenter'&&c.show===p.show&&c.name!==p.name}));return{p:p.name,show:p.show,s:s?s.name:pname(r),n:String(r.i(6,14))}}
function wcast(sk){var r=RNG('wcast'+sk),a=r.p(CAST.filter(function(c){return c.role==='actor'})),b=r.p(CAST.filter(function(c){return c.role==='singer'}));return{a:a.name,b:b.name,town:r.p(['Port of Erimos','Lancia','Baybay','Solaria','Heliosberg']),show:a.show}}
function bcast(sk){var r=RNG('bcast'+sk),b=r.p(BANDS),s=r.p(CAST.filter(function(c){return c.role==='singer'}));return{band:b,singer:s.name,n:String(r.i(3,6))}}
/* compose a story from template + pools */
function composeStory(tpl,desk,rng,memo,POOLX,CP){
 var o={pl:expand(tpl.pl,rng,memo,POOLX),h:expand(tpl.h,rng,memo,POOLX),k:expand(tpl.k,rng,memo,POOLX),p:tpl.p.map(function(x){return expand(x,rng,memo,POOLX)})};
 var bg=CP.BG[desk+':'+tpl.k]||CP.BG[desk+':_'];if(bg)o.bg=expand(bg,rng,memo,POOLX);
 var pv=CP.PREV&&(CP.PREV[desk+':'+tpl.k]||CP.PREV[desk+':_']);if(pv)o.pv=expand(pv,rng,memo,POOLX);
 var qs=CP.QUO[desk],qi=Math.floor(rng.f()*qs.length);o.q=expand(qs[qi],rng,memo,POOLX);o.q2=expand(qs[(qi+1+Math.floor(rng.f()*(qs.length-1)))%qs.length],rng,memo,POOLX);
 o.nx=expand(rng.p(CP.NEXT[desk+':'+tpl.k]||CP.NEXT[desk]),rng,memo,POOLX);return o}
/* ---- LTV site (Meridian) ---- */
var NOW=(function(){var m=/[?&]now=(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/.exec(location.search);return m?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]):new Date()})();
var TODAY=dkey(NOW),NOWMIN=NOW.getHours()*60+NOW.getMinutes();
var LAUNCH=new Date(2026,8,21,12,0),LKEY=dkey(LAUNCH); /* 21 Ennia 166 AAX */
var LIVE=TODAY>=LKEY;
function dayType(d){return d===0?'su':d===6?'er':d===5?'fy':'wk'}
function sMins(t){var p=t.split(':');return +p[0]*60+ +p[1]}
function sCur(l,m){var ix=-1;for(var i=0;i<l.length;i++)if(sMins(l[i][0])<=m)ix=i;return ix}
function daysSince(){return Math.max(0,Math.round((fromKey(TODAY)-LAUNCH)/86400000))}

/* people */
var PPL=(function(){var r=RNG('ltv-people'),u={},o={};['a1','a2','a3','a4','a5','a6','a7'].forEach(function(k,i){var n;do{n=(i%2===0)?fname(r):pname(r)}while(u[n]||CAST.some(function(c){return c.name===n}));u[n]=1;o[k]=n});return o})();

 day:['LTV Daybreak','News &amp; magazine','Weekdays 06:00','The morning on channel 4: the overnight news, the papers, the weather and a sofa. Presented by '+PPL.a1+' and '+PPL.a2+'.'],

 six:['LTV News at Six','News','Daily 18:00','The regions first: the capital, Lancia, Ezechiel and the islands.'],

 week:['The Week','Current affairs','Sundays 19:30','Seven days, one long conversation.']
};
function row(t,k){var s=SH[k];return[t,s[0],s[1],s[3]]}
var SCHED4=(function(){
 var wk=[row('06:00','day'),row('09:00','open'),row('12:00','noon'),row('13:00','long'),row('15:00','cine'),row('17:00','mini'),row('18:00','six'),row('19:00','seven'),row('19:40','fore'),row('20:00','red'),row('21:00','prime'),row('22:00','sport'),row('22:30','late'),['23:00','Overnight','Films','Features until the signal closes.']];
 var fy=wk.slice(0,9).concat([row('20:00','gran'),row('21:00','prime'),row('22:30','late'),wk[13]]);
 var er=[['07:00','Little Noon: Weekend','Family','Morning stories and cartoons.'],['10:00','Open House: Weekend','Daytime talk','Longer interviews and a guest cook.'],['13:00','Erday Cinema','Film','An afternoon feature.'],['16:00','LTV Sport Live','Sport','Live from the day&rsquo;s fixtures.'],row('18:00','six'),row('19:00','seven'),row('19:30','quiz'),['21:00','Prime Cinema: Premiere','Film','A first showing on LTV.'],['23:00','Overnight','Films','Features until the signal closes.']];
 var su=[['08:00','Sunday Daybreak','News','The week ahead, the papers and a sofa.'],['11:00','Open House: Omnibus','Daytime talk','The week in one sitting.'],['14:00','The Longview','Documentary','A documentary from the archive.'],['16:00','Sunday Cinema','Film','A family feature.'],row('18:00','six'),row('19:00','seven'),row('19:30','week'),['21:00','Prime Cinema','Film','The evening feature.'],['23:00','Overnight','Films','Features until the signal closes.']];
 return{wk:wk,fy:fy,er:er,su:su}})();

/* ratings, seeded; grows from launch */
var RS=[['LTV News at Seven',380],['Redline',340],['The Big Quiz',300],['The Granary',250],['Prime Cinema',230],['LTV Daybreak',160],['The Week',120],['Afternoon Cinema',90]];
function growth(){return .55+.45*(1-Math.exp(-daysSince()/25))}
function weekKey(d){return dkey(addDays(d,-d.getDay()))}
function ratings(wk){var r=RNG('lr'+wk),g=growth();var rows=RS.map(function(s){return{n:s[0],a:Math.round((s[1]*g+r.i(-25,25)))}});rows.sort(function(a,b){return b.a-a.a});return rows}
function shareOf(wk){var r=RNG('ls'+wk);return Math.max(1,(6+9*(1-Math.exp(-daysSince()/25))+(r.f()-.5)*1.2)).toFixed(1)}

/* views */
var A=document.getElementById('app');
function lnk(t){return /^(LTV News at Seven|LTV News at Six|Noon Report|Late Edition)/.test(t)?'<a href="#/shows#news">'+t+'</a>':t}
function schedList(d,live){var l=SCHED4[dayType(d.getDay())],idx=live?sCur(l,NOWMIN):-1;
 return'<ul class="sch" style="--a:var(--gold)">'+l.map(function(x,i){return'<li class="'+(live?(i===idx?'now':i<idx?'past':''):'')+'"><time>'+x[0]+'</time><div><b>'+x[1]+'</b><small>'+x[2]+'</small>'+(i===idx?'<span class="onair">On now</span>':'')+'<p>'+x[3]+'</p></div></li>'}).join('')+'</ul>'}
function nowBox(){var l=SCHED4[dayType(NOW.getDay())],i=sCur(l,NOWMIN),cur=i>=0?l[i]:null,nx=l[i+1];
 if(!LIVE)return'<div class="box"><h4>Channel 4</h4><p class="big">On air from '+sdate(LAUNCH)+'</p><p class="mut">LTV returns to television on 21 Ennia 166 AAX.</p></div>';
 return'<div class="box"><h4>On now &middot; Channel 4</h4><p class="big">'+(cur?cur[1]:'Closed')+'</p><p class="mut">'+(nx?'Next, '+nx[0]+': '+nx[1]:'The signal closes at 23:00 on weekends; films run overnight on weekdays.')+'</p></div>'}
function tonight(){var h='<section class="hero wrap"><div class="herol"><div class="eyebrow">Channel 4 &middot; '+wdate(NOW)+'</div><svg class="ltvbig" viewBox="0 0 259 159.5" role="img" aria-label="LTV"><use href="#ltv" width="259" height="159.5"/></svg><p class="lede">LTV is Meridian&rsquo;s television channel: news from its own newsroom, drama, films and quizzes, on channel 4.</p></div><div class="heror">'+nowBox()+'</div></section>';
 h+='<div class="wrap grid2"><div><h3 class="sh" style="margin-top:0">Today on LTV</h3>'+schedList(NOW,LIVE)+'<p class="note" style="margin-top:14px"><a class="visit" href="#/week">The full week &rarr;</a></p></div><aside class="side">';
 var rt=ratings(weekKey(NOW)).slice(0,3);
 h+='<div class="box"><h4>Most watched this week</h4>'+rt.map(function(x,i){return'<div class="wrow t3"><span>'+(i+1)+'. '+x.n+'</span><span></span><b>'+x.a+'k</b></div>'}).join('')+'<a class="visit" href="#/shows">Programmes &rarr;</a></div>';
 h+='<div class="box"><h4>Coming next</h4><p class="big">LTV 5</p><p class="mut">A second channel on channel 5 is planned, with a block on public access channel 9. Subject to approval.</p><a class="visit" href="#/about">About LTV &rarr;</a></div></aside></div>';return h}
function weekV(){var d0=location.hash.split('/')[2],h='<section class="hd2 wrap"><div class="eyebrow">Channel 4</div><h1>The <em>week</em> on LTV</h1><p class="lede">Every programme, every day.</p><div class="days">',sd=addDays(NOW,-NOW.getDay()),sel=d0?+d0:TODAY;
 for(var i=0;i<7;i++){var d=addDays(sd,i),k=dkey(d);h+='<a href="#/week/'+k+'" aria-current="'+(k===sel)+'">'+WDAYS[d.getDay()].slice(0,3)+' '+d.getDate()+'</a>'}
 var cd=fromKey(sel);return h+'</div></section><div class="wrap" style="padding-bottom:70px"><h3 class="sh" style="margin-top:0">'+wdate(cd)+'</h3>'+(sel<LKEY?'<p class="note">LTV was not yet on air on this day. It returned on 21 Ennia 166 AAX.</p>':schedList(cd,sel===TODAY))+'</div>'}
function showsV(){var h='<section class="hd2 wrap"><div class="eyebrow">Programmes</div><h1>On <em>LTV</em></h1><p class="lede">News from Meridian&rsquo;s own newsroom, and the drama, films and quizzes around it.</p></section><div class="wrap" style="padding-bottom:70px"><div class="g3">';
 Object.keys(SH).forEach(function(k){var s=SH[k];h+='<div class="sc" id="'+(s[1]==='News'?'news':k)+'" style="--a:var(--gold)"><small>'+s[1]+'</small><h3>'+s[0]+'</h3><p>'+s[3]+'</p><time>'+s[2]+'</time></div>'});
 return h+'</div><h3 class="sh">Most watched this week</h3><div class="tw"><table class="tb"><thead><tr><th>#</th><th>Programme</th><th>Audience</th></tr></thead><tbody>'+ratings(weekKey(NOW)).map(function(x,i){return'<tr><td>'+(i+1)+'</td><td><b>'+x.n+'</b></td><td>'+x.a+'k</td></tr>'}).join('')+'</tbody></table></div><p class="note" style="margin-top:12px">LTV&rsquo;s share of the national audience this week: '+shareOf(weekKey(NOW))+'%.</p></div>'}
function aboutV(){return'<section class="hd2 wrap"><div class="eyebrow">About</div><h1>About <em>LTV</em></h1><p class="lede">LTV, Lumen Television, is a commercial broadcaster owned by Meridian. It went off the air at the end of the civil war and returned to television on 21 Ennia 166 AAX, on channel 4.</p></section><div class="wrap" style="padding-bottom:70px"><div class="g2"><div class="sc" style="--a:var(--gold)"><small>Its own</small><h3>Made by LTV</h3><p>LTV makes its own programmes and its own news, from its own newsroom.</p></div><div class="sc" style="--a:var(--gold)"><small>Competition</small><h3>One voice among several</h3><p>LTV was built to compete.</p></div></div>'+
 '<h3 class="sh">A short history</h3><ul class="tl" style="--a:var(--gold)"><li><time>c. 136 AAX</time><div><b>Lumen</b>Lumen Television is set up as a second licence under another name, at a time when its programmes might otherwise have been shut.</div></li><li><time>160 AAX</time><div><b>Off air</b>Lumen goes off the air at the end of the civil war.</div></li><li><time>166 AAX</time><div><b>New identity</b>Meridian relaunches the channel as LTV, with a new mark and a new colour scheme.</div></li><li><time>21 Ennia 166 AAX</time><div><b>On air</b>LTV returns to television on channel 4.</div></li></ul>'+
 '<h3 class="sh">What comes next</h3><div class="g2"><div class="sc" style="--a:var(--gold)"><small>Planned</small><h3>LTV 5</h3><p>A second channel, on channel 5, for younger viewers and for sport that is not on the established channels. Not yet on air.</p></div><div class="sc" style="--a:var(--gold)"><small>Planned</small><h3>A block on channel 9</h3><p>A strand on the public access channel for civic and regional programmes. It would be made by LTV and shown on terms set by the Federal Media Authority.</p></div></div><p class="note" style="margin-top:14px">Both are subject to the Authority&rsquo;s approval, and neither has a start date.</p></div>'}
function route(){var p=location.hash.replace(/^#\/?/,'').split('/'),r=p[0],nav=document.querySelectorAll('#nav a[data-r]');
 A.innerHTML=r==='week'?weekV():r==='shows'?showsV():r==='about'?aboutV():tonight();
 for(var i=0;i<nav.length;i++)nav[i].setAttribute('aria-current',nav[i].getAttribute('data-r')===r?'page':'false');window.scrollTo(0,0)}
setupChrome('ltv-theme');window.addEventListener('hashchange',route);route();
