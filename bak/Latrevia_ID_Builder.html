<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citizen card builder</title>
<style>
:root{--s:1;--ink:#14213d;--mute:#5a6785}
*{box-sizing:border-box;print-color-adjust:exact;-webkit-print-color-adjust:exact}
body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:#dfe5f0}
.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
aside{background:#fff;padding:18px 18px 30px;height:100vh;overflow:auto;position:sticky;top:0;font:14px system-ui,sans-serif;border-right:1px solid #c5cee2}
aside h1{font:700 20px Georgia,serif;margin:0 0 12px}
aside label{display:block;margin:0 0 9px;color:var(--mute);font-size:12.5px}
aside input[type=text],aside select{display:block;width:100%;margin-top:2px;padding:7px 8px;font:15px system-ui,sans-serif;border:1px solid #b8c2da;border-radius:6px;color:var(--ink);background:#fff}
aside input[type=range]{width:100%}
aside fieldset{border:1px solid #c5cee2;border-radius:8px;margin:12px 0;padding:10px}
aside legend{font-size:13px;color:var(--ink);padding:0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:600 14px system-ui,sans-serif;padding:9px 12px;border-radius:6px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
button.p{background:var(--ink);color:#fff;width:100%;margin-top:6px}
.hint{font-size:12px;color:var(--mute);margin:8px 0 0;line-height:1.4}
.stage{padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:24px}
.cardwrap{width:calc(856px*var(--s));height:calc(540px*var(--s));flex:none;position:relative;overflow:hidden;border-radius:calc(30px*var(--s));box-shadow:0 10px 30px rgba(20,33,61,.22)}
.card{width:856px;height:540px;position:absolute;left:0;top:0;overflow:hidden;background:#f7f9fd;transform:scale(var(--s));transform-origin:0 0}
.mark{position:absolute;right:-70px;bottom:-60px;width:420px;opacity:.07}
.head,.bh{position:absolute;left:0;top:0;right:0;height:132px;color:#fff}
.head{background:var(--h)}.bh{background:var(--ink)}
.sl{position:absolute;left:28px;top:18px;width:96px;height:96px;border-radius:50%;background:#fff;overflow:hidden}
.sl svg,.sl img{width:100%;height:100%;display:block}.sl img.ctn{object-fit:contain;padding:10px}
.fl{position:absolute;right:28px;top:26px;width:160px;height:80px;object-fit:cover;border:3px solid #fff}
.t{position:absolute;left:146px;top:22px;width:500px;line-height:1.15}
.t b{display:block;font-size:30px}.t span{display:block;font-size:17px;opacity:.92;margin-top:4px}.t i{display:block;font-size:22px;margin-top:10px;font-style:normal}
.bh .t{top:26px}.bh .t b{font-size:24px}.bh .t span{font-size:15px;line-height:1.3;margin-top:6px}
.rule{position:absolute;left:0;right:0;top:132px;height:14px;background:linear-gradient(#fff 0 3px,var(--a) 3px 11px,#fff 11px 14px)}
.rule.g{background:linear-gradient(#fff 0 3px,#f2c335 3px 11px,#fff 11px 14px)}
.photo{position:absolute;left:36px;top:178px;width:220px;height:282px;border:4px solid var(--h);border-radius:10px;background:#e9eef8;overflow:hidden;cursor:grab;touch-action:none}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 50%;pointer-events:none}
.fields{position:absolute;left:286px;top:172px;right:36px;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.f label{display:block;font:12.5px system-ui,sans-serif;color:var(--mute);margin-bottom:1px}
.f div{font-size:24px;line-height:1.15;min-height:28px;border-bottom:1px solid #c5cee2;padding-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f{min-width:0}.f.w{grid-column:1/3}.f.s div{font-size:30px;font-weight:700}
.foot,.bf{position:absolute;left:0;right:0;bottom:0;height:54px;background:var(--h);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 36px;font:15px system-ui,sans-serif}
.bf{background:var(--ink)}.foot em,.bf em{font:17px Georgia,serif}
.no{font:22px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em}
.bb{position:absolute;left:36px;right:36px;top:170px;font-size:18.5px;line-height:1.5}.bb p{margin:0 0 10px}
.bb small{display:block;font:13.5px/1.45 system-ui,sans-serif;color:var(--mute)}
.sig{position:absolute;left:36px;bottom:78px;width:360px}.au{position:absolute;left:430px;right:36px;bottom:78px}
.sig label,.au label{display:block;font:12.5px system-ui,sans-serif;color:var(--mute)}
.sig div{height:46px;border-bottom:1px solid var(--ink);font:italic 30px "Brush Script MT","Segoe Script",cursive;padding-top:4px}
.au div{font-size:17px;line-height:1.3}
.spec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.spec span{transform:rotate(-18deg);font:700 120px Georgia,serif;color:#b02032;opacity:.13;letter-spacing:.06em}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{height:auto;position:static}}
@page{size:85.6mm 54mm;margin:0}
@media print{
:root{--s:.377953!important}
html,body{background:#fff;margin:0;height:auto}aside{display:none!important}
.app{display:block}.stage{padding:0;display:block}
.card{transform:none!important;position:relative;zoom:.377953}
.cardwrap{width:85.6mm;height:54mm;break-after:page;break-inside:avoid;border-radius:0;box-shadow:none;margin:0}.cardwrap:last-child{break-after:auto}
}
</style></head>
<body><div class="app">
<aside>
<h1>Citizen card builder</h1>
<label>Issuer<select id="who"></select></label>
<div id="fs"></div>
<fieldset><legend>Photograph</legend>
<label>Choose an image<input type="file" id="file" accept="image/*"></label>
<label>Zoom<input type="range" id="z" min="1" max="3.5" step="0.01" value="1"></label>
<label>Move left / right<input type="range" id="x" min="-120" max="120" value="0"></label>
<label>Move up / down<input type="range" id="y" min="-150" max="150" value="0"></label>
<div class="row"><button id="rp">Reset position</button><button id="np">Remove photo</button></div>
<p class="hint">You can also drag the photo directly on the card.</p></fieldset>
<label><input type="checkbox" id="spec" checked> Show SPECIMEN watermark</label>
<button class="p" id="pdf">Save as PDF (front and back)</button>
<p class="hint">In the print dialog choose "Save as PDF". The page size is already set to a card (85.6 × 54 mm), with the front on page 1 and the back on page 2.</p>
</aside>
<main class="stage"><div class="cardwrap"><div class="card" id="front"></div></div><div class="cardwrap"><div class="card" id="back"></div></div></main>
</div>

const F=(l,v,cl="")=>`<div class="f ${cl}"><label>${l}</label><div>${E(v)}</div></div>`;
q("front").innerHTML=`<img class="mark" src="${c.fr?IMG.soc:IMG.lat}" alt=""><div class="head"><div class="sl">${sl}</div><div class="t"><b>${L.top}</b><span>${E(S.sub)}</span><i>${L.kind}</i></div><img class="fl" src="${IMG[c.flag]}" alt=""></div><div class="rule"></div><div class="photo" id="photo">${ph}</div><div class="fields">${F(L.sur,S.sur,"s w")+F(L.giv,S.giv,"w")+F(L.dob,S.dob)+F(L.pob,S.pob)+F(L.is,S.is)+F(L.ex,S.ex)}</div><div class="foot"><span>${L.no}</span><span class="no">${E(S.no)}</span><em>Iustitia. Libertas. Aequitas.</em></div>${S.spec?'<div class="spec"><span>SPECIMEN</span></div>':""}`;
q("back").style.setProperty("--ink","#14213d");
q("back").innerHTML=`<div class="bh"><div class="sl" style="background:none"><img src="${IMG.cws}" alt=""></div><div class="t"><b>${L.cw}</b><span>${L.cs}</span></div><img class="fl" src="${IMG.cwf}" alt=""></div><div class="rule g"></div><div class="bb"><p>${L.mv}</p><small>${L.nt}</small></div><div class="sig"><label>${L.sig}</label><div>${E(S.sig)}</div></div><div class="au"><label>${L.by}</label><div>${E(S.auth)}</div></div><div class="bf"><span class="no">${E(S.no)}</span><em>${E(c.nm)}</em></div>${S.spec?'<div class="spec"><span>SPECIMEN</span></div>':""}`}
function fitText(){document.querySelectorAll(".f div").forEach(d=>{d.style.fontSize="";let s=parseFloat(getComputedStyle(d).fontSize);while(d.scrollWidth>d.clientWidth&&s>13){s-=1;d.style.fontSize=s+"px"}})}
const _r=render;render=function(){_r();fitText()};
function sync(){FIELDS.forEach(([k])=>q("f_"+k).value=S[k]);["z","x","y"].forEach(k=>q(k).value=S[k]);q("who").value=S.who}
q("who").innerHTML=Object.entries(I).map(([k,c])=>`<option value="${k}">${c.nm}</option>`).join("");
q("fs").innerHTML=FIELDS.map(([k,l,p])=>`<label>${l}<input type="text" id="f_${k}" data-k="${k}" placeholder="${p||""}"></label>`).join("").replace('id="f_no" data-k="no"','id="f_no" data-k="no"');
q("fs").querySelector("#f_no").insertAdjacentHTML("afterend",'<button id="gn" style="margin-top:5px;width:100%">Generate a new number</button>');
q("fs").oninput=e=>{if(e.target.dataset.k){S[e.target.dataset.k]=e.target.value;render()}};
q("gn").onclick=e=>{e.preventDefault();S.no=genNo(I[S.who].pre);sync();render()};
q("who").onchange=e=>{pick(e.target.value);sync();render()};
q("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.photo=r.result;S.z=1;S.x=S.y=0;sync();render()};r.readAsDataURL(f)};
["z","x","y"].forEach(k=>q(k).oninput=e=>{S[k]=+e.target.value;render()});
q("rp").onclick=()=>{S.z=1;S.x=S.y=0;sync();render()};q("np").onclick=()=>{S.photo="";q("file").value="";render()};
q("spec").onchange=e=>{S.spec=e.target.checked;render()};
q("pdf").onclick=()=>{const t=document.title;document.title=("Card_"+S.sur+"_"+S.giv).replace(/\s+/g,"_");window.print();document.title=t};
let drag=null;const sc=()=>+getComputedStyle(document.documentElement).getPropertyValue("--s")||1;
q("front").addEventListener("pointerdown",e=>{if(S.photo&&e.target.closest("#photo")){drag={px:e.clientX,py:e.clientY,x:S.x,y:S.y};e.preventDefault()}});
addEventListener("pointermove",e=>{if(!drag)return;S.x=Math.round(drag.x+(e.clientX-drag.px)/sc());S.y=Math.round(drag.y+(e.clientY-drag.py)/sc());q("x").value=S.x;q("y").value=S.y;render()});
addEventListener("pointerup",()=>drag=null);
function fit(){const w=document.querySelector(".stage").clientWidth-32;document.documentElement.style.setProperty("--s",Math.min(1,w/856))}
addEventListener("resize",fit);
pick("ER");S.pob="Port of Erimos, Erimos";S.no="ER-4081-7263-5";fit();sync();render();
</script></body></html>
