<title>LPN</title><meta name="description" content="LPN, the Luisara People's Network: VBN's private network in Luisara. News, regional bulletins, telenovelas and VBN programmes in Spanish.">
<style>

:root{
  --bg:#f3f2ed;--bg2:#eae8e0;--card:#fbfaf6;--ink:#0a0b10;--ink2:#3a3d48;--mut:#656874;--line:#d6d3c8;
  --brand:#3a52c9;--brand-ink:#fff;--night:#0b0d12;--night2:#12151c;--night-ink:#f4f4f0;--night-mut:#9a9eae;--night-line:#272d3b;
  --vnc:#3f8a3a;--v3:#c4457a;--vrs:#3f86a8;--one:#3a52c9;--live:#bf4a46;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f14;--bg2:#12151c;--card:#171b24;--ink:#f1f1ec;--ink2:#c9cbd4;--mut:#8e92a3;--line:#2a3040;
  --brand:#93a3e6;--brand-ink:#0b0d12;--vnc:#7fbf74;--v3:#e58aab;--vrs:#6fb5d4;--one:#93a3e6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f14;--bg2:#12151c;--card:#171b24;--ink:#f1f1ec;--ink2:#c9cbd4;--mut:#8e92a3;--line:#2a3040;
  --brand:#93a3e6;--brand-ink:#0b0d12;--vnc:#7fbf74;--v3:#e58aab;--vrs:#6fb5d4;--one:#93a3e6;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Verdana,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.lg{display:block;height:auto}
.soon{display:inline-flex;align-items:center;gap:8px;font:500 13px/1 Verdana;letter-spacing:.04em;color:var(--mut)}
.soon::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mut);opacity:.6}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}

/* header */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;flex:none}
.brand .wm{height:23px;width:auto;aspect-ratio:681/443;color:var(--ink)}
.brand small{font:600 10.5px/1 Verdana;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);padding-left:12px;border-left:1px solid var(--line)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 11px;font:500 14.5px/1 Verdana;color:var(--ink2);text-decoration:none;border-radius:8px}
nav.main a:hover{background:var(--bg2);color:var(--ink)}
.tools{display:flex;align-items:center;gap:10px}
.date{font:500 12.5px/1.2 Verdana;color:var(--mut);white-space:nowrap;text-align:right}
.ib{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;font:inherit}
.ib:hover{background:var(--bg2)}
.ib svg{width:17px;height:17px}
.menu{display:none}
@media (max-width:980px){
  .date{display:none}.menu{display:inline-grid}
  nav.main{display:none;position:absolute;left:0;right:0;top:62px;flex-direction:column;background:var(--bg);padding:10px 16px 16px;border-bottom:1px solid var(--line);margin:0}
  nav.main.open{display:flex}
  nav.main a{padding:13px 8px;font-size:16px}
  .top .wrap{justify-content:space-between}
  .tools{margin-left:auto}
}
@media (max-width:480px){.brand small{display:none}}


/* footer */
footer{background:var(--night);color:var(--night-ink);padding-block:64px 36px}
footer .top2{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-start;padding-bottom:36px;border-bottom:1px solid var(--night-line)}
footer .wm{height:36px;aspect-ratio:681/443;color:#fff;width:auto}
footer .addr{color:var(--night-mut);font-size:15px;margin-top:14px;max-width:34ch}
footer .links{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:8px 40px}
footer .links a{color:#d8dae4;text-decoration:none;font:500 15px Verdana}footer .links a:hover{color:#fff;text-decoration:underline}
footer .partners{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:34px}
footer .partners small{font:600 11px/1 Verdana;letter-spacing:.18em;text-transform:uppercase;color:var(--night-mut);margin-right:6px}
footer .legal{margin-top:32px;color:var(--night-mut);font-size:13.5px;max-width:90ch}


.visit{font:600 14px/1 Verdana;color:var(--brand);text-decoration:none}.visit:hover{text-decoration:underline}.eyebrow{font:600 12px/1 Verdana;letter-spacing:.2em;text-transform:uppercase}h1,h2,h3{margin:0}h1{font:600 clamp(46px,7vw,98px)/.96 Verdana,system-ui,sans-serif}h1 em{font-style:italic}.lede{max-width:64ch;color:var(--ink2);font-size:19px}.note{color:var(--mut);font-size:14.5px}.rv{opacity:1}.js .rv{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.js .rv.in{opacity:1;transform:none}@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none}}

.hd2{padding-block:56px 18px}.hd2 h1{font-size:clamp(40px,6vw,76px);margin-block:.2em .25em}.hd2 h1 em{color:var(--vnc)}
.hd2 .eyebrow{color:var(--vnc)}.hd2 .lede{margin-top:.4em}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.days a{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font:500 14px/1 Verdana;text-decoration:none;color:var(--ink2)}
.days a:hover{background:var(--card)}.days a[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:34px;padding-bottom:70px;align-items:start}
.lead{display:block;text-decoration:none;background:var(--night);color:#fff;border-radius:22px;padding:34px;border-top:5px solid var(--a);margin-bottom:22px}
.lead small,.sc small{font:600 10.5px/1 Verdana;letter-spacing:.18em;text-transform:uppercase;color:var(--a)}
.lead h2{font:600 clamp(28px,4vw,46px)/1.08 Verdana,system-ui,sans-serif;margin:.4em 0 .5em;color:#fff}
.lead p{color:#c7cad6;margin:0 0 16px;font-size:17.5px}.lead time{font:500 13px/1 Verdana;color:var(--night-mut)}
.lead:hover h2{text-decoration:underline}
.g2,.g3{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sc{display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;min-width:0;border-top:3px solid var(--a)}
.sc h3{font:500 20px/1.25 Verdana}.sc p{margin:0;color:var(--ink2);font-size:15.5px}.sc time{margin-top:auto;font:500 12.5px/1.3 Verdana;color:var(--mut)}
.sc:hover h3{text-decoration:underline}
.sh{font:600 30px/1.1 Verdana,system-ui,sans-serif;margin:42px 0 16px}
.tl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:14px 20px;border-top:1px solid var(--line);border-left:3px solid var(--a)}
.tl li:first-child{border-top:0}.tl time{font:500 14px/1.5 Verdana;color:var(--mut);font-variant-numeric:tabular-nums}
.tl a{text-decoration:none}.tl a:hover{text-decoration:underline}.tl b{font:600 11px/1 Verdana;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin-right:6px}
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:80px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.box h4{margin:0 0 12px;font:600 11px/1 Verdana;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.box .visit{display:inline-block;margin-top:12px}.mut{color:var(--mut)}.big{font:600 26px/1.1 Verdana,system-ui,sans-serif;margin:0}
.wrow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px;align-items:baseline}.wrow:first-of-type{border-top:0}
.wrow i{font-style:normal;color:var(--mut)}.wrow.t3{grid-template-columns:1fr auto auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb th,.tb td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
.tb thead th{border-top:0;font:600 11px/1 Verdana;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.side .tb th,.side .tb td{padding:6px 8px;font-size:14px}.wxt td{white-space:normal;vertical-align:top;min-width:120px}.wxt small{color:var(--mut)}
.res{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.res li{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.res li span:last-child{text-align:right}.res b{font:600 24px/1 Verdana,system-ui,sans-serif}
.art{max-width:760px;padding-block:44px 80px}.art h1{font-size:clamp(34px,5vw,58px);margin-block:.3em .3em}.art p{font-size:18.5px;color:var(--ink2)}
.art .meta{font:500 13.5px/1.4 Verdana;color:var(--mut);margin-bottom:28px}.art .g3{margin-top:6px}.art .sc p{font-size:15px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}.side{position:static}.g3{grid-template-columns:1fr}.res{grid-template-columns:1fr}}

 '<h3 class="sh">'+L('A short history','Una breve historia')+'</h3><ul class="tl" style="--a:var(--gold)">'+ltl('c. 60s AAX',L('A Spanish service','Un servicio en español'),L('VBN sets up a Spanish-language service for Luisara as television spreads after the Reconquest.','VBN crea un servicio en español para Luisara cuando la televisión se extiende tras la Reconquista.'))+ltl('133–141 AAX',L('Out of reach','Fuera de alcance'),L('As VBN’s independence is pressured in Latrevia, LPN, under Luisaran law, keeps broadcasting.','Mientras en Latrevia se presiona la independencia de VBN, LPN, bajo la ley luisareña, sigue emitiendo.'))+ltl('164 AAX',L('A separate line','Una línea aparte'),L('When VNC is placed in trust, LPN stays with the Corporation: a private network, not a public one.','Cuando VNC pasa a un fideicomiso, LPN sigue con la Corporación: una cadena privada, no pública.'))+ltl('166 AAX',L('Today','Hoy'),L('Five regional bulletins, two telenovelas and a growing list of VBN programmes in Spanish.','Cinco boletines regionales, dos telenovelas y una lista creciente de programas de VBN en español.'))+'</ul>'+
 '<h3 class="sh">'+L('Part of VBN','Parte de VBN')+'</h3><div class="g2"><div class="sc" style="--a:var(--gold)"><small>VBN</small><h3>VBN 1</h3><p>'+L('The flagship channel whose programmes LPN carries in Spanish.','El canal principal cuyos programas emite LPN en español.')+'</p><a class="visit" href="vbn.html">'+L('Visit VBN','Visitar VBN')+' &rarr;</a></div><div class="sc" style="--a:var(--gold)"><small>'+L('Parent','Matriz')+'</small><h3>VBN Corporation</h3><p>'+L('The Vernalius family company that owns LPN.','La empresa de la familia Vernalius, propietaria de LPN.')+'</p><a class="visit" href="corporate.vbn.html">'+L('Visit the Corporation','Visitar la Corporación')+' &rarr;</a></div></div><p class="note" style="margin-top:14px">'+L('The Republic of Luisara’s own government site is opening soon.','El sitio del gobierno de la República de Luisara abrirá pronto.')+'</p></div>'}
