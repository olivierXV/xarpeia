<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Николатское царство · Справочная система</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath d='M0 0L64 64M64 0L0 64' stroke='%23cf4f85' stroke-width='9'/%3E%3Cpolygon points='32,12 56,32 32,52 8,32' fill='%23000'/%3E%3Ccircle cx='32' cy='30' r='8' fill='%23f3a900'/%3E%3C/svg%3E">
<style>
:root{--desk:#0a0608;--face:#2d2227;--hi:#7a6870;--sh:#140d10;--dk:#000;--ui:#eadde1;--win:#0b0709;--txt:#e6dadd;--mut:#a8979d;--link:#f08cb5;--head:#f3a900;--tb1:#000;--tb2:#cf4f85;--sel:#cf4f85;--selt:#fff;--line:#3b2a31;--d1:#150b10;--d2:#0a0608}
:root[data-theme=lilac]{--desk:#a893b8;--d1:#b3a0c2;--d2:#a893b8;--face:#e4d9ec;--hi:#faf6fd;--sh:#8f7ea0;--dk:#2a1d36;--ui:#241a2e;--win:#fcfaff;--txt:#2a2033;--mut:#65577a;--link:#a02a78;--head:#7a2a8c;--tb1:#33194a;--tb2:#8a4fb0;--sel:#8a4fb0;--selt:#fff;--line:#d3c6df}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ui);font:13px/1.4 Tahoma,"MS Sans Serif",Verdana,Arial,sans-serif;padding-bottom:38px}
button{font:inherit;color:var(--ui)}
a{color:var(--link)}
a:focus-visible,button:focus-visible{outline:1px dotted var(--ui);outline-offset:-4px}
.raised{box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--face)}
.sunk{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh),inset -2px -2px var(--face),inset 2px 2px var(--dk)}
.btn{background:var(--face);border:0;padding:4px 12px;cursor:pointer;color:var(--ui);text-decoration:none;display:inline-block;font:inherit;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--face)}
.btn:active,.btn.on{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--face),inset 2px 2px var(--sh);padding:5px 11px 3px 13px}
.cont{padding:18px 24px 22px;font-size:14px;line-height:1.6}
.cont h1{margin:0 0 4px;font:700 24px/1.2 Arial,Helvetica,sans-serif;color:var(--head)}
.cont .dsc{margin:0 0 14px;color:var(--mut);padding-bottom:8px;border-bottom:2px solid var(--tb2)}
.cont h2.sub{margin:22px 0 8px;font:700 15px/1.3 Arial,Helvetica,sans-serif;color:var(--head);padding:3px 8px;background:var(--face);color:var(--ui);border-left:6px solid var(--tb2);box-shadow:none}
.cont p{margin:8px 0}
.y{color:var(--head);font-weight:700}.dim{color:var(--mut)}.nw{white-space:nowrap}
ul.l{margin:8px 0;padding-left:22px;list-style:square}
ul.l li{margin:5px 0}ul.l li::marker{color:var(--tb2)}
dl.kv{display:grid;grid-template-columns:minmax(120px,30%) 1fr;margin:8px 0;border:1px solid var(--line)}
dl.kv dt,dl.kv dd{margin:0;padding:6px 10px;border-bottom:1px solid var(--line)}
dl.kv dt{background:var(--face);color:var(--ui);font-weight:700}
dl.kv dt:nth-last-child(2),dl.kv dd:last-child{border-bottom:0}
table.t{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
table.t th{background:var(--face);color:var(--ui);text-align:left;padding:5px 8px;border:1px solid var(--line)}
table.t td{padding:5px 8px;border:1px solid var(--line);vertical-align:top}
.fig{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0;align-items:flex-end}
.fig figure{margin:0}.fig figcaption{font-size:12px;color:var(--mut);margin-top:4px}
.fig svg{display:block;border:1px solid var(--line);max-width:100%;height:auto}
.welcome{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.welcome svg{display:block;max-width:100%;height:auto;border:2px solid var(--dk)}
.welcome p{margin:6px 0;max-width:52ch}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin:6px 0}
.icon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px;text-decoration:none;color:var(--txt);border:1px solid transparent}
.icon:hover,.icon:focus-visible{border:1px dotted var(--mut);background:rgba(128,128,128,.14)}
.icon b{font-size:13px}.icon span{font-size:12px;color:var(--mut);line-height:1.3}
.pager{display:flex;gap:6px;flex-wrap:wrap;margin-top:26px;padding-top:12px;border-top:1px solid var(--line)}
.cred{margin-top:20px;font-size:12.5px;color:var(--mut)}

body{padding:0;background:var(--desk)}
body{background:repeating-linear-gradient(135deg,var(--d1) 0 22px,var(--d2) 22px 44px)}
.site{max-width:1440px;margin:0 auto;padding:12px}
.win{background:var(--face);padding:3px;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--sh),inset 2px 2px var(--face)}
.tb{display:flex;align-items:center;gap:8px;padding:4px 8px;background:linear-gradient(90deg,var(--tb1),var(--tb2));color:#fff;font-weight:700;font-size:14px}
.tb .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb.big{font-size:20px;padding:8px 12px;font-family:Arial,Helvetica,sans-serif}
.tb small{font-weight:400;font-size:12.5px}
.bd{background:var(--win);color:var(--txt);margin-top:3px;padding:10px 12px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--sh),inset -2px -2px var(--face),inset 2px 2px var(--dk)}
.navrow{display:flex;flex-wrap:wrap;gap:4px;padding:6px 4px 4px;align-items:center}
.navrow .sp{flex:1}
.navrow .btn{font-size:13px;padding:4px 10px}
.navrow .btn.cur{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--face),inset 2px 2px var(--sh);padding:5px 9px 3px 11px;font-weight:700}
.cols{display:grid;grid-template-columns:240px minmax(0,1fr) 270px;gap:10px;margin-top:10px;align-items:start}
.side{display:flex;flex-direction:column;gap:10px;position:sticky;top:8px}
.side ul{list-style:none;margin:0;padding:0}.side li{padding:3px 0}
.side li a{display:flex;gap:6px;align-items:center;text-decoration:none;color:var(--txt)}
.side li a:hover{text-decoration:underline}
.side li a.cur{font-weight:700;color:var(--head)}
.side dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:13px}.side dt{color:var(--mut)}.side dd{margin:0}
.side .fl svg{display:block;max-width:100%;height:auto;border:1px solid var(--dk)}
.side .bd{font-size:13.5px}
.cont{padding:16px 22px 22px}
.foot{margin-top:10px;font-size:12.5px;color:var(--ui);padding:6px 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cont h2.sub,.cont [id]{scroll-margin-top:12px}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}.side{position:static}.sl{order:2}.sr{order:3}.cont{padding:12px 12px 18px}dl.kv{grid-template-columns:1fr}.tb.big{font-size:17px}}
@media print{.navrow,.side,.foot{display:none}.site{padding:0}.bd{box-shadow:none;background:#fff;color:#000}}
</style></head><body>
<div class="site">
<header class="win"><div class="tb big"><span id="tbi"></span><span class="tt" id="tbt"></span><small id="clk"></small></div><nav class="navrow" id="nav" aria-label="Sections"></nav></header>
<div class="cols"><aside class="side sl" id="left"></aside><section class="win"><div class="tb"><span class="tt" id="mt"></span></div><main class="bd cont" id="main" tabindex="-1"></main></section><aside class="side sr" id="right"></aside></div>
<footer class="win foot" id="foot"></footer>
</div>
<script>
var LANG='en';try{var sl=localStorage.getItem('nicolatia-lang');if(sl==='ru'||sl==='en')LANG=sl;else if((navigator.language||'').slice(0,2)==='ru')LANG='ru'}catch(e){}
function T(ru,en){return LANG==='ru'?ru:en}
var MO_EN=['Ixarius','Savrius','Caspius','Helius','Nerius','Kiomus','Epta','Exsilius','Ennia','Deka','Endeka','Dodeka'],MO_RU=['Иксарь','Саврий','Каспий','Хелий','Нерий','Киом','Эпта','Эксилий','Эния','Дека','Эндека','Додека'];
var DY_EN=['Sunday','Monday','Stasday','Wawsday','Winsday','Fyrday','Erday'],DY_RU=['Первник','Вторник','Третник','Четверг','Пятница','Шестник','Седмик'];
function now(){var q=location.search.match(/now=(\d{12})/);if(q){var s=q[1];return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12))}return new Date()}
function pad(n){return n<10?'0'+n:n}
function clock(){var d=now();var dy=LANG==='ru'?DY_RU[d.getDay()]:DY_EN[d.getDay()],mo=LANG==='ru'?MO_RU[d.getMonth()]:MO_EN[d.getMonth()];return dy+' '+d.getDate()+' '+mo+' '+(d.getFullYear()-1860)+' AAX · '+pad(d.getHours())+':'+pad(d.getMinutes())}
/* figures */
var PINK='#cf4f85',GOLD='#f3a900';
function gold(){return '<g fill="'+GOLD+'"><path d="M853 300C853 245 925 200 1000 200S1147 245 1147 300L1134 405L1152 433L1103 500L1070 507L1063 534L1025 555H975L937 534L930 507L896 500L848 433L866 405Z"/><path d="M933 540L975 555H1025L1067 540L1062 568L1050 582H950L938 568Z"/></g><g fill="#000"><path d="M893 420Q893 387 920 387Q980 400 980 420Q980 465 913 465Q893 465 893 420Z"/><path d="M1107 420Q1107 387 1080 387Q1020 400 1020 420Q1020 465 1087 465Q1107 465 1107 420Z"/><path d="M1000 455L1025 498L1000 508L975 498Z"/></g><path d="M953 545V582M977 549V584M1000 549V584M1023 549V584M1047 545V582" stroke="#000" stroke-width="5"/><g stroke="'+GOLD+'" fill="'+GOLD+'" stroke-linecap="round"><g><path d="M1283 552C1010 600 830 730 745 828" fill="none" stroke-width="24"/><path d="M632 838Q700 815 745 828Q800 850 855 865" fill="none" stroke-width="18"/><path d="M745 828L668 895" fill="none" stroke-width="22"/><ellipse cx="650" cy="910" rx="28" ry="18" stroke="none"/></g><g transform="translate(2000 0) scale(-1 1)"><path d="M1283 552C1010 600 830 730 745 828" fill="none" stroke-width="24"/><path d="M632 838Q700 815 745 828Q800 850 855 865" fill="none" stroke-width="18"/><path d="M745 828L668 895" fill="none" stroke-width="22"/><ellipse cx="650" cy="910" rx="28" ry="18" stroke="none"/></g></g>'}
function flag(w){return '<svg viewBox="0 0 2000 1000" width="'+w+'" height="'+(w/2)+'" role="img" aria-label="'+T('Флаг Николатии','Flag of Nicolatia')+'"><rect width="2000" height="1000" fill="#000"/><path d="M-200 -100L2200 1100M2200 -100L-200 1100" stroke="'+PINK+'" stroke-width="215" fill="none"/><rect x="892" width="216" height="1000" fill="'+PINK+'"/><rect y="392" width="2000" height="216" fill="'+PINK+'"/><polygon points="410,495 993,140 1577,495 993,852" fill="#000"/>'+gold()+'</svg>'}
function seal(w){return '<svg viewBox="520 90 960 960" width="'+w+'" height="'+w+'" aria-hidden="true"><circle cx="1000" cy="570" r="455" fill="#000" stroke="'+GOLD+'" stroke-width="22"/><polygon points="1000,190 1420,570 1000,950 580,570" fill="none" stroke="'+PINK+'" stroke-width="30"/><g transform="translate(1000 570) scale(.78) translate(-1000 -570)">'+gold().replace('id="sb"','')+'</g></svg>'}

/* pages */
var P=[
{n:1,ru:'Царь',en:'The Tsar',dru:'Государь и престол',den:'The sovereign and the throne',f:function(){return ''+
 '<dl class="kv"><dt>'+T('Царь','Tsar')+'</dt><dd><span class="y">'+T('Александр IV','Aleksandr IV')+'</span> (Alexandros IV)</dd><dt>'+T('Родился','Born')+'</dt><dd>c. 114 AAX</dd><dt>'+T('На престоле','Reigning')+'</dt><dd>'+T('с c. 150 AAX','since c. 150 AAX')+'</dd><dt>'+T('Династия','Dynasty')+'</dt><dd>'+T('Дом Николая, основан c. 370 PAX','House of Nicholas, founded c. 370 PAX')+'</dd><dt>'+T('Столица','Capital')+'</dt><dd>'+T('Николатск','Nikolatsk')+'</dd></dl>'+
 '<p>'+T('Николатия — наследственная монархия. Царь — глава государства и глава правительства. Престол не стал церемониальным: Царь правит сам, лично читает донесения Комитета, назначает и смещает министров и решает политику. Нрав Александра IV спокоен и неспешен, но правление его ровное, а не пассивное.','Nicolatia is a hereditary monarchy. The Tsar is head of state and head of government. The throne has never become ceremonial: the Tsar governs, reads the Committee’s reports himself, chooses and removes ministers and decides policy. Aleksandr IV is calm and unhurried in temperament, but his rule is steady, not passive.')+'</p>'+
 '<h2 class="sub">'+T('Полномочия','Powers')+'</h2><ul class="l">'+
 '<li>'+T('<b>Исполнительная власть.</b> Министры отвечают перед Царём, а не перед законодательной властью.','<b>Executive.</b> Ministers answer to the Tsar, not to the legislature.')+'</li>'+
 '<li>'+T('<b>Война и внешняя политика.</b> Царь решает вопросы войны, мира, договоров и сношений с другими державами. Бюджетные статьи министерств войны, Двора и иностранных дел защищены: Дума не вправе снизить их ниже установленного уровня.','<b>War and foreign policy.</b> The Tsar decides on war, peace, treaties and foreign relations. The budget lines of the Ministries of War, the Court and Foreign Affairs are protected, and the Duma may not cut them below a fixed level.')+'</li>'+
 '<li>'+T('<b>Назначения.</b> Царь назначает и увольняет председателя Совета министров, министров, губернаторов, судей Сената (по представлению Сената) и половину Государственного совета.','<b>Appointments.</b> The Tsar appoints and dismisses the Chairman of the Council of Ministers, ministers, governors, the Senate’s judges (on the Senate’s nomination) and half of the State Council.')+'</li>'+
 '<li>'+T('<b>Законы.</b> Царь может наложить вето на любой закон и распустить Думу. Указ о роспуске обязан назначить новые выборы не позднее чем через шесть месяцев.','<b>Legislation.</b> The Tsar may veto any law and may dissolve the Duma. A dissolution must set the date of new elections, no more than six months away.')+'</li>'+
 '<li>'+T('<b>Чрезвычайные указы.</b> Пока Дума не заседает, Царь может издавать чрезвычайные указы с силой закона. Указ теряет силу, если Дума не утвердит его в течение двух месяцев после возобновления заседаний.','<b>Emergency decree.</b> While the Duma is not sitting, the Tsar may issue emergency decrees with the force of law. A decree lapses unless the Duma confirms it within two months of reconvening.')+'</li>'+
 '<li>'+T('<b>Церковь.</b> Царь — глава установленной церкви.','<b>Church.</b> The Tsar is the head of the established church.')+'</li>'+
 '<li>'+T('<b>Комитет.</b> Царь лично и непосредственно командует Комитетом царской безопасности (см. «Комитет царской безопасности»).','<b>The Committee.</b> The Tsar commands the Committee for Tsarist Security directly and personally (see the Committee for Tsarist Security).')+'</li></ul>'+
 '<h2 class="sub">'+T('Председатель Совета министров','The Chairman of the Council of Ministers')+'</h2>'+
 '<p>'+T('Председатель ведёт правительство изо дня в день: председательствует в Совете министров, готовит бюджет и выступает в Думе как главный представитель Царя. Он служит по воле Царя. Министры, как правило, но не обязательно, выходят из Думы и Государственного совета.','The Chairman runs the government from day to day: he chairs the Council of Ministers, prepares the budget and is the Tsar’s chief spokesman in the Duma. He serves at the Tsar’s pleasure. Ministers are usually, but not always, drawn from the Duma and the State Council.')+'</p>'+
 '<h2 class="sub">'+T('Престолонаследие','Succession')+'</h2>'+
 '<p>'+T('Престол принадлежит Дому Николая, ведущему род от Александра I, изгнанного после раскола с двоюродным братом Адрастом (c. 370 PAX). Корона переходит по наследству и не обязательно по мужской линии. Дом Николая несёт кровь Иксарваидж, но не есть Иксарваидж; он считает себя родственником дома Верналиев, а не соперником. Он хранит архив ДНК Верналиев: это единственное наследие, от которого Дом никогда не отказывался.','The throne belongs to the House of Nicholas, descended from Alexandros I, who was exiled after the schism with his cousin Adrastus (c. 370 PAX). The crown passes by hereditary succession and is not strictly male-preference. The House carries Ixarvaij’s blood but is not the Ixarvaij. It sees itself as a cousin to the Vernalius line, not a rival to it, and it keeps the Vernalius DNA archive, the one inheritance it has never put down.')+'</p>'+
 '<h2 class="sub">'+T('Флаг','The flag')+'</h2>'+
 '<div class="fig"><figure>'+flag(220)+'<figcaption>'+T('Государственный флаг','National flag')+'</figcaption></figure><figure>'+seal(96)+'<figcaption>'+T('Печать','Seal')+'</figcaption></figure></div>'+
 '<p>'+T('Чёрное поле несёт розовый прямой крест и наложенный на него розовый косой крест. В центре — золотой череп над двумя скрещёнными саблями. Крест — тот, что некогда делили двоюродные братья Верналии; косой крест — поворот, который сделал Александр, когда его изгнали. Оба наложены друг на друга и не слиты. Чёрный — траур, как чёрные края флота Латревии: Николатия приютила Ксарпея после Дня VOS и разделяет скорбь. Розовый — смягчённый домашний красный дома; золото — цвет короны.','A black field carries a rose-pink upright cross with a rose-pink saltire laid over it. At the centre is a gold skull above two crossed sabres. The cross is the one the two Vernalius cousins once shared; the saltire is the diagonal turn Alexandros took when he was exiled. They are laid over each other, never merged. Black marks mourning, as on the black borders of the Latrevian fleet ensign: Nicolatia took in Xarpeius after VOS Day and shares the grief while remaining a separate crown. Rose pink is the dynasty’s house red, softened; gold is the royal colour.')+'</p>'}},
{n:2,ru:'Основные законы',en:'The Fundamental Laws',dru:'Дарованная конституция',den:'The octroyed constitution',f:function(){return ''+
 '<dl class="kv"><dt>'+T('Вид','Type')+'</dt><dd>'+T('Дарованная (октроированная) конституция','Octroyed constitution')+'</dd><dt>'+T('Дарована','Granted')+'</dt><dd>c. 68 AAX, '+T('Николаем II','by Nikolai II')+'</dd><dt>'+T('Создали','Created')+'</dt><dd>'+T('Государственный совет и Государственную думу','The State Council and the State Duma')+'</dd></dl>'+
 '<p>'+T('Основные законы дарованы Царём и ограничивают его самого; их не принимали ни съезд, ни референдум. В Латревии конституция взята, в Николатии она дана. Законы коротки: они определяют полномочия и учреждения и не перечисляют права подробно.','The Fundamental Laws are granted by the Tsar and limit himself; they were not adopted by a convention or a referendum. Latrevia has a constitution taken; Nicolatia has a constitution given. They are short: they state powers and institutions and do not spell out rights at length.')+'</p>'+
 '<h2 class="sub">'+T('Поправки','Amendment')+'</h2>'+
 '<p>'+T('Поправки к Основным законам может предложить только Царь. Каждая палата — Государственная дума и Государственный совет — должна утвердить их.','Only the Tsar may propose amendments to the Fundamental Laws. The Duma and the State Council must each approve them.')+'</p>'+
 '<h2 class="sub">'+T('Подданные и равенство','Subjects and equality')+'</h2><ul class="l">'+
 '<li>'+T('Все подданные равны перед законом. Основные законы говорят о «всех подданных» и о «лицах обоего пола».','All subjects are equal before the law. The Fundamental Laws speak of “all subjects” and “persons of either sex.”')+'</li>'+
 '<li>'+T('Омеги в законе не названы. Омега — пол, как мужской и женский, и охвачена без упоминания: Николатия никогда не жила под теократией, лишавшей омег гражданского существования, и не нуждается в защитных формулах, которые используют латревийские документы.','Omegas are not named in Nicolatian law. Omega is a sex, like male or female, and is covered without being mentioned. Nicolatia never lived under a theocracy that stripped omegas of civil existence and has no need of the defensive naming Latrevian documents use.')+'</li>'+
 '<li>'+T('Эйлонов в Николатии называют <b>селянами</b> (<i>селяне</i>, или <i>жители</i>). Это бытовое слово без юридического веса: селянин — подданный, и только. Латревийский «эйлон» — правовая категория, а николатский «селянин» — социальное описание, поэтому в договорных текстах они не совпадают полностью.','Eulons are called <b>villagers</b> (<i>selyane</i>, or <i>zhiteli</i>) in Nicolatia. It is an everyday word with no legal weight: a villager is a subject, full stop. The Latrevian <i>Eulon</i> is a legal category and the Nicolatian <i>villager</i> a social description, so the two do not map perfectly in treaty text.')+'</li>'+
 '<li>'+T('Крепостное право отменено Манифестом об освобождении (61 AAX), получившим законную форму в Мицутском статуте.','Serfdom was abolished by the Emancipation Manifesto (61 AAX), given legal form in the Statute of Mitsutsk.')+'</li></ul>'+
 '<h2 class="sub">'+T('Как принимается закон','How a law is made')+'</h2><ul class="l">'+
 '<li>'+T('Законопроект вносит министр, Царь или члены Думы.','A bill is introduced by a minister, by the Tsar or by Duma members.')+'</li><li>'+T('Дума и Государственный совет принимают его каждая.','The Duma and the State Council each pass it.')+'</li><li>'+T('Царь подписывает закон или налагает вето.','The Tsar signs it into law or vetoes it.')+'</li><li>'+T('В чрезвычайных обстоятельствах между сессиями Царь издаёт указ.','In an emergency, between sessions, the Tsar issues a decree.')+'</li></ul>'}},
{n:3,ru:'Законодательная власть',en:'The Legislature',dru:'Государственный совет и Государственная дума',den:'The State Council and the State Duma',f:function(){return ''+
 '<p>'+T('Законодательная власть двухпалатна, и у палат разные роли.','The legislature is bicameral, and the two chambers have distinct roles.')+'</p>'+
 '<h2 class="sub">'+T('Государственный совет','The State Council')+'</h2>'+
 '<dl class="kv"><dt>'+T('Состав','Composition')+'</dt><dd>'+T('Половина назначается Царём; половина избирается земствами, университетами, церковью и дворянством.','Half appointed by the Tsar; half elected by the zemstva, the universities, the church and the nobility.')+'</dd><dt>'+T('Роль','Role')+'</dt><dd>'+T('Верхняя палата. Рассматривает законы, принятые Думой, может изменить или отклонить их. Здесь обычно оказываются бывшие министры, губернаторы и старшие судьи.','The upper chamber. It reviews laws passed by the Duma and may amend or reject them. It is the usual home of former ministers, governors and senior judges.')+'</dd><dt>'+T('Срок','Tenure')+'</dt><dd>'+T('Избранные члены заседают установленный срок; назначенные служат по воле Царя.','Elected members sit for a fixed term; appointed members serve at the Tsar’s pleasure.')+'</dd></dl>'+
 '<h2 class="sub">'+T('Государственная дума','The State Duma')+'</h2>'+
 '<dl class="kv"><dt>'+T('Состав','Composition')+'</dt><dd>'+T('Избирается по взвешенному избирательному праву, которое со временем расширялось.','Elected on a weighted franchise that has widened over time.')+'</dd></dl>'+
 '<ul class="l"><li>'+T('Принимает законы совместно с Государственным советом.','It passes laws, jointly with the State Council.')+'</li><li>'+T('Голосует бюджет с учётом защищённых статей.','It votes the budget, subject to the protected lines.')+'</li><li>'+T('Может запрашивать министров и принимать резолюции порицания; Царь вправе их игнорировать.','It may question ministers and pass resolutions of censure, which the Tsar is free to ignore.')+'</li><li>'+T('Может обращаться к Царю с прошением.','It may petition the Tsar.')+'</li></ul>'+
 '<p>'+T('Закону нужны обе палаты и согласие Царя; Царь может наложить вето или распустить Думу. На практике законопроект, принятый и Думой, и Государственным советом, редко встречает вето. Политический спор идёт о том, на чём может настаивать Дума и что примет Царь.','A law needs both chambers and the Tsar’s assent, and the Tsar may veto it or dissolve the Duma. In practice a bill that both chambers pass is rarely vetoed. The political argument is about what the Duma may press and what the Tsar will accept.')+'</p>'}},
{n:4,ru:'Правительство',en:'The Government',dru:'Совет министров и служба',den:'The Council of Ministers and the service',f:function(){var rows=[['Министерство войны','War'],['Министерство иностранных дел','Foreign Affairs'],['Министерство Двора','The Court'],['Министерство внутренних дел','The Interior'],['Министерство финансов','Finance'],['Министерство юстиции','Justice'],['Министерство просвещения','Education'],['Министерство портов и транспорта','Ports and Transport']];return ''+
 '<p>'+T('Совет министров — кабинет, который возглавляет председатель. Он действует по воле Царя и перед ним отвечает.','The Council of Ministers is the cabinet, led by the Chairman. It acts at the Tsar’s pleasure and answers to him.')+'</p>'+
 '<h2 class="sub">'+T('Министерства','Ministries')+'</h2><ul class="l">'+rows.map(function(r){return '<li>'+T(r[0],r[1])+'</li>'}).join('')+'</ul>'+
 '<h2 class="sub">'+T('Гражданская служба','The civil service')+'</h2>'+
 '<p>'+T('Табель о рангах сохранилась в смягчённом виде. Положение по-прежнему определяется государственной службой, но поступают на неё по экзамену, и путь открыт талантам. Ближайший аналог — латревийская Комиссия по гражданской службе.','The Table of Ranks survives in softened form. Status still comes from state service, but entry is by examination and is open to talent. This is the nearest mirror of the Latrevian Civil Service Commission.')+'</p>'+
 '<h2 class="sub">'+T('Комитет царской безопасности','The Committee for Tsarist Security')+'</h2>'+
 '<p>'+T('Охранный орган государства. Отвечает перед одним лишь Царём. См. «Комитет царской безопасности».','The security organ of the state. It answers to the Tsar alone. See the Committee for Tsarist Security.')+'</p>'}},
{n:5,ru:'Суды',en:'The Courts',dru:'Независимое правосудие',den:'Independent justice',f:function(){return ''+
 '<p>'+T('Судебная реформа стала самой долговечной из Великих реформ, и суды — учреждение, которому народ доверяет больше всех.','The judicial reform was the most lasting of the Great Reforms, and the courts are the institution most trusted by the public.')+'</p>'+
 '<h2 class="sub">'+T('Независимость','Independence')+'</h2>'+
 '<p>'+T('Судьи независимы. Царь не может уволить судью иначе как по причине, установленной законом.','Judges are independent. The Tsar cannot dismiss a judge except for cause.')+'</p>'+
 '<h2 class="sub">'+T('Устройство','Structure')+'</h2><ul class="l"><li>'+T('Мировые судьи и местные суды.','Justices of the peace and local courts.')+'</li><li>'+T('Окружные суды с присяжными по тяжким преступлениям.','District courts with juries for serious crimes.')+'</li><li>'+T('Апелляционные суды.','Appeals courts.')+'</li><li>'+T('<b>Сенат</b> — высший суд. Его судей назначает Царь по представлению самого Сената.','The <b>Senate</b> is the highest court. Its judges are appointed by the Tsar on the Senate’s own nomination.')+'</li></ul>'+
 '<h2 class="sub">'+T('Пределы','Limits')+'</h2>'+
 '<p>'+T('Обычные преступления остаются в независимых судах. «Дела государственной важности» передаются особому трибуналу вне обычных судов (см. «Комитет царской безопасности»).','Ordinary crime stays with the independent courts. “Matters of state” go to a special tribunal outside the ordinary courts (see the Committee for Tsarist Security).')+'</p>'}},
{n:6,ru:'Земли и местное управление',en:'Land and Local Government',dru:'Земства, города, губернаторы',den:'Zemstva, cities, governors',f:function(){var pl=[['Николатск','Nikolatsk',T('Столица. Юго-запад страны; здесь же отделение ВБН в Николатске.','The capital, in the south-west, with the VBN bureau in Nikolatsk.')],['Порт Александр','Port Aleksandr',T('Северное побережье; морские ворота страны.','On the north coast; a principal port.')],['Северовезд','Severovezd',T('Северное побережье.','On the north coast.')],['Полярис','Polyaris',T('К востоку от Северовезда, близ моря Александра.','East of Severovezd, near the Sea of Aleksandr.')],['Карллосс','Karlloss',T('К югу от Порта Александра.','South of Port Aleksandr.')],['Новониколатск','Novonikolatsk',T('К юго-западу от Карллосса, у западного берега.','South-west of Karlloss, near the western coast.')],['Мицутск','Mitsutsk',T('Внутренние земли; возможно, назван в честь царицы Мицу I.','Interior; possibly named for Tsaritsa Mitsu I.')],['Кибасбург','Kibasburg',T('Внутренние земли, к юго-востоку от Мицутска.','Interior, south-east of Mitsutsk.')],['Дамаус','Damaus',T('Внутренние земли, к северо-востоку от Мицутска.','Interior, north-east of Mitsutsk.')],['Петроградск','Pietrogradsk',T('К востоку от внутренних земель, к морю Александра.','East of the interior, toward the Sea of Aleksandr.')],['Восток','Vostok',T('На берегу, рядом с настоящим ледником.','On the coast, beside a true glacier.')],['Восточный остров','Vostochnyy Ostrov',T('Остров у северо-восточного берега.','An island off the north-east coast.')],['Короноград','Koronagrad',T('К югу от внутренних земель.','South of the interior.')],['Ривьера','Riviera',T('К востоку от Короноград, у южного берега.','East of Koronagrad, toward the southern coast.')],['Царский порт','Tsarskiy Port',T('Резиденция губернатора северного рубежа, на острове у берега.','Seat of the northern frontier, on an offshore island.')]];return ''+
 '<h2 class="sub">'+T('Земства и городские думы','Zemstva and city dumas')+'</h2><ul class="l"><li>'+T('<b>Земства</b> — выборные губернские и уездные советы. Они ведают школами, здравоохранением, дорогами и местным призрением и выбирают часть Государственного совета.','The <b>zemstva</b> are elected provincial and district councils. They run schools, health, roads and local welfare, and they elect part of the State Council.')+'</li><li>'+T('<b>Городские думы</b> — выборные городские советы; ведают городскими делами.','The <b>city dumas</b> are elected city councils and run municipal affairs.')+'</li></ul>'+
 '<h2 class="sub">'+T('Губернаторы','Governors')+'</h2>'+
 '<p>'+T('Губернаторов назначает Царь. У них широкие административные полномочия и обязанность надзирать за земствами. Губернаторская система соответствует истории страны, владевшей отдалёнными землями, в том числе Ежехилем (1–60 AAX).','Governors are appointed by the Tsar, with wide administrative powers and a duty to oversee the zemstva. The system suits Nicolatia’s history of holding distant territory, including Ezechiel (1–60 AAX).')+'</p>'+
 '<h2 class="sub">'+T('Северный рубеж','The northern frontier')+'</h2>'+
 '<p>'+T('Северный рубеж, полученный от Латревии по Александградской уступке (Матвейсбургский договор, c. 105 PAX), ограниченный рекой Гелиос, управляется назначенными губернаторами и малонаселён. Его центр — Царский порт.','The northern frontier, received from Latrevia in the Alexagrad Cession (the Treaty of Matthewsburg, c. 105 PAX), bounded by the Helios river, is governed through appointed governors and is thinly settled. Tsarskiy Port is its seat.')+'</p>'+
 '<h2 class="sub">'+T('Города и места','Cities and places')+'</h2>'+
 '<table class="t"><thead><tr><th>'+T('Название','Name')+'</th><th>'+T('Где','Where')+'</th></tr></thead><tbody>'+pl.map(function(r){return '<tr><td class="y">'+T(r[0],r[1])+'</td><td>'+r[2]+'</td></tr>'}).join('')+'</tbody></table>'}},
{n:7,ru:'Церковь и армия',en:'Church and Army',dru:'Престол и алтарь, Гвардия',den:'Throne and altar, the Guard',f:function(){return ''+
 '<h2 class="sub">'+T('Установленная церковь','The established church')+'</h2>'+
 '<p>'+T('Церковь возглавляет Царь, по петровской модели: церковь подчинена престолу, а не престол церкви. Она благословляет корону, но не правит. Николатия отчётливо нетеократична и далека от Илиоса.','The church is headed by the Tsar, on the Petrine model: the church answers to the throne, and not the throne to the church. It blesses the crown but does not rule. Nicolatia is clearly non-theocratic and a world away from Iliyos.')+'</p>'+
 '<h2 class="sub">'+T('Армия','The army')+'</h2>'+
 '<ul class="l"><li>'+T('Воинская повинность с короткими сроками службы.','Conscription with short terms.')+'</li><li>'+T('Престижная Гвардия, преданная престолу.','A prestigious Guard, loyal to the throne.')+'</li><li>'+T('Золотой череп и скрещённые сабли на флаге подходят государству, гордому своей армией.','The gold skull and crossed sabres on the flag suit a state proud of its army.')+'</li><li>'+T('Войны Николатии коротки и локальны; см. Никлазбургскую войну (6 AAX).','Nicolatia’s wars are short and local; see the Nicklasburg War (6 AAX).')+'</li></ul>'}},
{n:8,ru:'Комитет царской безопасности',en:'The Committee for Tsarist Security',dru:'Охрана личности государя',den:'The security organ of the throne',f:function(){return ''+
 '<dl class="kv"><dt>'+T('Название','Name')+'</dt><dd>'+T('Комитет царской безопасности (KTB), в народе «Око»','Committee for Tsarist Security (KTB), “the Eye” on the street')+'</dd><dt>'+T('Сотрудники','Officers')+'</dt><dd>'+T('Смотрители (Smotriteli)','Smotriteli (“Watchers”)')+'</dd><dt>'+T('Основан','Founded')+'</dt><dd>c. 59 AAX</dd><dt>'+T('Подчинён','Answers to')+'</dt><dd>'+T('Царю лично; председатель Комитета отвечает только перед ним','The Tsar in person; the Chairman of the Committee answers to him alone')+'</dd></dl>'+
 '<h2 class="sub">'+T('Происхождение','Origin')+'</h2>'+
 '<p>'+T('После неудавшегося покушения на Николая II (c. 58 AAX) был основан (c. 59 AAX) небольшое бюро в штатском по образцу охранки: охранять Царя и наблюдать за революционными кружками. Его первыми сотрудниками стали ветераны оккупации Ежехиля (1–60 AAX), вернувшиеся домой по окончании вывода войск. При Николае III (c. 96–150 AAX) Комитет вырос далеко за пределы этой модели.','After a failed attempt on Nikolai II’s life (c. 58 AAX), a small plainclothes bureau on the model of the Okhrana was founded (c. 59 AAX) to protect the Tsar and watch revolutionary circles. Its first officers were veterans of the Ezechiel occupation (1–60 AAX), home as the withdrawal finished. Under Nikolai III (c. 96–150 AAX) the Committee grew far beyond that model.')+'</p>'+
 '<h2 class="sub">'+T('Верность','Loyalty')+'</h2>'+
 '<p>'+T('Комитет верен <b>лицу</b> правящего Царя или Царицы, а не династии и не государству. Каждый сотрудник присягает государю по имени, и присяга обновляется при каждом вступлении на престол. Новый Царь должен завоевать Комитет, а не просто унаследовать его. Между смертью Царя и присягой преемнику наступает междуцарствие: прежняя присяга утратила силу, и Комитет не подчиняется никому.','The Committee is loyal to the <b>person</b> of the reigning Tsar or Tsaritsa, not to the dynasty or the state. Every officer swears an oath to the sovereign by name, and the oath is renewed at each accession. A new Tsar must win the Committee over and cannot simply inherit it. Between the death of a Tsar and the oath to the successor there is an interregnum: the old oath has lapsed and the Committee answers to no one.')+'</p>'+
 '<h2 class="sub">'+T('Полномочия','Powers')+'</h2><ul class="l">'+
 '<li>'+T('Наблюдает, расследует и задерживает.','It watches, investigates and detains.')+'</li>'+
 '<li>'+T('Особое присутствие может назначить административную ссылку или лишение должности без публичного суда.','A Special Board may impose administrative exile or loss of position without a public trial.')+'</li>'+
 '<li>'+T('«Дела государственной важности» рассматривает особый трибунал вне обычных судов.','“Matters of state” go to a special tribunal outside the ordinary courts.')+'</li>'+
 '<li>'+T('Обычные преступления остаются в независимых судах.','Ordinary crime stays with the independent courts.')+'</li>'+
 '<li>'+T('Бюджет Комитета входит в число защищённых статей, которые Дума не вправе сокращать, поэтому Дума не может его рассматривать.','The Committee’s budget is among the protected lines the Duma may not cut, so the Duma cannot scrutinise it.')+'</li></ul>'+
 '<h2 class="sub">'+T('За кем наблюдает','Whom it watches')+'</h2>'+
 '<p>'+T('За всеми, кто обладает влиянием, а не только за оппозицией: министрами, председателем, членами Думы и Государственного совета, губернаторами, церковью, Гвардией и армией. Комитет следит за поведением, а не за положением: он не различает по полу, по статусу селянина или по происхождению, в согласии с Основными законами.','Everyone with influence, not only the opposition: ministers, the Chairman, members of the Duma and the State Council, governors, the church, the Guard and the army. The Committee targets conduct, not status: it does not discriminate by sex, by villager status or by origin, in line with the Fundamental Laws.')+'</p>'+
 '<h2 class="sub">'+T('Метод','Method')+'</h2>'+
 '<p>'+T('Нынешний Комитет внушает страх, но не кровав. Он предпочитает наблюдение, давление, предостережения, лишение должности и административную ссылку массовым арестам, поэтому арест редок и заметен. Массовый террор не является его практикой.','The present Committee is feared but not bloody. It prefers surveillance, pressure, warnings, loss of position and administrative exile to mass arrests, so an arrest is rare and noticed. Mass terror is not its practice.')+'</p>'}},
{n:9,ru:'Внешние сношения',en:'Foreign Relations',dru:'Соседи и договоры',den:'Neighbours and treaties',f:function(){return ''+
 '<h2 class="sub">'+T('Содружество','The Commonwealth')+'</h2>'+
 '<p>'+T('Содружество Латревии и Соларии — соседнее государство; Николатия не входит в него. Идейный спор — между «короной, чья власть от крови и традиции» и «никогда короны без согласия». Поскольку Дом Николая несёт кровь Иксарваидж, Царь видит в правительстве Зарпаи родственника, избравшего другой путь. Соперничество уважительное: есть реальная стратегическая борьба за северный рубеж, но нет ненависти.','The Commonwealth of Latrevia and Solaria is a neighbouring state, and Nicolatia is not a member of it. The ideological contest is “a crown whose authority comes from blood and tradition” against “never a crown without consent.” Because the House of Nicholas carries Ixarvaij’s blood, the Tsar regards the Zarpaii government as a cousin who took a different road. The rivalry is respectful, with real strategic competition over the northern frontier but no hatred.')+'</p>'+
 '<h2 class="sub">'+T('Договор 54 AAX','The treaty of 54 AAX')+'</h2>'+
 '<p>'+T('Договор с Латревией предусмотрел поэтапный вывод войск из Северного Содружества к 60 AAX. В Николатии его помнят как достойный исход, а не поражение.','The treaty with Latrevia provided a phased withdrawal from the Northern Commonwealth, complete by 60 AAX. It is remembered in Nicolatia as a dignified outcome, not a defeat.')+'</p>'+
 '<h2 class="sub">'+T('Слова на границе','Vocabulary at the border')+'</h2>'+
 '<p>'+T('Латревийские чиновники говорят «эйлон», а николатские слышат «селянин». Составителям договоров приходится учитывать это расхождение.','Latrevian officials say <i>Eulon</i>; Nicolatian officials hear <i>villager</i>. Treaty drafters must handle the mismatch.')+'</p>'+
 '<h2 class="sub">'+T('Александград','Alexagrad')+'</h2>'+
