<title>República de Luisara · Portal del Gobierno</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2210%22%20fill=%22%23ffffff%22/%3E%3Cg%20fill=%22%23008c45%22%3E%3Crect%20y=%228%22%20width=%2264%22%20height=%229%22/%3E%3Crect%20y=%2226%22%20width=%2264%22%20height=%229%22/%3E%3Crect%20y=%2244%22%20width=%2264%22%20height=%229%22/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--au:#d9a300;--aul:#fff3c4;--bg:#dfe9df;--paper:#fff;--ink:#102418;--mut:#4a6354;--g:#008c45;--gd:#006b35;--g2:#00a652;--gl:#e8f3ea;--line:#9fb9a6;--hdA:#00a652;--hdB:#00793b}
:root[data-theme=dark]{--au:#ecc034;--aul:#2e2710;--bg:#050d08;--paper:#0b1a11;--ink:#dcebe0;--mut:#8fae9b;--g:#0a9e55;--gd:#4fd68f;--g2:#0fb764;--gl:#10281b;--line:#2a4a37;--hdA:#0d8f4d;--hdB:#066035}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--au:#ecc034;--aul:#2e2710;--bg:#050d08;--paper:#0b1a11;--ink:#dcebe0;--mut:#8fae9b;--g:#0a9e55;--gd:#4fd68f;--g2:#0fb764;--gl:#10281b;--line:#2a4a37;--hdA:#0d8f4d;--hdB:#066035}}
*{box-sizing:border-box}
html{scroll-padding-top:52px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Verdana,Tahoma,Geneva,sans-serif}
a{color:var(--gd)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px dotted var(--ink);outline-offset:2px}
.util{background:var(--paper);border-bottom:3px solid var(--au);font-size:13px}
.util .in{max-width:1360px;margin:0 auto;padding:4px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.util .sp{flex:1}.util a,.util button{color:var(--gd);font:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.hero{--sh:clamp(28px,3.6vw,42px);border-bottom:5px solid var(--au)}
.hero .st{height:var(--sh);display:flex;align-items:center;padding:0 max(12px,calc((100vw - 1336px)/2));font-weight:700}
.hero .g{background:linear-gradient(#009a4e,#007c3b);color:#fff}.hero .w{background:#fff;color:#006b35}
:root[data-theme=dark] .hero .w{background:#e9f3ec}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .hero .w{background:#e9f3ec}}
.hero .big{font:900 calc(var(--sh)*.8)/1 Verdana,sans-serif;letter-spacing:.14em;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.hero .sm{font-size:clamp(11px,1.6vw,15px);letter-spacing:.12em;text-transform:uppercase}
.hero .big2{display:flex;gap:14px;align-items:center}
nav.nb{position:sticky;top:0;z-index:20;background:linear-gradient(#fdfdfd,#cfdcd2);border-bottom:4px solid var(--au);border-top:1px solid var(--g)}
:root[data-theme=dark] nav.nb{background:linear-gradient(#143222,#0a1c11)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) nav.nb{background:linear-gradient(#143222,#0a1c11)}}
nav.nb .in{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap}
nav.nb a{padding:9px 14px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;border-right:1px solid var(--line)}
nav.nb a:hover{background:var(--au);color:#1a1400}
nav.nb details{display:none}
.page{max-width:1360px;margin:0 auto;padding:10px 12px 24px;display:grid;grid-template-columns:225px minmax(0,1fr) 275px;gap:12px;align-items:start}
.side{position:sticky;top:44px;max-height:calc(100vh - 54px);overflow:auto}
.box{background:var(--paper);border:1px solid var(--line);margin-bottom:10px;box-shadow:2px 2px 0 rgba(0,0,0,.08)}
.box h4{margin:0;padding:4px 8px;background:linear-gradient(var(--hdA),var(--hdB));color:#fff;font-size:13.5px;letter-spacing:.5px;text-transform:uppercase;border-bottom:3px solid var(--au)}
.box .bd{padding:8px 10px;font-size:14px}
.box ul{list-style:none;margin:0;padding:0}.box li{padding:3px 0;border-bottom:1px dotted var(--line)}.box li:last-child{border:0}
.box li a::before{content:"■ ";color:var(--au);font-size:10px}
.box dl{margin:0}.box dt{font-size:12px;text-transform:uppercase;color:var(--mut);margin-top:5px}.box dd{margin:0}
.flagbox{text-align:center;padding:8px}.flagbox svg{max-width:100%;height:auto}
.badge{display:inline-block;border:1px solid var(--au);background:var(--aul);padding:1px 7px;font-size:12px;margin:2px 2px 0 0;color:var(--mut)}
.center{min-width:0}
.intro{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--au);padding:14px 16px;margin-bottom:10px;box-shadow:2px 2px 0 rgba(0,0,0,.08)}
.lead{font-size:18px;line-height:1.5;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:10px 0}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--c,var(--au));padding:7px 10px}
a.card:hover{background:var(--gl)}
.card b{display:block;font-size:15px}.card span{font-size:13.5px;color:var(--mut)}
.sec{margin-bottom:10px;background:var(--paper);border:1px solid var(--line);box-shadow:2px 2px 0 rgba(0,0,0,.08)}
.sh{background:linear-gradient(var(--hdA),var(--hdB));color:#fff;padding:7px 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:4px solid var(--au)}
.sec.w .sh{background:linear-gradient(#fff,#e1ece3);color:var(--gd);border-bottom:4px solid var(--au)}
:root[data-theme=dark] .sec.w .sh{background:linear-gradient(#173a27,#0f2619)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .sec.w .sh{background:linear-gradient(#173a27,#0f2619)}}
.sh h2{margin:0;font-size:21px;letter-spacing:.3px}
.sh p{margin:0;font-size:13.5px;opacity:.9}
.sh::before{content:"";width:14px;height:14px;align-self:center;background:linear-gradient(#fff 0 14%,transparent 14% 29%,#fff 29% 43%,transparent 43% 57%,#fff 57% 71%,transparent 71% 86%,#fff 86%);border:1px solid currentColor;flex:none}
.sb{padding:8px 14px 12px;columns:2 360px;column-gap:26px}
.sb li,.sb blockquote{break-inside:avoid}
.sb>table,.sb>.tw,.sb>div[style],.sb>.cards,.sb>.note{column-span:all}
h3{font-size:14.5px;margin:12px 0 4px;color:var(--gd);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--au);padding-bottom:2px;break-after:avoid}
p{margin:6px 0}ul{padding-left:18px;margin:5px 0}li{margin:3px 0}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0;background:var(--paper)}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
th{background:var(--gl);color:var(--gd)}
table.kv th{width:28%}
.tw{overflow-x:auto}
.note{background:var(--aul);border:1px solid var(--au);border-left:6px solid var(--au);padding:8px 12px;margin:10px 0}
blockquote{margin:10px 0;padding:4px 12px;border-left:5px solid var(--au);font-weight:700;color:var(--gd)}
blockquote small{display:block;font-weight:400;color:var(--mut)}
.chip{display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--c)}
svg[role=img]{outline:1px solid var(--line)}
.foot{max-width:1360px;margin:0 auto;padding:0 12px 18px}
.foot .box .bd{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;font-size:13px}
@media (max-width:1020px){
 .page{grid-template-columns:minmax(0,1fr)}
 .side{position:static;max-height:none}.sl{order:3}.sr{order:2}.center{order:1}
 nav.nb .in{display:none}nav.nb details{display:block}
 nav.nb summary{padding:9px 12px;font-weight:700;cursor:pointer;list-style:none}
 nav.nb details a{display:block;border-right:0;border-top:1px solid var(--line)}
 .sb{columns:1}
}
@media (max-width:520px){.hero .big2 .sm{display:none}}
@media print{.util,nav.nb,.side{display:none}.page{display:block}}

<script>
var LANG='en';try{var sl=localStorage.getItem('luisara-lang');if(sl==='es'||sl==='en')LANG=sl;else if((navigator.language||'').slice(0,2)==='es')LANG='es'}catch(e){}
function t(es,en){return LANG==='es'?es:en}
var MO_ES=['Ixario','Savrio','Caspio','Helio','Nerio','Kiomo','Epta','Exsilio','Ennia','Deka','Endeka','Dodeka'],MO_EN=['Ixarius','Savrius','Caspius','Helius','Nerius','Kiomus','Epta','Exsilius','Ennia','Deka','Endeka','Dodeka'];
var DY_ES=['Domingo','Lunes','Estasdía','Wawsdía','Winsdía','Firdía','Erdía'],DY_EN=['Sunday','Monday','Stasday','Wawsday','Winsday','Fyrday','Erday'];
function now(){var q=location.search.match(/now=(\d{12})/);if(q){var s=q[1];return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10),+s.slice(10,12))}return new Date()}
function pad(n){return n<10?'0'+n:n}
function clock(){var d=now(),aax=d.getFullYear()-1860,es=LANG==='es';
 return (es?DY_ES:DY_EN)[d.getDay()]+' '+d.getDate()+(es?' de ':' ')+(es?MO_ES:MO_EN)[d.getMonth()]+(es?' del año ':' · year ')+(aax+169)+' · '+aax+' AAX · '+pad(d.getHours())+':'+pad(d.getMinutes())}
function flag(w){var h=w/2,sh=h/7,o='';for(var i=0;i<7;i++)o+='<rect y="'+(i*sh)+'" width="'+w+'" height="'+(sh+.4)+'" fill="'+(i%2?'#ffffff':'#008c45')+'"/>';
 return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" aria-label="'+t('Bandera de Luisara: siete franjas, cuatro verdes y tres blancas','Flag of Luisara: seven stripes, four green and three white')+'">'+o+'</svg>'}
var REG=[
 {id:'miguel',c:'#4f6f95',n:'Miguel',es:'Tierras altas; descendientes de los llegados de Lancia y Alexagrado; agua dulce y minerales.',en:'Highlands; descendants of the Lancian and Alexagradian arrivals; fresh water and minerals.',core:'Nuevo Alexa, Nuevo Lancia, Mt. Miguel (131 m), Glaciar Miguel',coreE:'Nuevo Alexa, Nuevo Lancia, Mt. Miguel (131 m), the Miguel Glacier'},
 {id:'sud',c:'#2a8a8a',n:'Mar del Sud',es:'La región de la capital; costa sur de sabor portugués; pesca y navegación interior.',en:'The capital region; Portuguese-flavoured south shore; fishing and inland shipping.',core:'Luisara Viejo, São Juana, Mar del Sud, Glaciar del Sud',coreE:'Luisara Viejo, São Juana, Mar del Sud, the Sud Glacier'},
 {id:'selva',c:'#2f7d3a',n:'Selva',es:'El cinturón húmedo del norte y del este frente a Latrevia; madera y agricultura.',en:'The wet northern and eastern belt facing Latrevia; timber and agriculture.',core:'Sitio Pantal, la Gran Selva de Luisitro, la Selva de Aronia',coreE:'Sitio Pantal, the Great Luisitro Jungle, the Aronian Jungle'},
 {id:'costa',c:'#c58a1c',n:'Costa Oriental',es:'La costa oriental, sobre los mares de Xarvaii y del Sudeste; los principales puertos.',en:'The eastern coast on the Sea of Xarvaii and the Sea of Sudeste; the main ports.',core:'Sherlen, Ciudad Myawa, Puerto Del Mar, Ciudad Bruce',coreE:'Sherlen, Ciudad Myawa, Puerto Del Mar, Ciudad Bruce'},
 {id:'dong',c:'#b0553a',n:'Dongmyeong',es:'La península desértica del suroeste, sobre el Mar de Luisara.',en:'The southwestern desert peninsula, on the Sea of Luisara.',core:'Dongmyeong (Jungrad), Ciudad Suna, Minggao',coreE:'Dongmyeong (Jungrad), Ciudad Suna, Minggao'}];
var P=[
{ru:'República',en:'Republic',tes:'La República',ten:'The Republic',des:'Una república que nunca tuvo que endurecerse',den:'A republic that was never forced to harden',f:function(){return ''+
'<table class="kv"><tr><th>'+t('Nombre oficial','Official name')+'</th><td>República de Luisara</td></tr>'+
'<tr><th>'+t('Capital','Capital')+'</th><td>Luisara Viejo, '+t('sobre el Mar del Sud','on Mar del Sud')+'</td></tr>'+
'<tr><th>'+t('Idioma','Language')+'</th><td>'+t('Español, con lenguas regionales protegidas','Spanish, with protected regional languages')+'</td></tr>'+
'<tr><th>'+t('Gentilicio','Demonym')+'</th><td>luisareño / luisareña</td></tr>'+
'<tr><th>'+t('Forma de gobierno','Form of government')+'</th><td>'+t('República parlamentaria unitaria con devolución estatutaria','Unitary parliamentary republic with statutory devolution')+'</td></tr>'+
'<tr><th>'+t('Jefe de Estado','Head of state')+'</th><td>'+t('El Presidente de la República (ceremonial)','The President of the Republic (ceremonial)')+'</td></tr>'+
'<tr><th>'+t('Jefe de gobierno','Head of government')+'</th><td>'+t('El Primer Ministro','The Prime Minister')+'</td></tr>'+
'<tr><th>'+t('Legislativo','Legislature')+'</th><td>'+t('Bicameral: Cámara de Diputados y Senado Regional','Bicameral: the Chamber of Deputies and the Regional Senate')+'</td></tr>'+
'<tr><th>'+t('Fundación','Founded')+'</th><td>169 PAX, '+t('en las Secesiones tras el derrumbe del Reino de Lancia','in the Secessions after the collapse of the Kingdom of Lancia')+'</td></tr>'+
'<tr><th>'+t('Moneda','Currency')+'</th><td>'+t('Peso luisareño (fuera del Latrum)','Luisaran peso (outside the Latrum)')+'</td></tr></table>'+
'<h3>'+t('En breve','The short version')+'</h3>'+
'<p>'+t('Luisara es lo que sale cuando una república nunca se ve obligada a endurecerse. Nació al irse de un reino fallido. En los 335 años transcurridos, su territorio nunca ha sido invadido. Una vez, en el caos del exilio, tomó un tramo de la costa latrevia, lo conservó cuarenta y siete años y lo devolvió cuando Latrevia fue a buscarlo.','Luisara is what a republic looks like when it was never forced to harden. It was born by walking away from a failed kingdom. In the 335 years since, its homeland has never been invaded. Once, in the chaos of the exile, it took a slice of Latrevia’s coast, held it for forty-seven years, and gave it back when Latrevia came for it.')+'</p>'+
'<p>'+t('Los luisareños no llaman suerte a su seguridad. La llaman <b>la paz ganada</b>: tomaron lo que pudieron, supieron detenerse y vigilaron su propia casa. El Estado que construyeron es laxo, discutidor y funciona por el patronazgo regional. En tiempos de paz funciona lo bastante bien como para que nadie haya tenido motivo de arreglarlo.','Luisarans do not call their safety luck. They call it <b>la paz ganada</b>, the earned peace: they grabbed what they could, knew when to stop, and policed their own house. The state they built is loose, argumentative, and run through regional patronage. It works well enough in peacetime that nobody has ever had a reason to fix it.')+'</p>'+
'<h3>'+t('La más antigua','The oldest')+'</h3>'+
'<p>'+t('Luisara es la república continua más antigua del continente, doce años más antigua que la Federación Latrevia (157 PAX). Se formó en el Sud en 169 PAX, en las Secesiones que siguieron a la caída de Lancia. Una Lancia residual sobrevivió en torno a Emerca. Luisara la fundaron territorios que dejaron un centro en ruinas, no una revolución contra una corona viva.','Luisara is the oldest continuous republic on the continent, twelve years older than the Latrevian Federation (157 PAX). It formed in the Sud in 169 PAX, in the Secessions that followed the collapse of Lancia. A rump Lancian state remained around Emerca. Luisara was founded by territories that left a failing centre, not by a revolution against a living crown.')+'</p>'+
'<h3>'+t('Pueblo e idioma','People and language')+'</h3>'+
'<p>'+t('El idioma nacional es el español. Los topónimos revelan un poblamiento mezclado: español (Puerto Del Mar, Ciudad Bruce, Sitio Pantal), portugués (São Juana) y del Asia oriental (Minggao, Ciudad Suna, Dongmyeong). Nuevo Lancia y Nuevo Alexa, en la ladera occidental de la cordillera de Mt. Miguel, llevan nombres de lugares que sus pobladores habrían dejado atrás. La ley no reconoce una identidad étnica o religiosa única; la religión es libre.','The national language is Spanish. Place-names show a mixed settlement history: Spanish (Puerto Del Mar, Ciudad Bruce, Sitio Pantal), Portuguese (São Juana), and East Asian (Minggao, Ciudad Suna, Dongmyeong). Nuevo Lancia and Nuevo Alexa, on the western flank of the Mt. Miguel range, are named for places their settlers would have left. The law recognises no single ethnic or religious identity; religion is open.')+'</p>'+
'<h3>'+t('La bandera','The flag')+'</h3>'+
'<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+flag(210)+'<p style="flex:1;min-width:220px;margin:0">'+t('Siete franjas horizontales, cuatro verdes y tres blancas, que empiezan y terminan en verde. No lleva emblema: la Constitución no nombra a ningún fundador y la república no tiene héroe fundacional.','Seven horizontal stripes, four green and three white, beginning and ending in green. No emblem: the Constitution names no founder and the republic has no founding hero.')+'</p></div>'}},
{ru:'Constitución',en:'Constitution',tes:'La Constitución',ten:'The Constitution',des:'Breve, rara vez enmendada',den:'Short and rarely amended',f:function(){return ''+
'<p>'+t('La Constitución deposita la soberanía en el legislativo nacional. Las regiones tienen los poderes que la ley ordinaria les da, y no más.','The Constitution places sovereignty in the national legislature. Regions have the powers that ordinary statute gives them, and no more.')+'</p>'+
'<blockquote>'+t('Nunca un Lance.','Never a Lance.')+'<small>'+t('Lección fundacional de Luisara, tal como se la enseña.','Luisara’s founding lesson, as it is taught.')+'</small></blockquote>'+
'<p>'+t('La lección fundacional de Luisara es la contraria de la de Latrevia. Latrevia juró <i>nunca un emperador</i> y construyó cinco ramas para contener a un solo ejecutivo. Luisara juró, en la práctica, <i>nunca un Lance</i>: ningún cargo cuyo titular sea indispensable para que el Estado se sostenga. Sus fundadores vieron lo que pasa con un Estado que depende de que un hombre sobreviva.','Luisara’s founding lesson is the opposite of Latrevia’s. Latrevia swore <i>never an emperor</i> and built five branches to restrain one executive. Luisara swore, in effect, <i>never a Lance</i>: no office on whose holder the state depends. Its founders watched what happened to a state that hung on one man’s survival.')+'</p>'+
'<h3>'+t('Rasgos del texto','Features of the text')+'</h3><ul>'+
'<li>'+t('Es corta y rara vez se enmienda.','It is short and rarely amended.')+'</li>'+
'<li>'+t('El capítulo de derechos es real pero sencillo.','The rights chapter is real but plain.')+'</li>'+
'<li>'+t('No tiene cláusulas de eternidad.','It has no eternity clauses.')+'</li>'+
'<li>'+t('No hay héroe fundador ni emblema fundacional; la bandera no lleva ninguno.','There is no founding hero and no founding emblem; the flag carries none.')+'</li></ul>'+
'<h3>'+t('El calendario','The calendar')+'</h3>'+
'<p>'+t('Los luisareños cuentan los años desde la Separación. El año 1 es 169 PAX; por tanto 1 AAX es el año 170 y 166 AAX es el año <b>335</b>. Conocen y usan la cuenta AAX en sus tratos con el Commonwealth; el reloj de este sitio muestra las dos.','Luisarans count years from the Separation. Year 1 is 169 PAX, so 1 AAX is year 170 and 166 AAX is year <b>335</b>. They know and use the AAX reckoning in dealings with the Commonwealth; the clock on this site shows both.')+'</p>'}},
{ru:'Ejecutivo',en:'Executive',tes:'El Ejecutivo',ten:'The Executive',des:'Nadie es indispensable',den:'Nobody is indispensable',f:function(){return ''+
'<h3>'+t('El Presidente de la República','The President of the Republic')+'</h3>'+
'<p>'+t('Jefe de Estado sin poder ejecutivo real. Lo elige el Congreso para un solo mandato, abre las sesiones, recibe a los enviados y nombra al Primer Ministro según la elección de la Cámara.','Head of state with no real executive power. The President is chosen by the Congress for a single term, opens sessions, receives envoys, and names the Prime Minister on the Chamber’s choice.')+'</p>'+
'<h3>'+t('El Primer Ministro','The Prime Minister')+'</h3>'+
'<p>'+t('Jefe de gobierno; dirige el Consejo de Ministros. Gobierna solo mientras lo respalde la Cámara de Diputados.','Head of government; leads the Council of Ministers. Serves only while the Chamber of Deputies supports him or her.')+'</p>'+
'<h3>'+t('Remoción fácil','Easy removal')+'</h3>'+
'<p>'+t('Una simple moción de censura destituye al Primer Ministro, sin necesidad de proponer un sucesor. Es lo contrario del voto constructivo latrevio, que Latrevia adoptó para evitar el bloqueo. Luisara eligió el reemplazo fácil para que ningún gobierno, ni ninguna persona, sea indispensable.','A simple motion of censure removes a Prime Minister, with no successor required. This is the reverse of the Latrevian constructive vote, which Latrevia adopted to prevent deadlock. Luisara chose easy replacement so that no government, and no person, is indispensable.')+'</p>'+
'<p>'+t('La consecuencia: los gobiernos son breves y las coaliciones laxas. El servicio civil permanente hace buena parte del gobierno real, y cada Primer Ministro es un inquilino temporal.','The consequence: governments are short and coalitions are loose. The permanent civil service does much of the real governing, and every Prime Minister is a temporary tenant.')+'</p>'+
'<h3>'+t('Poderes de emergencia','Emergency powers')+'</h3>'+
'<p>'+t('El Consejo de Ministros puede declarar una emergencia limitada de hasta treinta días; para renovarla necesita a la Cámara. Las emergencias son raras, porque el país ha tenido poco de qué estar en emergencia.','The Council of Ministers may declare a limited emergency for up to thirty days. Renewal needs the Chamber. Emergencies are rare because the country has had little to be in emergency about.')+'</p>'}},
{ru:'Congreso',en:'Congress',tes:'El Congreso',ten:'The Congress',des:'El órgano soberano de la República',den:'The sovereign body of the Republic',f:function(){return ''+
'<h3>'+t('Cámara de Diputados','Chamber of Deputies')+'</h3><ul>'+
'<li>'+t('Elegida por representación proporcional para cuatro años.','Elected by proportional representation for four years.')+'</li>'+
'<li>'+t('Tiene el presupuesto, la confianza y el poder de hacer y deshacer gobiernos.','Holds the budget, confidence, and the power to make and unmake governments.')+'</li></ul>'+
'<h3>'+t('Senado Regional','Regional Senate')+'</h3><ul>'+
'<li>'+t('Cada región envía el mismo número de senadores, sea cual sea su tamaño.','Each region sends the same number of senators, whatever its size.')+'</li>'+
'<li>'+t('Revisa todos los proyectos de ley y tiene un poder dilatorio sobre el presupuesto.','It reviews all bills and has a delaying power on the budget.')+'</li>'+
'<li>'+t('Habla por las regiones y es un premio para los caciques regionales: es el principal escenario del clientelismo (ver Política).','Because it speaks for the regions and is a prize for regional bosses, it is the main arena of clientelism (see Politics).')+'</li></ul>'+
'<h3>'+t('Devolución estatutaria','Statutory devolution')+'</h3>'+
'<p>'+t('Los poderes regionales constan en los <b>Estatutos de Autonomía</b>, que son leyes ordinarias del Congreso. Un Estatuto puede enmendarse o derogarse por mayoría ordinaria de ambas cámaras: no hay mayoría reforzada ni control judicial de la devolución.','Regional powers are set out in the <b>Statutes of Autonomy</b> (<i>Estatutos de Autonomía</i>), which are ordinary laws of the Congress. A Statute can be amended or repealed by an ordinary majority of both chambers. There is no supermajority and no judicial review of devolution.')+'</p>'+
'<div class="note">'+t('Esta es la debilidad central del sistema. En Latrevia, el principio federal es una cláusula de eternidad (Constitución latrevia, art. 54).','This is the arrangement’s central weakness. Compare the Latrevian federal principle, which is an eternity clause (Latrevian Constitution, Art. 54).')+'</div>'}},
{ru:'Regiones',en:'Regions',tes:'Las Regiones',ten:'The Regions',des:'Cinco regiones con Estatutos de Autonomía',den:'Five regions under Statutes of Autonomy',f:function(){var r='<div class="cards">';REG.forEach(function(x){r+='<div class="card" style="--c:'+x.c+'"><b>'+x.n+'</b><span>'+t(x.es,x.en)+'</span></div>'});r+='</div>';
 var tb='<div class="tw"><table><tr><th>'+t('Región','Region')+'</th><th>'+t('Núcleo','Core')+'</th><th>'+t('Carácter','Character')+'</th></tr>';REG.forEach(function(x){tb+='<tr><td><span class="chip" style="--c:'+x.c+'"></span><b>'+x.n+'</b></td><td>'+t(x.core,x.coreE)+'</td><td>'+t(x.es,x.en)+'</td></tr>'});tb+='</table></div>';
 return '<p>'+t('Cada región tiene un <b>Consejo Regional</b> y un <b>Presidente de la Región</b>, con poderes sobre la prestación de la educación, la salud, la policía local, el uso del suelo y la política cultural en la medida en que su Estatuto lo disponga.','Each region has a <b>Regional Council</b> and a <b>President of the Region</b>, with powers over education delivery, health, local policing, land use, and cultural policy as its Statute allows.')+'</p>'+r+tb+
'<h3>Dongmyeong (동명)</h3><ul>'+
'<li>'+t('Tiene un <b>Estatuto Especial</b> con el coreano como lengua cooficial, tribunales propios para lo civil e instituciones culturales propias. Su nombre coreano figura junto al eslavizante <i>Jungrad</i>; se usan ambos.','It has a <b>Special Statute</b> with co-official Korean, its own courts for civil matters, and its own cultural institutions. Its Korean name sits beside the Slavic-flavoured <i>Jungrad</i>; both are used.')+'</li>'+
'<li>'+t('La <b>Penitenciaría de Dongmyeong</b>, la prisión nacional, está allí y la gestiona el gobierno central, no la Región. Es el punto de fricción más agudo entre la Región y la capital.','The <b>Dongmyeong Penitentiary</b>, the national prison, stands there and is run by the central government, not the Region. This is the sharpest point of friction between the Region and the capital.')+'</li>'+
'<li>'+t('La península es territorio luisareño aunque no figure en ningún estado del Commonwealth; es una nota de mapa, no un hecho jurídico luisareño.','The peninsula is Luisaran territory, though it lies outside any labelled Commonwealth state; that is a map note, not a Luisaran legal fact.')+'</li></ul>'}},
{ru:'Tribunales',en:'Courts',tes:'Los Tribunales',ten:'The Courts',des:'Competentes y lentos',den:'Competent and slow',f:function(){return ''+
'<ul><li>'+t('El <b>Tribunal Supremo</b> es la última instancia de apelación. Sus jueces los nombra el Consejo de Ministros a partir de una lista del consejo judicial y los confirma el Senado Regional.','The <b>Supreme Court</b> is the final court of appeal. Its judges are appointed by the Council of Ministers from a list prepared by the judicial council and confirmed by the Regional Senate.')+'</li>'+
'<li>'+t('No hay tribunal constitucional. Los tribunales protegen los derechos individuales según la Constitución, pero no pueden anular leyes por motivos de autonomía regional.','There is no constitutional court. Courts protect individual rights under the Constitution but cannot strike down statutes on grounds of regional autonomy.')+'</li>'+
'<li>'+t('La justicia ordinaria es competente y lenta. Los nombramientos regionales en los tribunales inferiores son un canal conocido de patronazgo.','Ordinary justice is competent and slow. Regional appointments to the lower bench are a known channel of patronage.')+'</li>'+
'<li>'+t('Dongmyeong tiene tribunales propios para asuntos civiles bajo su Estatuto Especial.','Dongmyeong has its own courts for civil matters under its Special Statute.')+'</li></ul>'}},
{ru:'Defensa',en:'Defence',tes:'Defensa',ten:'Defence',des:'Defensa territorial y reserva numerosa',den:'Territorial defence and a large reserve',f:function(){return ''+
'<ul><li>'+t('Luisara mantiene un ejército y una armada profesionales pequeños y una reserva numerosa. Su doctrina es la defensa territorial.','Luisara keeps a small professional army and navy and a large reserve. Its doctrine is territorial defence.')+'</li>'+
'<li>'+t('<b>Servicio de reserva.</b> Los ciudadanos se entrenan y sirven en la milicia. Es la parte del sistema luisareño que mejor funciona.','<b>Reserve service.</b> Citizens train and serve in the militia. It is the part of the Luisaran system that works well.')+'</li>'+
'<li>'+t('<b>Sin alianzas.</b> Luisara tiene tratados de comercio y de paso, y ningún pacto de defensa mutua. Forma parte de la <i>paz ganada</i>.','<b>No alliances.</b> Luisara has treaties of trade and passage and no mutual defence pacts. This is part of <i>la paz ganada</i>.')+'</li>'+
'<li>'+t('<b>La Guerra de Luisitro.</b> Luisara perdió la costa central ante Latrevia en 48–49 AAX y decidió no seguir luchando. El ejército lo recuerda como una retirada sensata. Los combates del flanco occidental cortaron el camino de siete bloques entre Haradia y Nuevo Vercosta, que los luisareños consideran un accidente de la guerra.','<b>The Luisitro War.</b> Luisara lost the central coast to Latrevia in 48–49 AAX and chose not to fight on. The army remembers it as a sensible withdrawal. The fighting on the western flank cut the 7-block road between Haradia and Nuevo Vercosta, and Luisarans regard that as an accident of the war.')+'</li></ul>'}},
{ru:'Economía',en:'Economy',tes:'Economía',ten:'Economy',des:'Puertos prósperos, tierras altas y selva rezagadas',den:'Prosperous ports, lagging highlands and jungle',f:function(){return ''+
'<table class="kv"><tr><th>'+t('Moneda','Currency')+'</th><td>'+t('Peso luisareño. Luisara está fuera del Latrum.','The Luisaran peso. Luisara is outside the Latrum.')+'</td></tr>'+
'<tr><th>'+t('Recursos','Resources')+'</th><td>'+t('Madera y agricultura en la Selva; minerales y agua dulce de la cordillera Miguel y sus glaciares; pesca en el Mar del Sud; navegación y comercio por Puerto Del Mar y Ciudad Bruce.','Timber and agriculture in the Selva; minerals and fresh water from the Miguel range and its glaciers; fishing on Mar del Sud; shipping and trade through Puerto Del Mar and Ciudad Bruce.')+'</td></tr>'+
'<tr><th>'+t('Rutas del sur','Southern sea lanes')+'</th><td>'+t('Por su costa pasan los barcos del Mar de Konfederazia y de la ruta Latrei–Solaria. Luisara se beneficia del tráfico y no lo controla.','Ships on the Sea of Konfederazia and the Latrei–Solaria route pass its coast. It profits from the traffic and does not control it.')+'</td></tr>'+
'<tr><th>'+t('Desigualdad','Inequality')+'</th><td>'+t('Los puertos prosperan; las tierras altas y la selva se rezagan. Dongmyeong es la región más desatendida.','The ports prosper, and the highlands and jungle lag. Dongmyeong is the most neglected.')+'</td></tr></table>'+
'<h3>'+t('Comercio con el Commonwealth','Trade with the Commonwealth')+'</h3>'+
'<p>'+t('Los bienes luisareños que entran al Commonwealth son bienes de fuera. Pagan los derechos de aduana del Commonwealth, que son ingreso del Commonwealth según el art. 27 de la Carta. La libre circulación del art. 26 de la Carta no se aplica a ellos. Luisara no tiene voto en nada de esto.','Luisaran goods entering the Commonwealth are goods from outside it. They pay Commonwealth customs duties, which are Commonwealth revenue under Charter Art. 27. Free movement under Charter Art. 26 does not apply to them. Luisara has no vote on any of this.')+'</p>'}},
{ru:'Política',en:'Politics',tes:'Política',ten:'Politics',des:'Bloques laxos, patronazgo y la paz ganada',den:'Loose blocs, patronage and the earned peace',f:function(){return ''+
'<h3>'+t('Partidos','Parties')+'</h3>'+
'<p>'+t('Los partidos son laxos; casi todos son coaliciones de caciques regionales y sus nombres van y vienen. Existen unos pocos bloques duraderos:','Parties are loose. Most are coalitions of regional bosses, and names come and go. A few durable blocs exist:')+'</p><ul>'+
'<li>'+t('un bloque nacional-liberal con raíz en los puertos;','a national-liberal bloc rooted in the ports;')+'</li>'+
'<li>'+t('un bloque autonomista de las tierras altas;','a highland autonomist bloc;')+'</li>'+
'<li>'+t('un bloque agrario de la selva;','a jungle agrarian bloc;')+'</li>'+
'<li>'+t('un partido regionalista de Dongmyeong.','a Dongmyeong regionalist party.')+'</li></ul>'+
'<h3>'+t('Clientelismo','Clientelism')+'</h3>'+
'<p>'+t('El hábito político central del país. Los votos se cambian por fondos regionales, nombramientos y permisos, y el Senado Regional es el mercado. Es <i>el</i> problema luisareño: leve día a día y corrosivo con los siglos.','The country’s central political habit. Votes are exchanged for regional funds, appointments, and permits, and the Regional Senate is the exchange. This is <i>the</i> Luisaran problem. It is mild day to day and corrosive over centuries.')+'</p>'+
'<p>'+t('No hay vigilante: no existe nada parecido a la Comisión de Control latrevia ni una rama anticorrupción independiente, solo los tribunales ordinarios y la prensa. En la periferia, la política de Dongmyeong gira en torno a la Penitenciaría, el Estatuto y el miedo a su derogación.','There is no watchdog: no Latrevian-style Control Commission or independent anti-corruption branch, only the ordinary courts and the press. At the periphery, Dongmyeong’s politics turn on the Penitentiary, the Statute, and fear of repeal.')+'</p>'+
'<h3>'+t('La paz ganada (<i>la paz ganada</i>)','The earned peace (<i>la paz ganada</i>)')+'</h3>'+
'<p>'+t('Los luisareños sostienen, como creencia nacional asentada, que su seguridad fue ganada y no regalada. Dan cuatro razones:','Luisarans hold, as a matter of settled national belief, that their safety was earned and not given. They give four reasons:')+'</p><ul>'+
'<li>'+t('neutralidad armada y una población entrenada;','armed neutrality and a trained population;')+'</li>'+
'<li>'+t('comercio con todos los vecinos y alianza con ninguno;','trade with every neighbour and alliance with none;')+'</li>'+
'<li>'+t('la disciplina de tomar lo que el caos ofreció y de devolverlo sin pelear hasta el final cuando llegó la Reconquista;','the discipline to take what chaos offered and to give it back without a fight to the end when the Reconquest came;')+'</li>'+
'<li>'+t('una frontera propia que nunca han dejado desprotegida.','a home border they have never left undefended.')+'</li></ul>'+
'<p>'+t('Rechazan la palabra <i>irrelevante</i>. Comentaristas latrevios y nicolatios la usan a veces, y los luisareños la tratan como un insulto de quienes nunca han tenido que defender una paz.','They reject the word <i>irrelevant</i>. Latrevian and Nicolatian commentators sometimes use it, and Luisarans treat it as an insult from people who have never had to defend a peace.')+'</p>'+
'<div class="note"><b>'+t('El defecto que produce.','The flaw it produces.')+'</b> '+t('La complacencia. Un país seguro de que su seguridad fue ganada toma las advertencias por ofensas, invierte poco en inteligencia y en la defensa de su litoral estratégico, y tarda en notar que las necesidades de un vecino han cambiado. Un segundo defecto es el oportunismo: Luisara toma lo que el desorden ofrece y trata la retirada como sabiduría, lo que hace desconfiar de sus motivos a los vecinos; los latrevios aún recuerdan que trató con la Teocracia mientras ocupaba su costa.','Complacency. A country certain its safety is earned reads warnings as slights. It under-invests in intelligence and in the defence of its strategic coastline, and it is slow to notice that a neighbour’s needs have changed. A second flaw is opportunism: Luisara takes what disorder offers and treats withdrawal as wisdom, which makes its neighbours distrust its motives, and Latrevians still remember that it dealt with the Theocracy while it held their coast.')+'</div>'+
'<p>'+t('<b>La pregunta sin respuesta.</b> Latrevia se detuvo en la frontera porque estaba ocupada y porque el Sud no valía el costo. Los luisareños dicen que la frontera aguantó porque la hicieron costosa. Las dos historias encajan con los hechos.','<b>The unanswered question.</b> Latrevia stopped at the border because it was busy and because the Sud was not worth the cost. Luisarans say the border held because they made it costly. Both stories fit the facts.')+'</p>'+
'<h3>'+t('Por qué se sostiene la República','Why the Republic holds')+'</h3><ul>'+
'<li><b>'+t('Edad.','Age.')+'</b> '+t('Tres siglos y medio de gobierno republicano ininterrumpido.','Three and a half centuries of unbroken republican government.')+'</li>'+
'<li><b>'+t('Nadie la necesita.','Nobody needs it.')+'</b> '+t('Cuando Latrevia recuperó la costa central, el Sud ofrecía poco más que valiera la pena; el desierto y las selvas se interponen entre él y la capital, y no hay un premio como Xareionople.','Once Latrevia retook the central coast, the Sud offered little more worth taking. The desert corridor and the jungles sit between it and the capital, and it has no Xareionople-style prize.')+'</li>'+
'<li><b>'+t('Nadie quiere el puesto.','Nobody wants the job.')+'</b> '+t('Un ejecutivo efímero ofrece poco que capturar.','A short-lived executive offers little to capture.')+'</li>'+
'<li><b>'+t('Lealtad local.','Local loyalty.')+'</b> '+t('La gente es leal a su región y a su patrón; el Estado les pide poco más.','People are loyal to their region and their patron. The state asks little more of them.')+'</li></ul>'}},
{ru:'Exterior',en:'Foreign',tes:'Relaciones exteriores',ten:'Foreign Relations',des:'Tratados de comercio y de paso, ninguna alianza',den:'Treaties of trade and passage, no alliances',f:function(){return ''+
'<h3>'+t('El Commonwealth','The Commonwealth')+'</h3>'+
'<p>'+t('Un Estado vecino. Las fronteras terrestres de Luisara son con Lancia, Bahsin, Aronia y Bambu. Las relaciones son correctas y comerciales, con un viejo moretón: Luisara ocupó la costa central latrevia durante 47 años y trató con la Teocracia mientras tanto. Los luisareños aceptan el desenlace y el Commonwealth lo trata como historia. La Fuerza de Defensa unificada del Commonwealth y sus normas de derechos humanos son una presión silenciosa sobre las estructuras más débiles de Luisara.','A neighbouring state. Luisara’s land borders are with Lancia, Bahsin, Aronia, and Bambu. Relations are correct and commercial, with an old bruise: Luisara held Latrevia’s central coast for 47 years and dealt with the Theocracy while it did. Luisarans accept the outcome and the Commonwealth treats it as history. The Commonwealth’s unified Defence Force and its human-rights standards are a quiet pressure on Luisara’s weaker structures.')+'</p>'+
'<h3>Lancia</h3>'+
'<p>'+t('Un origen compartido. Luisara salió del reino fallido y quedó libre; Lancia se quedó. Los luisareños ven en Lancia el destino que evitaron.','A shared origin. Luisara left the failing kingdom and stayed free; Lancia stayed behind. Luisarans see Lancia as the fate they avoided.')+'</p>'+
'<p>'+t('El Mar y los Estrechos de Konfederazia son fósiles de la antigua identidad soberana de Lancia y no hacen ninguna reclamación sobre Luisara.','The Sea and Straits of Konfederazia are fossils of Lancia’s old sovereign identity and make no claim about Luisara.')+'</p>'+
'<h3>Nicolatia</h3>'+
'<p>'+t('Lejana y sin frontera común. Una monarquía con un Estado de seguridad está en el polo opuesto de la república laxa de Luisara.','Distant, with no common border. A monarchy with a security state sits at the opposite pole from Luisara’s loose republic.')+'</p>'+
'<h3>Ostmarchia</h3>'+
'<p>'+t('Al otro lado del Estrecho de Xarvaii, el vecino del noreste de Luisara es el Bosque de Xarvaii de Ostmarchia. No hay frontera terrestre.','Across the Strait of Xarvaii, Luisara’s northeast neighbour is Ostmarchia’s Xarvaii Forest. No land border.')+'</p>'+
'<h3>'+t('Vocabulario en la frontera','Vocabulary at the border')+'</h3>'+
'<p>'+t('Los funcionarios latrevios dicen <i>Eulon</i> y los nicolatios dicen <i>aldeano</i>. Luisara tiene su propio uso, y los redactores de tratados deben manejar los tres.','Latrevian officials say <i>Eulon</i> and Nicolatian officials say <i>villager</i>. Luisara has its own usage, and treaty drafters must handle all three.')+'</p>'}},
{ru:'Historia',en:'History',tes:'Historia',ten:'History',des:'De la Secesión a la costa central y de vuelta',den:'From the Secession to the central coast and back',f:function(){return ''+
'<div class="tw"><table><tr><th>'+t('Fecha','Date')+'</th><th>'+t('Hecho','Event')+'</th></tr>'+
'<tr><td>170 PAX</td><td>'+t('Asesinato del rey Lance III de Lancia; la monarquía se derrumba en la crisis sucesoria.','King Lance III of Lancia is assassinated; the monarchy collapses in the succession crisis.')+'</td></tr>'+
'<tr><td><b>169 PAX</b></td><td><b>'+t('Las Secesiones. Se forma la República de Luisara en el Sud.','The Secessions. The Republic of Luisara forms in the Sud.')+'</b></td></tr>'+
'<tr><td>157 PAX</td><td>'+t('Se forma la Federación Latrevia. Luisara no forma parte.','The Latrevian Federation is formed. Luisara is not part of it.')+'</td></tr>'+
'<tr><td>1 AAX</td><td>'+t('La Teocracia toma Jumongrad y el gobierno latrevio huye a Emerca. Luisara ocupa la costa central.','The Theocracy takes Jumongrad and the Latrevian government flees to Emerca. Luisara occupies the central coast.')+'</td></tr>'+
'<tr><td>48–49 AAX</td><td>'+t('La Guerra de Luisitro: el Cruce del Duaterre, la Carrera Costera y el Sitio de Luisitro (49 AAX). Luisara pierde la costa central y lo acepta.','The Luisitro War: the Crossing of the Duaterre, the Coastal Run, and the Siege of Luisitro (49 AAX). Luisara loses the central coast and accepts it.')+'</td></tr>'+
'<tr><td>'+t('después de 49 AAX','after 49 AAX')+'</td><td>'+t('Latrevia se detiene en la antigua frontera. El Protectorado de Luisitro administra las antiguas tierras luisareñas hasta que se vuelven estados latrevios después de 160 AAX.','Latrevia stops at the old border. The Luisitro Protectorate holds the former Luisaran lands until they become Latrevian states after 160 AAX.')+'</td></tr>'+
'<tr><td>166 AAX</td><td>'+t('Año actual. La República está en su año 335.','Setting year. The Republic stands in its 335th year.')+'</td></tr></table></div>'+
'<h3>'+t('La costa central (1–49 AAX)','The central coast (1–49 AAX)')+'</h3>'+
'<ul><li>'+t('<b>La toma.</b> Cuando la Teocracia tomó Jumongrad el Día de VOS y el gobierno latrevio huyó a Emerca, Luisara avanzó sobre la costa central: las tierras de los actuales Duaterre, Baybay, Aronia y Bambu y el sur de Erimos, incluidos la vieja ciudad de Carai y la ciudad entonces llamada Luisitro (hoy Latreionople). La vieja Carai quedó vacía por los combates y nunca se reconstruyó; hoy son los Bosques de Carai. Bahsin y Lancia, entre la frontera luisareña y el puerto del exilio, siguieron siendo latrevios.','<b>The seizure.</b> When the Theocracy took Jumongrad on VOS Day and the Latrevian government fled to Emerca, Luisara moved onto the central coast. It took the lands of the modern states of Duaterre, Baybay, Aronia and Bambu, and southern Erimos, including the old town of Carai and the city then called Luisitro (now Latreionople). Old Carai was emptied by the fighting and never rebuilt; it is now the Carai Woods. Bahsin and Lancia, between the Luisaran border and the exile’s port, stayed Latrevian.')+'</li>'+
'<li>'+t('<b>El motivo fue el oportunismo.</b> Al irse de Lancia, Luisara había perdido su acceso al Mar de Kosmos. La costa central se lo devolvió, aunque no en el punto que Lancia y la vieja Konfederazia habían tenido. Nadie en Luisara fingió que fuera un rescate.','<b>The motive was opportunism.</b> Luisara had lost its access to the Sea of Kosmos when it left Lancia, whose coast it once shared. The central coast gave that access back, though not at the place Lancia and the old Konfederazia had held. Nobody in Luisara pretended it was a rescue.')+'</li>'+
'<li>'+t('<b>Colaboración con límites.</b> Luisara trató con la Teocracia como con un vecino: comercio, paso y un entendimiento tácito de no combatir. La Teocracia, que gobernaba el corazón de Latrevia, aceptó la ocupación de la costa a cambio de cooperación. El gobierno en el exilio nunca la aceptó. Al mismo tiempo Luisara debió protegerse de la infiltración teocrática (los Hijos de Helios) en su propio suelo. No fue aliada de la Teocracia ni enemiga.','<b>Collaboration with limits.</b> Luisara dealt with the Theocracy as a neighbour: trade, passage, and a tacit understanding not to fight. The Theocracy, which ruled Latrevia’s heartland, acquiesced in Luisara’s hold on the coast in return for cooperation. The exile government never accepted it. At the same time Luisara had to police itself against Theocratic infiltration (the Children of Helios) on its own soil. It was neither an ally of the Theocracy nor an enemy of it.')+'</li>'+
'<li>'+t('<b>Guerra con el exilio, luego alto el fuego.</b> Luisara y el gobierno en el exilio combatieron al principio y luego se detuvieron bajo un <b>alto el fuego indefinido</b> que nunca se volvió tratado. El río Duaterre fue la línea de hecho.','<b>War with the exile, then a ceasefire.</b> Luisara and the exile government fought early, then stopped under an <b>indefinite ceasefire</b> that was never made a treaty. The Duaterre River served as the working line.')+'</li>'+
'<li>'+t('<b>La Guerra de Luisitro (48–49 AAX).</b> La Reconquista se abrió con el Cruce del Duaterre, que puso fin al alto el fuego. Siguieron la Carrera Costera y el Sitio de Luisitro. Latrevia recuperó la costa central antes de volverse contra la Teocracia en el norte.','<b>The Luisitro War (48–49 AAX).</b> The Reconquest opened with the Crossing of the Duaterre, which ended the ceasefire. The Coastal Run and the Siege of Luisitro followed. Latrevia took back the central coast before turning north against the Theocracy.')+'</li>'+
'<li>'+t('<b>El final.</b> Luisara aceptó la pérdida, volvió a su antigua frontera y no siguió combatiendo, sabiendo que la tierra seguiría siendo latrevia. Latrevia se detuvo en esa frontera y nunca empujó hacia el Sud. Los luisareños recuerdan la costa como una provincia perdida y una oportunidad perdida, no como un agravio.','<b>The ending.</b> Luisara accepted the loss. It withdrew to its old border and did not fight on, knowing the land would stay Latrevian. Latrevia stopped at that border and never pushed into the Sud. Luisarans remember the coast as a lost province and a lost opportunity, not as a grievance.')+'</li>'+
'<li>'+t('<b>Lo que dejó.</b> Tras 47 años de dominio luisareño, esas tierras hablaban español y se inclinaban hacia Luisara. Por eso Latrevia administró Aronia y Bambu como Protectorado de Luisitro antes de dividirlas en estados, y por eso los nombres españoles son comunes en el gobierno latrevio.','<b>What it left behind.</b> After 47 years of Luisaran rule, those lands were Spanish-speaking and leaned toward Luisara. That is why Latrevia ran Aronia and Bambu as the Luisitro Protectorate before dividing them into states, and why Spanish names are common in Latrevian government.')+'</li></ul>'}}
];
var app=document.getElementById('app');
function setTheme(m){try{localStorage.setItem('luisara-theme',m)}catch(e){}document.documentElement.setAttribute('data-theme',m)}
function curTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}
try{var st=localStorage.getItem('luisara-theme');if(st==='dark'||st==='light')document.documentElement.setAttribute('data-theme',st)}catch(e){}
var SID=['republica','constitucion','ejecutivo','congreso','regiones','tribunales','defensa','economia','politica','exterior','historia'];
function render(){
