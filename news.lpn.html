<style>

:root{
  --bg:#f3f2ed;--bg2:#eae8e0;--card:#fbfaf6;--ink:#0a0b10;--ink2:#3a3d48;--mut:#656874;--line:#d6d3c8;
  --brand:#3a52c9;--brand-ink:#fff;--night:#0b0d12;--night2:#12151c;--night-ink:#f4f4f0;--night-mut:#9a9eae;--night-line:#272d3b;
  --vnc:#3f8a3a;--v3:#c4457a;--vrs:#3f86a8;--one:#3a52c9;--live:#bf4a46;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f14;--bg2:#12151c;--card:#171b24;--ink:#f1f1ec;--ink2:#c9cbd4;--mut:#8e92a3;--line:#2a3040;
  --brand:#93a3e6;--brand-ink:#0b0d12;--vnc:#7fbf74;--v3:#e58aab;--vrs:#6fb5d4;--one:#93a3e6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f14;--bg2:#12151c;--card:#171b24;--ink:#f1f1ec;--ink2:#c9cbd4;--mut:#8e92a3;--line:#2a3040;
  --brand:#93a3e6;--brand-ink:#0b0d12;--vnc:#7fbf74;--v3:#e58aab;--vrs:#6fb5d4;--one:#93a3e6;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Verdana,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.lg{display:block;height:auto}
.soon{display:inline-flex;align-items:center;gap:8px;font:500 13px/1 Verdana;letter-spacing:.04em;color:var(--mut)}
.soon::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mut);opacity:.6}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}

/* header */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;flex:none}
.brand .wm{height:23px;width:auto;aspect-ratio:681/443;color:var(--ink)}
.brand small{font:600 10.5px/1 Verdana;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);padding-left:12px;border-left:1px solid var(--line)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 11px;font:500 14.5px/1 Verdana;color:var(--ink2);text-decoration:none;border-radius:8px}
nav.main a:hover{background:var(--bg2);color:var(--ink)}
.tools{display:flex;align-items:center;gap:10px}
.date{font:500 12.5px/1.2 Verdana;color:var(--mut);white-space:nowrap;text-align:right}
.ib{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;font:inherit}
.ib:hover{background:var(--bg2)}
.ib svg{width:17px;height:17px}
.menu{display:none}
@media (max-width:980px){
  .date{display:none}.menu{display:inline-grid}
  nav.main{display:none;position:absolute;left:0;right:0;top:62px;flex-direction:column;background:var(--bg);padding:10px 16px 16px;border-bottom:1px solid var(--line);margin:0}
  nav.main.open{display:flex}
  nav.main a{padding:13px 8px;font-size:16px}
  .top .wrap{justify-content:space-between}
  .tools{margin-left:auto}
}
@media (max-width:480px){.brand small{display:none}}


/* footer */
footer{background:var(--night);color:var(--night-ink);padding-block:64px 36px}
footer .top2{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-start;padding-bottom:36px;border-bottom:1px solid var(--night-line)}
footer .wm{height:36px;aspect-ratio:681/443;color:#fff;width:auto}
footer .addr{color:var(--night-mut);font-size:15px;margin-top:14px;max-width:34ch}
footer .links{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:8px 40px}
footer .links a{color:#d8dae4;text-decoration:none;font:500 15px Verdana}footer .links a:hover{color:#fff;text-decoration:underline}
footer .partners{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:34px}
footer .partners small{font:600 11px/1 Verdana;letter-spacing:.18em;text-transform:uppercase;color:var(--night-mut);margin-right:6px}
footer .legal{margin-top:32px;color:var(--night-mut);font-size:13.5px;max-width:90ch}


.visit{font:600 14px/1 Verdana;color:var(--brand);text-decoration:none}.visit:hover{text-decoration:underline}.eyebrow{font:600 12px/1 Verdana;letter-spacing:.2em;text-transform:uppercase}h1,h2,h3{margin:0}h1{font:600 clamp(46px,7vw,98px)/.96 Verdana,system-ui,sans-serif}h1 em{font-style:italic}.lede{max-width:64ch;color:var(--ink2);font-size:19px}.note{color:var(--mut);font-size:14.5px}.rv{opacity:1}.js .rv{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.js .rv.in{opacity:1;transform:none}@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none}}

.hd2{padding-block:56px 18px}.hd2 h1{font-size:clamp(40px,6vw,76px);margin-block:.2em .25em}.hd2 h1 em{color:var(--vnc)}
.hd2 .eyebrow{color:var(--vnc)}.hd2 .lede{margin-top:.4em}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.days a{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font:500 14px/1 Verdana;text-decoration:none;color:var(--ink2)}
.days a:hover{background:var(--card)}.days a[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:34px;padding-bottom:70px;align-items:start}
.lead{display:block;text-decoration:none;background:var(--night);color:#fff;border-radius:22px;padding:34px;border-top:5px solid var(--a);margin-bottom:22px}
.lead small,.sc small{font:600 10.5px/1 Verdana;letter-spacing:.18em;text-transform:uppercase;color:var(--a)}
.lead h2{font:600 clamp(28px,4vw,46px)/1.08 Verdana,system-ui,sans-serif;margin:.4em 0 .5em;color:#fff}
.lead p{color:#c7cad6;margin:0 0 16px;font-size:17.5px}.lead time{font:500 13px/1 Verdana;color:var(--night-mut)}
.lead:hover h2{text-decoration:underline}
.g2,.g3{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sc{display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;min-width:0;border-top:3px solid var(--a)}
.sc h3{font:500 20px/1.25 Verdana}.sc p{margin:0;color:var(--ink2);font-size:15.5px}.sc time{margin-top:auto;font:500 12.5px/1.3 Verdana;color:var(--mut)}
.sc:hover h3{text-decoration:underline}
.sh{font:600 30px/1.1 Verdana,system-ui,sans-serif;margin:42px 0 16px}
.tl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:14px 20px;border-top:1px solid var(--line);border-left:3px solid var(--a)}
.tl li:first-child{border-top:0}.tl time{font:500 14px/1.5 Verdana;color:var(--mut);font-variant-numeric:tabular-nums}
.tl a{text-decoration:none}.tl a:hover{text-decoration:underline}.tl b{font:600 11px/1 Verdana;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin-right:6px}
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:80px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.box h4{margin:0 0 12px;font:600 11px/1 Verdana;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.box .visit{display:inline-block;margin-top:12px}.mut{color:var(--mut)}.big{font:600 26px/1.1 Verdana,system-ui,sans-serif;margin:0}
.wrow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px;align-items:baseline}.wrow:first-of-type{border-top:0}
.wrow i{font-style:normal;color:var(--mut)}.wrow.t3{grid-template-columns:1fr auto auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb th,.tb td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
.tb thead th{border-top:0;font:600 11px/1 Verdana;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.side .tb th,.side .tb td{padding:6px 8px;font-size:14px}.wxt td{white-space:normal;vertical-align:top;min-width:120px}.wxt small{color:var(--mut)}
.res{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.res li{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.res li span:last-child{text-align:right}.res b{font:600 24px/1 Verdana,system-ui,sans-serif}
.art{max-width:760px;padding-block:44px 80px}.art h1{font-size:clamp(34px,5vw,58px);margin-block:.3em .3em}.art p{font-size:18.5px;color:var(--ink2)}
.art .meta{font:500 13.5px/1.4 Verdana;color:var(--mut);margin-bottom:28px}.art .g3{margin-top:6px}.art .sc p{font-size:15px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}.side{position:static}.g3{grid-template-columns:1fr}.res{grid-template-columns:1fr}}

.hd h2 em,h2 em{font-style:normal!important;color:var(--acc)!important}

.lede{color:var(--ink2)!important;font-size:15px!important}

.btn,.btn.pri{background:var(--acc2)!important;color:#fff!important;border:1px solid color-mix(in srgb,var(--acc2) 60%,#000)!important;font:700 12px Arial,sans-serif!important;text-transform:uppercase;letter-spacing:.08em;padding:10px 18px!important;box-shadow:inset 0 1px #ffffff26,2px 2px 0 var(--sh4)}
.btn.ghost{background:var(--bx2)!important;color:var(--ink)!important;border-color:var(--ln)!important}

.tab,.chip-b{font:700 12px Arial,sans-serif!important;text-transform:uppercase;letter-spacing:.06em;padding:7px 14px!important;border:1px solid var(--ln)!important;border-bottom:0!important;background:linear-gradient(var(--bx),var(--bx2))!important;color:var(--ink2)!important;border-radius:6px 6px 0 0!important}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--acc2) 88%,#000)!important;color:#fff!important;border-color:var(--acc2)!important}
.tag,.chip,.nowb,.g,.eb,.live{border-radius:0!important}
/* footer */
footer{background:var(--bx2)!important;color:var(--mut)!important;border-top:3px solid var(--acc);padding-block:28px 28px!important}
footer a,footer .links a,footer p,footer .addr,footer .legal{color:var(--ink2)!important}
footer .legal{border-color:var(--ln)!important}
/* fastext bar */
.fast{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;background:#000;font:700 12px/1 "Courier New",monospace;text-transform:uppercase}
.fast a{flex:1;text-align:center;padding:11px 4px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.fast a:nth-of-type(1){background:#f00;color:#fff}.fast a:nth-of-type(2){background:#0f0}.fast a:nth-of-type(3){background:#ff0}.fast a:nth-of-type(4){background:#0ff}
.fast a:hover{filter:brightness(1.15);text-decoration:underline}
.fast .pg{flex:none;color:#fff;padding:11px 10px;display:flex;gap:6px}.fast .pg b{color:#ff0}
@media (max-width:620px){.fast .pg{display:none}.fast{font-size:11px}}
@media (prefers-reduced-motion:reduce){.hero::after{animation:none}}

.js .rv,.rv{opacity:1!important;transform:none!important;transition:none!important}

/* ---- shared engine: seeded rng, templates, date ---- */
var MONTHS=['Ixarius','Savrius','Caspius','Helius','Nerius','Kiomus','Epta','Exsilius','Ennia','Deka','Endeka','Dodeka'];
var WDAYS=['Sunday','Monday','Stasday','Wawsday','Winsday','Fyrday','Erday'];
function xm(s){var h=1779033703^s.length;for(var i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0}
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function RNG(seed){var f=mb(xm(String(seed)));return{f:f,i:function(a,b){return a+Math.floor(f()*(b-a+1))},p:function(x){return x[Math.floor(f()*x.length)]},sh:function(x){var a=x.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(f()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}}}
function dkey(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function fromKey(k){return new Date(Math.floor(k/10000),Math.floor(k/100)%100-1,k%100,12,0)}
function addDays(d,n){var e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12,0);return e}
function wdate(d){return WDAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+(d.getFullYear()-1860)+' AAX'}
function sdate(d){return d.getDate()+' '+MONTHS[d.getMonth()]}
function p2(n){return (n<10?'0':'')+n}
function expand(str,rng,memo,POOL){
  var out=str,guard=0;
  while(out.indexOf('{')>-1&&guard++<4){
    out=out.replace(/\{([a-z]+)(\d*)(?:\.([a-zA-Z]+))?(?::([^}]+))?\}/g,function(m,name,idx,field,arg){
      var key=name+idx;
      if(!(key in memo)){
        if(arg){if(arg.indexOf('|')>-1){memo[key]=rng.p(arg.split('|'))}else{var mm=arg.split('-'),a=parseFloat(mm[0]),b=parseFloat(mm[1]);memo[key]=arg.indexOf('.')>-1?(a+rng.f()*(b-a)).toFixed(1):String(rng.i(a,b))}}
        else{if(!POOL[name])return m;var v0,tries=0,clash;do{v0=rng.p(POOL[name]);clash=false;for(var kk in memo){if(kk!==key&&kk.replace(/\d+$/,'')===name&&memo[kk]===v0)clash=true}}while(clash&&tries++<8);memo[key]=v0}
      }
      var v=memo[key];
      if(typeof v==='object')return field?v[field]:v.name;
      return v;
    });
  }
  return out;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function arcActive(id,key,p,span){var out=[];function starts(sk){return RNG('arc'+id+sk).f()<p}

 return{star:st.name,show:st.show,mayor:mname(r),town:r.p(TOWNS),host:fname(r),out:r.f()<.5?'apology':'stand',c:String(r.i(40,210)),a:String(r.i(640,990)),lawyer:mname(r)}}

/* compose a story from template + pools */
function composeStory(tpl,desk,rng,memo,POOLX,CP){
 var o={pl:expand(tpl.pl,rng,memo,POOLX),h:expand(tpl.h,rng,memo,POOLX),k:expand(tpl.k,rng,memo,POOLX),p:tpl.p.map(function(x){return expand(x,rng,memo,POOLX)})};
 var bg=CP.BG[desk+':'+tpl.k]||CP.BG[desk+':_'];if(bg)o.bg=expand(bg,rng,memo,POOLX);
 var pv=CP.PREV&&(CP.PREV[desk+':'+tpl.k]||CP.PREV[desk+':_']);if(pv)o.pv=expand(pv,rng,memo,POOLX);
 var qs=CP.QUO[desk],qi=Math.floor(rng.f()*qs.length);o.q=expand(qs[qi],rng,memo,POOLX);o.q2=expand(qs[(qi+1+Math.floor(rng.f()*(qs.length-1)))%qs.length],rng,memo,POOLX);
 o.nx=expand(rng.p(CP.NEXT[desk+':'+tpl.k]||CP.NEXT[desk]),rng,memo,POOLX);return o}

S('nac','Luisara Viejo','National§Nacional','Regional Senate sets its agenda for the {w:autumn|winter} sitting§El Senado Regional fija su orden del día para el periodo de {w:otoño|invierno}',[

R('miguel','Nuevo Alexa','Miguel reservoir stands at {n1:48-91}% of capacity§El embalse de Miguel está al {n1:48-91}% de su capacidad',[`The regional water board said the reservoir above Nuevo Alexa is at {n1:48-91}% of capacity, in line with the season.§La junta regional de aguas dijo que el embalse sobre Nuevo Alexa está al {n1:48-91}% de su capacidad, según lo esperado para la época.`,`Snowmelt from the Miguel range feeds the lowland farms through the summer.§El deshielo de la cordillera de Miguel riega las granjas de las tierras bajas durante el verano.`]);
R('miguel','Nuevo Alexa','Highland mine workers vote on a {n1:10-21}-day rota§Los mineros de las tierras altas votan un turno de {n1:10-21} días',[`Workers at the highland mines voted on a new rota of {n1:10-21} days on and the same off. The result will be announced on {w:Soles|Lunes|Esteles}.§Los trabajadores de las minas de las tierras altas votaron un nuevo turno de {n1:10-21} días de trabajo y otros tantos de descanso. El resultado se anunciará el {w:soles|lunes|esteles}.`,`The mines supply stone and minerals to the ports of the Costa Oriental.§Las minas abastecen de piedra y minerales a los puertos de la Costa Oriental.`]);
R('miguel','Nuevo Lancia','Glacier guides count {n1:120-640} walkers on the Miguel trail§Los guías del glaciar cuentan {n1:120-640} excursionistas en el sendero de Miguel',[`Guides counted {n1:120-640} walkers on the Miguel trail over the weekend. Huts on the route were full on {w:Iñes|Tieres}.§Los guías contaron {n1:120-640} excursionistas en el sendero de Miguel durante el fin de semana. Los refugios de la ruta estuvieron llenos el {w:iñes|tieres}.`,`The regional tourist board reminded walkers to carry food and a map.§La oficina regional de turismo recordó a los excursionistas que lleven comida y mapa.`]);
R('miguel','Nuevo Alexa','Frost warning issued for the high orchards§Aviso de helada para los huertos de altura',[`Growers in the high orchards were warned of frost overnight and asked to light smudge fires and cover young trees.§Se avisó a los agricultores de los huertos de altura de una helada nocturna y se les pidió que enciendan fuegos y cubran los árboles jóvenes.`,`The regional farm office said it would check the orchards in the morning.§La oficina agraria regional dijo que revisaría los huertos por la mañana.`]);
R('miguel','Nuevo Lancia','Nuevo Lancia school opens a new mountain-safety course§Una escuela de Nuevo Lancia abre un curso de seguridad en montaña',[`A school in Nuevo Lancia opened a course on snow, ice and weather for pupils aged {n1:12-16}, taught with the local rescue team.§Una escuela de Nuevo Lancia abrió un curso sobre nieve, hielo y tiempo para alumnos de {n1:12-16} años, impartido con el equipo de rescate local.`,`The first group has {n2:18-34} pupils.§El primer grupo tiene {n2:18-34} alumnos.`]);
R('sud','São Juana','Ferries on Mar del Sud run {n1:10-45} minutes late after morning fog§Los ferris del Mar del Sud llevan {n1:10-45} minutos de retraso tras la niebla de la mañana',[`Ferries between Luisara Viejo and São Juana ran about {n1:10-45} minutes late after fog on the inland sea. Services were back on time by midday.§Los ferris entre Luisara Viejo y São Juana llevaron unos {n1:10-45} minutos de retraso por la niebla en el mar interior. A mediodía los servicios volvieron a la hora.`,`Operators asked passengers to check the board before leaving home.§Los operadores pidieron a los pasajeros que consulten el panel antes de salir de casa.`]);
R('sud','São Juana','São Juana fish market opens a new hall with {n1:30-120} stalls§El mercado de pescado de São Juana abre una nave nueva con {n1:30-120} puestos',[`The new hall at São Juana’s fish market opened with {n1:30-120} stalls, cold rooms and a covered landing for small boats.§La nueva nave del mercado de pescado de São Juana abrió con {n1:30-120} puestos, cámaras frigoríficas y un muelle cubierto para barcas pequeñas.`,`Fishers said the extra space would shorten the morning queue.§Los pescadores dijeron que el espacio extra acortará la cola de la mañana.`]);
R('sud','Luisara Viejo','Luisara Viejo council debates a {n1:2-4}-lane bridge over the old canal§El ayuntamiento de Luisara Viejo debate un puente de {n1:2-4} carriles sobre el viejo canal',[`Councillors in Luisara Viejo debated a {n1:2-4}-lane bridge over the old canal, to ease traffic near the ferry quay. No vote was taken.§Los concejales de Luisara Viejo debatieron un puente de {n1:2-4} carriles sobre el viejo canal, para aliviar el tráfico junto al muelle de ferris. No hubo votación.`,`Residents of the canal street asked for a footbridge instead.§Los vecinos de la calle del canal pidieron una pasarela peatonal en su lugar.`]);
R('sud','Luisara Viejo','Sud Glacier visitor centre reports {n1:900-2400} visitors in a week§El centro del Glaciar del Sud registra {n1:900-2400} visitantes en una semana',[`The visitor centre at the Sud Glacier counted {n1:900-2400} visitors in a week, a good number for the season.§El centro de visitantes del Glaciar del Sud contó {n1:900-2400} visitantes en una semana, una buena cifra para la época.`,`Staff said school groups made up about a third.§El personal dijo que los grupos escolares fueron cerca de un tercio.`]);
R('sud','São Juana','Rice harvest on the southern shore expected {n1:3-12} days early§La cosecha de arroz de la orilla sur se espera {n1:3-12} días antes',[`Growers on the southern shore expect to begin the rice harvest {n1:3-12} days early after a warm month.§Los agricultores de la orilla sur esperan empezar la cosecha de arroz {n1:3-12} días antes tras un mes cálido.`,`Mills in São Juana have asked for extra drivers.§Los molinos de São Juana han pedido conductores adicionales.`]);
R('selva','Sitio Pantal','Floodwater cuts the road to Sitio Pantal for {n1:3-18} hours§La crecida corta la carretera a Sitio Pantal durante {n1:3-18} horas',[`Floodwater covered the main road into Sitio Pantal for {n1:3-18} hours. Traffic used the old river track.§El agua cubrió durante {n1:3-18} horas la carretera principal de entrada a Sitio Pantal. El tráfico usó el viejo camino del río.`,`The regional road office said the water was falling.§La oficina regional de carreteras dijo que el agua estaba bajando.`]);
R('selva','Sitio Pantal','Timber cooperatives agree a replanting scheme of {n1:200-1800} hectares§Las cooperativas madereras acuerdan un plan de repoblación de {n1:200-1800} hectáreas',[`Timber cooperatives agreed to replant {n1:200-1800} hectares over the next {n2:3-6} years, with seedlings from the regional nursery.§Las cooperativas madereras acordaron repoblar {n1:200-1800} hectáreas en los próximos {n2:3-6} años, con plantones del vivero regional.`,`Rangers will inspect the new plots each spring.§Los guardas inspeccionarán las parcelas nuevas cada primavera.`]);
R('selva','Sitio Pantal','Rangers log {n1:90-240} bird species in the jungle survey§Los guardas registran {n1:90-240} especies de aves en el censo de la selva',[`Rangers logged {n1:90-240} bird species in this year’s jungle survey, including several rarely seen near the road.§Los guardas registraron {n1:90-240} especies de aves en el censo de la selva de este año, varias raramente vistas cerca de la carretera.`,`The survey is run every autumn by the regional parks office.§El censo lo hace cada otoño la oficina regional de parques.`]);
R('selva','Sitio Pantal','River barges carry a record cocoa load downstream§Las barcazas fluviales llevan una carga récord de cacao río abajo',[`River barges carried a record load of cocoa downstream this week, according to the regional river office.§Las barcazas fluviales llevaron esta semana una carga récord de cacao río abajo, según la oficina regional del río.`,`The cocoa goes on to the ports of the Costa Oriental.§El cacao sigue hacia los puertos de la Costa Oriental.`]);
R('selva','Sitio Pantal','Jungle villages wait {n1:4-20} days for a repaired bridge§Las aldeas de la selva esperan {n1:4-20} días un puente reparado',[`Villages along the jungle road expect to wait {n1:4-20} days for a bridge to be repaired, and are using a rope ferry meanwhile.§Las aldeas de la carretera de la selva esperan {n1:4-20} días a que se repare un puente y usan entretanto una balsa de cuerda.`,`Regional officials said materials were on the way.§Los funcionarios regionales dijeron que los materiales estaban en camino.`]);
R('selva','Sitio Pantal','Wet season arrives {n1:2-9} days ahead of the almanac§La estación húmeda llega {n1:2-9} días antes que el almanaque',[`The first heavy rains came {n1:2-9} days ahead of the almanac. Farmers were told to move seed stores above the flood line.§Las primeras lluvias fuertes llegaron {n1:2-9} días antes que el almanaque. Se dijo a los agricultores que suban los almacenes de semilla por encima de la línea de inundación.`,`The regional weather desk will update its forecast daily.§El servicio regional del tiempo actualizará su pronóstico a diario.`]);
R('costa','Puerto Del Mar','Puerto Del Mar port handles {n1:40-90} ships in a day§El puerto de Puerto Del Mar atiende {n1:40-90} barcos en un día',[`Puerto Del Mar handled {n1:40-90} ships in one day, a record for the season, port officials said.§Puerto Del Mar atendió {n1:40-90} barcos en un solo día, un récord para la temporada, dijeron fuentes portuarias.`,`The port is one of the main outlets on the Sea of Xarvaii.§El puerto es una de las principales salidas al Mar de Xarvaii.`]);
R('costa','Ciudad Bruce','Ciudad Bruce dockers and shippers reach a {n1:6-24}-month wage deal§Estibadores y navieras de Ciudad Bruce cierran un acuerdo salarial de {n1:6-24} meses',[`Dockers and shippers at Ciudad Bruce agreed a wage deal covering {n1:6-24} months, ending a week of talks.§Estibadores y navieras de Ciudad Bruce acordaron un pacto salarial de {n1:6-24} meses, tras una semana de conversaciones.`,`Both sides described the talks as direct and calm.§Ambas partes calificaron las conversaciones de directas y tranquilas.`]);
R('costa','Sherlen','Sherlen fleets go out {n1:1-4} days late for a storm§Las flotas de Sherlen salen {n1:1-4} días tarde por una tormenta',[`Fishing fleets at Sherlen stayed in harbour for {n1:1-4} days while a storm crossed the Sea of Xarvaii and left on the first calm morning.§Las flotas pesqueras de Sherlen se quedaron {n1:1-4} días en puerto mientras una tormenta cruzaba el Mar de Xarvaii y salieron la primera mañana en calma.`,`Fish prices in the market rose slightly.§Los precios del pescado en el mercado subieron ligeramente.`]);
R('costa','Ciudad Myawa','Ciudad Myawa night market extends its hours by {n1:1-3} hours§El mercado nocturno de Ciudad Myawa amplía su horario {n1:1-3} horas',[`The night market at Ciudad Myawa will stay open {n1:1-3} hours later on Vientes and Iñes from next week, the town council said.§El mercado nocturno de Ciudad Myawa abrirá {n1:1-3} horas más los vientes y iñes desde la semana próxima, dijo el ayuntamiento.`,`Stallholders asked for the change after the summer crowds.§Los vendedores pidieron el cambio tras las multitudes del verano.`]);
R('costa','Puerto Del Mar','Harbour pilots train {n1:4-14} new apprentices§Los prácticos del puerto forman a {n1:4-14} aprendices nuevos',[`The harbour pilots’ guild took on {n1:4-14} apprentices, who will spend a year on the pilot boats before steering anything larger.§El gremio de prácticos del puerto incorporó a {n1:4-14} aprendices, que pasarán un año en las lanchas antes de guiar barcos mayores.`,`Applications were open to anyone over eighteen.§La inscripción estaba abierta a mayores de dieciocho años.`]);
R('dong','Dongmyeong','Dust warning on the peninsula road, {n1:1-6} km visibility§Aviso de polvo en la carretera de la península, visibilidad de {n1:1-6} km',[`A dust warning was issued for the peninsula road, with visibility down to {n1:1-6} km. Drivers were asked to keep headlights on.§Se emitió un aviso de polvo para la carretera de la península, con visibilidad reducida a {n1:1-6} km. Se pidió a los conductores llevar las luces encendidas.`,`The warning is expected to last into the evening.§Se espera que el aviso dure hasta la tarde.`]);
R('dong','Dongmyeong','Dongmyeong council discusses the next review of the Special Statute§El consejo de Dongmyeong trata la próxima revisión del Estatuto Especial',[`The Dongmyeong Region council discussed the next review of the Special Statute that governs the region. No vote was taken.§El consejo de la Región de Dongmyeong trató la próxima revisión del Estatuto Especial que rige la región. No hubo votación.`,`Korean and Spanish are both used in the chamber.§En el pleno se usan el coreano y el español.`]);
R('dong','Ciudad Suna','Ciudad Suna schools add {n1:3-12} Korean-language classes§Las escuelas de Ciudad Suna añaden {n1:3-12} clases en coreano',[`Schools in Ciudad Suna added {n1:3-12} Korean-language classes for the new term, taught alongside Spanish.§Las escuelas de Ciudad Suna añadieron {n1:3-12} clases en coreano para el nuevo trimestre, junto al español.`,`The regional education office said more teachers were being trained.§La oficina regional de educación dijo que se están formando más maestros.`]);
R('dong','Minggao','Minggao water cistern programme reaches {n1:80-420} more homes§El programa de cisternas de Minggao llega a {n1:80-420} hogares más',[`The cistern programme in Minggao reached {n1:80-420} more homes this month, giving each a covered tank for rainwater.§El programa de cisternas de Minggao llegó este mes a {n1:80-420} hogares más, con un depósito cubierto de agua de lluvia cada uno.`,`The region pays for the tanks and the families for the pipes.§La región paga los depósitos y las familias las tuberías.`]);
R('dong','Jungrad','Jungrad’s old market holds its monthly bilingual fair§El viejo mercado de Jungrad celebra su feria bilingüe mensual',[`Jungrad’s old market held its monthly fair, with stalls and signs in Korean and Spanish. Organisers counted {n1:300-1400} visitors.§El viejo mercado de Jungrad celebró su feria mensual, con puestos y carteles en coreano y español. Los organizadores contaron {n1:300-1400} visitantes.`,`Next month’s fair will include a cooking stage.§La feria del mes próximo incluirá un escenario de cocina.`]);

S('eco','Puerto Del Mar','Economy§Economía','Ports of the Costa Oriental report {n1:3-9}% more cargo than last year§Los puertos de la Costa Oriental informan de un {n1:3-9}% más de carga que el año pasado',[

S('eco','Luisara Viejo','Economy§Economía','Fishing cooperatives sign a supply deal with {n1:12-40} restaurants§Las cooperativas pesqueras firman un acuerdo de suministro con {n1:12-40} restaurantes',[

S('eco','Sitio Pantal','Economy§Economía','Selva timber exports to Latrevia rise {n1:2-8}% in the quarter§Las exportaciones de madera de la Selva a Latrevia suben un {n1:2-8}% en el trimestre',[

S('eco','Luisara Viejo','Economy§Economía','Savings banks open {n1:3-9} new branches in rural districts§Las cajas de ahorros abren {n1:3-9} oficinas nuevas en distritos rurales',[

S('eco','Dongmyeong','Economy§Economía','Dongmyeong date growers expect a harvest {n1:4-12}% above last year§Los cultivadores de dátiles de Dongmyeong esperan una cosecha un {n1:4-12}% mayor que la del año pasado',[

S('chi','Luisara Viejo','Chisme§Chisme','A new couple on set? Chisme cannot say§¿Nueva pareja en el rodaje? Chisme no puede asegurarlo',[

S('chi','Luisara Viejo','Chisme§Chisme','Chisme’s week: what everyone was talking about§La semana de Chisme: de qué habló todo el mundo',[

   else if(name==='sh')v=rng.p(SHW);
