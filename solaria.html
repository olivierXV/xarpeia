 ['Verrecôte','Verrecôte',18,null,'Pointe sud-ouest de l’archipel, avec son château et ses collines. Vendue par la République latrevienne : double code coutumier.','The south-western tip of the chain, with its castle and hills. Sold by the Latrevian Republic, and under a dual-code framework.'],
 ['Clement','Clement',18,null,'Ancrée à l’extrémité sud-ouest avec Verrecôte, au bord de la mer de Clement. Vendue par la République latrevienne : double code coutumier.','Anchors the south-west with Verrecôte, on the Sea of Clement. Sold by the Latrevian Republic, and under a dual-code framework.']
];
var P=[
{n:1,fr:'Le Royaume',en:'The Kingdom',dfr:'Territoires, langue, symboles',den:'Territories, language, symbols',f:function(){return ''+
 '<div class="fig"><figure>'+flag(180)+'<figcaption>'+t('Le drapeau','The flag')+'</figcaption></figure><figure>'+arms(90)+'<figcaption>'+t('Les armes','The arms')+'</figcaption></figure></div>'+
 '<p>'+t('Solarie est une <span class="y">monarchie constitutionnelle</span> et une entité constitutive du Commonwealth de Latrevia et de Solarie, égale en statut et en dignité à la République fédérale de Latrevia. La souveraineté appartient au peuple de Solarie. Elle s’exerce par le Parlement, le Gouvernement et les tribunaux; la Couronne ne détient que les pouvoirs que la Constitution lui nomme.','Solaria is a <span class="y">constitutional monarchy</span> and a constituent entity of the Commonwealth of Latrevia and Solaria, equal in status and dignity to the Federal Republic of Latrevia. Sovereignty belongs to the people of Solaria. It is exercised through Parliament, the Government and the courts; the Crown holds only the powers the Constitution names.')+'</p>'+
 '<dl class="kv"><dt>'+t('Territoires','Territories')+'</dt><dd>'+t('Neuf îles, voir la rubrique 5','Nine islands, see item 5')+'</dd>'+
 '<dt>'+t('Langue','Language')+'</dt><dd>'+t('Le français, formellement «&nbsp;Solarie&nbsp;». Les lois sont publiées en Solarie; la législation du Commonwealth l’est en Solarie et en anglais latrevien. La langue régionale de chaque île est un patrimoine protégé.','French, formally “Solarie”. Laws are published in Solarie; Commonwealth legislation is published in Solarie and in Latrevian English. The regional speech of each island is a protected heritage language.')+'</dd>'+
 '<dt>'+t('Symboles','Symbols')+'</dt><dd>'+t('Drapeau bleu profond portant un seul losange blanc; armes: un écu bleu portant le même losange. Ce ne sont pas des symboles du Commonwealth, dont le drapeau peut flotter à côté.','A field of deep blue bearing a single white rhombus; the arms are a blue shield bearing the same rhombus. They are not Commonwealth symbols; the Commonwealth flag may fly beside them.')+'</dd>'+
 '<dt>'+t('Siège','Seat')+'</dt><dd>'+t('Le Parlement et la Couronne siègent à Solarie, en attendant l’achèvement de la Cité-couronne de Solarie, planifiée mais non construite.','Parliament and the Crown sit at Solaria proper until the royal capital, the Cité-couronne de Solarie, is completed. It is planned but unbuilt.')+'</dd>'+
 '<dt>'+t('Devise','Motto')+'</dt><dd><span class="y">'+t('Vive Solarie. Jamais de couronne sans consentement.','Vive Solarie. Never a crown without consent.')+'</span></dd></dl>'+
 '<h2 class="sub">'+t('Vos droits','Your rights')+'</h2>'+
 '<ul class="l"><li>'+t('Les droits du titre II de la Constitution latrevienne s’appliquent directement ici, avec la même force que la Constitution de Solarie.','The rights of Title II of the Latrevian Constitution apply here directly, with the same force as the Solarian Constitution.')+'</li><li>'+t('Le droit d’employer le français et la langue de votre île devant toute autorité publique.','The right to use French, and the speech of your island, with any public authority.')+'</li><li>'+t('Le droit au patrimoine, aux coutumes et aux institutions culturelles de votre île.','The right to the heritage, customs and cultural institutions of your island.')+'</li><li>'+t('Le droit de pétition à la Couronne (renvoi constitutionnel) et au Parlement, avec réponse publique sous quatre-vingt-dix jours.','The right to petition the Crown for a constitutional referral, and to petition Parliament, with a public answer within ninety days.')+'</li></ul>'+
 '<p class="dim">'+t('Constitution adoptée à Solarie le 3 Helius 165 AAX.','Constitution adopted at Solaria on 3 Helius 165 AAX.')+'</p>'}},
{n:2,fr:'La Couronne',en:'The Crown',dfr:'Sa Majesté la Reine Zarpaii',den:'Her Majesty Queen Zarpaii',f:function(){return ''+
 '<dl class="kv"><dt>'+t('Reine','Queen')+'</dt><dd><span class="y">Zarpaii Xarpeius</span></dd><dt>'+t('Chancelier royal','Royal Chancellor')+'</dt><dd><span class="y">Aurélien de Montclar</span></dd></dl>'+
 '<p>'+t('La Couronne est le chef cérémoniel et constitutionnel du Royaume. Elle détient cinq pouvoirs, et aucun autre; chacun s’exerce avec le contreseing du Chancelier royal.','The Crown is the ceremonial and constitutional head of the Kingdom. It holds five powers and no others, each exercised only with the countersignature of the Royal Chancellor.')+'</p>'+
 '<h2 class="sub">'+t('Les cinq pouvoirs','The five powers')+'</h2>'+
 '<ul class="l"><li>'+t('Nommer le Premier ministre, qui a la confiance de l’Assemblée nationale.','Appoint the Premier ministre, who must command the confidence of the Assemblée nationale.')+'</li><li>'+t('Accorder ou refuser la dissolution. Elle ne peut refuser une demande du Premier ministre qu’au cours de l’année qui suit des élections.','Grant or refuse dissolution. The Crown may refuse a Premier ministre’s request only within a year of a general election.')+'</li><li>'+t('Renvoyer une fois un projet de loi, dans les quinze jours, avec motifs écrits.','Return a bill once, within fifteen days, with written reasons.')+'</li><li>'+t('Saisir la Cour constitutionnelle avant de signer une loi; la Cour statue sous quarante-cinq jours.','Refer a law to the Constitutional Court before signing; the Court rules within forty-five days.')+'</li><li>'+t('Recevoir les pétitions et y répondre.','Receive and answer petitions.')+'</li></ul>'+
 '<h2 class="sub">'+t('Ce que la Couronne n’a pas','What the Crown does not have')+'</h2>'+
 '<p>'+t('Ni veto, ni initiative politique, ni pouvoir sur le budget, ni pouvoir de faire ou de suspendre la loi. Elle ne peut révoquer un Premier ministre qui a la confiance de l’Assemblée, ni se placer au-dessus de la Cour constitutionnelle. Elle signe chaque loi que le Parlement a votée et que la Cour n’a pas annulée.','No veto, no power of policy initiative, no control over the budget and no power to make or suspend law. It may not dismiss a Premier ministre who commands the Assemblée nationale, nor be placed above the Constitutional Court. It signs every law that Parliament passes and the Court has not struck down.')+'</p>'+
 '<h2 class="sub">'+t('Le Chancelier royal','The Royal Chancellor')+'</h2>'+
 '<p>'+t('Officier non partisan, proposé par le Conseil de la Couronne et confirmé par les deux chambres, pour un seul mandat de huit ans. Il contresigne chaque acte de la Couronne et en répond devant le Parlement; la Couronne n’en est jamais responsable. Il ne peut être révoqué que par les deux tiers des deux chambres.','A non-partisan officer, nominated by the Council of the Crown and confirmed by both houses, for a single term of eight years. The Chancellor countersigns every act of the Crown and answers for it to Parliament, so the Crown never does. Removal takes two-thirds of both houses.')+'</p>'+
 '<h2 class="sub">'+t('Le serment du consentement','The consent oath')+'</h2>'+
 '<p>'+t('À l’avènement, le monarque jure devant les deux chambres, en séance publique, de garder la Constitution et la Charte, de ne tenir la couronne que du consentement du peuple et de servir également toutes les îles. Il n’y a pas de formule religieuse. La Reine l’a prêté la première, elle qui avait été couronnée des décennies plus tôt sans l’avoir.','At accession the monarch swears before both houses, in open sitting, to keep the Constitution and the Charter, to hold the crown only as the people consent, and to serve every island equally. There is no religious form of words. It was taken first by a queen who had been crowned decades earlier without one.')+'</p>'+
 '<h2 class="sub">'+t('Le Conseil de la Couronne','The Council of the Crown')+'</h2>'+
 '<ul class="l"><li>'+t('Le Chancelier royal (sans voix prépondérante)','The Royal Chancellor (no casting vote)')+'</li><li>'+t('Le président de la Cour constitutionnelle','The President of the Constitutional Court')+'</li><li>'+t('La présidente de l’Assemblée nationale, <span class="y">Honorine Valcourt</span>','The Speaker of the Assemblée nationale, <span class="y">Honorine Valcourt</span>')+'</li><li>'+t('Le président du Sénat des Îles, <span class="y">Gaspard Delmarre</span>','The President of the Sénat des Îles, <span class="y">Gaspard Delmarre</span>')+'</li></ul>'+
 '<p class="dim">'+t('Il conseille la Couronne sur les nominations. À égalité, la question est perdue. La succession suit l’ancienne loi de la lignée cassiopéenne.','It advises the Crown on nominations. On a tie the question is lost. Succession follows the earlier law of the Cassiopeian line.')+'</p>'}},
{n:3,fr:'Le Parlement',en:'Parliament',dfr:'Assemblée nationale et Sénat des Îles',den:'Assemblée nationale and Sénat des Îles',f:function(){
 var tot=0;GROUPS.forEach(function(g){tot+=g[4]});
 var bars=GROUPS.map(function(g){return '<div class="bar" style="--c:'+g[3]+'"><b>'+g[0]+'<small>'+t(g[1],g[2])+'</small></b><span class="f" style="width:'+Math.round(g[4]/62*100)+'%"></span><em>'+g[4]+'</em></div>'}).join('');
 var trows=TERR.map(function(r){return '<tr><td>'+r[0]+'</td><td class="num">'+r[2]+'</td><td class="num">3</td></tr>'}).join('');
 return ''+
 '<p>'+t('Le Parlement a deux chambres. L’<span class="y">Assemblée nationale</span> domine; le <span class="y">Sénat des Îles</span> revoit et retarde, sans pouvoir bloquer. Le Parlement siège en public et publie ses comptes rendus en Solarie et en anglais latrevien.','Parliament has two houses. The <span class="y">Assemblée nationale</span> dominates; the <span class="y">Sénat des Îles</span> reviews and delays but cannot block. Parliament sits in public and publishes its record in Solarie and in Latrevian English.')+'</p>'+
 '<h2 class="sub">'+t('Assemblée nationale','Assemblée nationale')+'</h2>'+
 '<dl class="kv"><dt>'+t('Présidente','Speaker')+'</dt><dd><span class="y">Honorine Valcourt</span></dd><dt>'+t('Mandat','Term')+'</dt><dd>'+t('Quatre ans, à la représentation proportionnelle sur tout le Royaume, au scrutin secret. Chaque territoire a au moins un siège.','Four years, by proportional representation from the whole Kingdom, by secret ballot. Each territory has at least one seat.')+'</dd><dt>'+t('Pouvoirs','Powers')+'</dt><dd>'+t('Vote de confiance; origine de tout budget et de tout impôt; dernier mot sur la loi ordinaire.','The confidence vote; originates every budget and tax bill; has the last word on ordinary law.')+'</dd></dl>'+
 '<p class="dim">'+t('Composition après les dernières élections: '+tot+' sièges.','Composition after the last general election: '+tot+' seats.')+'</p>'+
 '<div class="bars">'+bars+'</div><p class="maj">'+t('Majorité absolue: 91 sièges. Le Gouvernement s’appuie sur le Parti de la Concorde et les Travaillistes: 99 sièges. Chaque parti siège au Congrès du Commonwealth dans le groupe indiqué sous son nom.','Absolute majority: 91 seats. The Government rests on the Parti de la Concorde and the Travaillistes: 99 seats. Each party sits in the Commonwealth Congress in the group named under it.')+'</p>'+
 '<h2 class="sub">'+t('Sénat des Îles','Sénat des Îles')+'</h2>'+
 '<dl class="kv"><dt>'+t('Président','President')+'</dt><dd><span class="y">Gaspard Delmarre</span></dd><dt>'+t('Membres','Members')+'</dt><dd>'+t('Vingt-sept: trois pour chacun des neuf territoires, choisis par le conseil de l’île, pour six ans, renouvelés par tiers tous les deux ans.','Twenty-seven: three for each of the nine territories, chosen by the island council for six-year terms, one-third renewed every two years.')+'</dd><dt>'+t('Pouvoirs','Powers')+'</dt><dd>'+t('Jamais dissous. Examine tout projet pendant soixante jours, peut le retarder une fois et proposer des amendements. Son assentiment est nécessaire pour tout texte qui touche aux compétences des conseils insulaires.','Never dissolved. Examines every bill for sixty days, may delay it once and propose amendments. Its assent is required for anything touching the competence of the island councils.')+'</dd></dl>'+
 '<h2 class="sub">'+t('Sièges par territoire','Seats by territory')+'</h2>'+
 '<table class="t"><thead><tr><th>'+t('Territoire','Territory')+'</th><th class="num">'+t('Assemblée','Assemblée')+'</th><th class="num">'+t('Sénat','Senate')+'</th></tr></thead><tbody>'+trows+'</tbody></table>'+
 '<h2 class="sub">'+t('Comment une loi est faite','How a law is made')+'</h2>'+
 '<ul class="l"><li>'+t('Un projet peut naître dans l’une ou l’autre chambre ou au Conseil des ministres.','A bill may start in either house or in the Council of Ministers.')+'</li><li>'+t('Le Sénat des Îles a soixante jours pour l’examiner.','The Sénat des Îles has sixty days to examine it.')+'</li><li>'+t('L’Assemblée accepte, rejette ou modifie ses amendements et vote à la majorité simple.','The Assemblée accepts, rejects or modifies its amendments and passes it by a simple majority.')+'</li><li>'+t('La Couronne signe, sauf renvoi ou annulation par la Cour.','The Crown signs, unless it returns the bill or the Court strikes it down.')+'</li></ul>'}},
{n:4,fr:'Le Gouvernement',en:'The Government',dfr:'Le Premier ministre et le Conseil',den:'The Premier ministre and the Council',f:function(){return ''+
 '<dl class="kv"><dt>'+t('Premier ministre','Premier ministre')+'</dt><dd><span class="y">George Stellarix</span></dd><dt>'+t('Majorité','Majority')+'</dt><dd>'+t('Parti de la Concorde, Travaillistes (99 sièges sur 180)','Parti de la Concorde, Travaillistes (99 of 180 seats)')+'</dd></dl>'+
 '<p>'+t('Le Premier ministre dirige le Conseil des ministres et l’administration, exécute les lois et ne répond que devant l’Assemblée nationale.','The Premier ministre leads the Council of Ministers, directs the administration, carries out the laws and answers to the Assemblée nationale alone.')+'</p>'+
 '<h2 class="sub">'+t('Le Conseil des ministres','The Council of Ministers')+'</h2>'+
 '<p>'+t('Les ministres sont nommés par la Couronne sur l’avis du Premier ministre, avec le contreseing du Chancelier royal. Chacun répond de son ministère devant l’Assemblée et peut être convoqué dans l’une ou l’autre chambre. Les délibérations sont confidentielles et les procès-verbaux publics après vingt-cinq ans.','Ministers are appointed by the Crown on the Premier ministre’s advice, countersigned by the Royal Chancellor. Each answers to the Assemblée for the conduct of their ministry and may be summoned to either house. Proceedings are confidential, and minutes are made public after twenty-five years.')+'</p>'+
 '<h2 class="sub">'+t('Nomination et confiance','Appointment and confidence')+'</h2>'+
 '<ul class="l"><li>'+t('La Couronne nomme la personne qui a la confiance de l’Assemblée. À défaut, un médiateur teste les coalitions pendant vingt jours au plus.','The Crown appoints the person who commands the Assemblée’s confidence. Failing that, a mediator tests coalitions for no more than twenty days.')+'</li><li>'+t('Le Premier ministre ne peut être renversé que par un vote de défiance constructif: une motion qui nomme un successeur et obtient la majorité simple. Une censure sans successeur est sans effet.','The Premier ministre can be removed only by a constructive vote of no confidence: a motion that names a successor and carries a simple majority. A censure with no named successor has no effect.')+'</li><li>'+t('Il peut poser la question de confiance à tout moment.','The Premier ministre may put a question of confidence at any time.')+'</li><li>'+t('La dissolution suit la demande du Premier ministre, sauf dans l’année d’une élection. La Couronne ne peut dissoudre seule qu’en cas d’impasse certifiée par la Cour. Une élection suit sous soixante jours.','Dissolution follows the Premier ministre’s request, except within a year of an election. The Crown may dissolve alone only on a deadlock the Court certifies. An election follows within sixty days.')+'</li></ul>'}},
{n:5,fr:'Les Îles',en:'The Islands',dfr:'Neuf territoires, neuf conseils',den:'Nine territories, nine councils',f:function(){
 var rows=TERR.map(function(r){return '<tr><td class="y">'+r[0]+'</td><td>'+t(r[4],r[5])+'</td></tr>'}).join('');
 return ''+
 '<p>'+t('Le Royaume compte <span class="y">neuf territoires</span>. Aucun n’est une entité constitutive du Commonwealth, et aucun ne peut être cédé, fusionné ou divisé sans la procédure de l’article 31.','The Kingdom comprises <span class="y">nine territories</span>. None is a constituent entity of the Commonwealth, and none may be ceded, merged or divided except by the procedure of Article 31.')+'</p>'+
 '<table class="t"><thead><tr><th>'+t('Territoire','Territory')+'</th><th>'+t('En bref','In brief')+'</th></tr></thead><tbody>'+rows+'</tbody></table>'+
 '<h2 class="sub">'+t('Les conseils insulaires','The island councils')+'</h2>'+
 '<p>'+t('Chaque territoire a un conseil élu pour quatre ans par ses habitants. Il gouverne les affaires locales, choisit ses trois sénateurs et parle pour son île devant le Parlement et la Couronne. Il a autorité sur: le gouvernement local, l’usage des sols, l’urbanisme local, les institutions culturelles et patrimoniales, et la protection de la langue régionale.','Each territory has a council elected for four years by its residents. It governs local affairs, chooses its three senators and speaks for its island before Parliament and the Crown. It has authority over local government, land use, local planning, cultural and heritage institutions, and the protection of regional speech.')+'</p>'+
 '<h2 class="sub">'+t('Double héritage','Hybrid heritage')+'</h2>'+
 '<p>'+t('Neu Solaria, Clement et Verrecôte sont venues au Royaume par achat à la République latrevienne. Une loi du Parlement doit donner à chacune un cadre à double code qui reconnaisse les coutumes des deux traditions, sur le modèle de New Latrei et d’Haradia en Latrevia, sans réduire aucun droit.','Neu Solaria, Clement and Verrecôte came to the Kingdom by sale from the Latrevian Republic. A law of Parliament shall give each a dual-code framework recognising the customs of both traditions, on the model of New Latrei and Haradia in Latrevia, without reducing any right.')+'</p>'+
 '<h2 class="sub">'+t('Intégrité des territoires','Integrity of the territories')+'</h2>'+
 '<p>'+t('Fusionner ou diviser des territoires exige les deux tiers des deux chambres, le consentement de chaque conseil touché et un référendum local aux deux tiers. Perdre un territoire, par sécession ou cession, exige les trois quarts des deux chambres et un référendum local aux trois quarts.','Merging or dividing territories takes two-thirds of both houses, the consent of each council affected and a two-thirds local referendum. Losing a territory, by secession or cession, takes three-quarters of both houses and a three-quarters local referendum.')+'</p>'+
 '<h2 class="sub">'+t('La Cité-couronne','The Cité-couronne')+'</h2>'+
 '<p>'+t('La capitale royale future, la Cité-couronne de Solarie, figure sur la carte mais n’est pas construite. La Constitution la nomme pour qu’une génération future puisse y transférer le siège par une loi des deux chambres.','The planned royal capital, the Cité-couronne de Solarie, is marked on the map but not yet built. The Constitution names it so that a future generation may move the seat by a law of both houses.')+'</p>'}},
{n:6,fr:'Les Tribunaux',en:'The Courts',dfr:'Cour constitutionnelle, Cour suprême',den:'Constitutional and Supreme Court',f:function(){return ''+
 '<h2 class="sub">'+t('Cour constitutionnelle','Constitutional Court')+'</h2>'+
 '<p>'+t('Elle juge de la constitutionnalité des lois et des actes du Royaume et des saisines de la Couronne. Cinq juges, pour douze ans non renouvelables: deux désignés par la Couronne sur l’avis du Premier ministre, deux par l’Assemblée nationale, un par le Sénat des Îles; chacun est confirmé aux deux tiers par le Sénat. Les mandats sont échelonnés.','It rules on the constitutionality of laws and acts of the Kingdom and on referrals from the Crown. Five judges serve non-renewable twelve-year terms: two nominated by the Crown on the Premier ministre’s advice, two by the Assemblée nationale and one by the Sénat des Îles. Each is confirmed by two-thirds of the Sénat. Terms are staggered.')+'</p>'+
 '<p>'+t('Peuvent la saisir: la Couronne, le Premier ministre, un tiers de l’une ou l’autre chambre, tout conseil insulaire, et tout tribunal devant une question constitutionnelle. Une loi annulée est nulle à compter de la décision, sauf date ultérieure fixée par la Cour.','It may be petitioned by the Crown, the Premier ministre, one-third of either house, any island council, or any court facing a constitutional question. A law struck down is void from the date of the ruling, unless the Court sets a later date.')+'</p>'+
 '<h2 class="sub">'+t('Cour suprême','Supreme Court')+'</h2>'+
 '<p>'+t('Dernière instance d’appel pour le droit solarien. Ses juges sont nommés par la Couronne sur l’avis du Conseil de la Couronne, avec l’accord du Sénat des Îles, jusqu’à soixante-quinze ans. Ses décisions sont soumises à la Haute Cour du Commonwealth en matière de droit du Commonwealth.','The final court of appeal for Solarian law. Its justices are appointed by the Crown on the advice of the Council of the Crown, with the consent of the Sénat des Îles, and serve until seventy-five. Its decisions are subject to the Commonwealth High Court on matters of Commonwealth law.')+'</p>'+
 '<h2 class="sub">'+t('Au Commonwealth','In the Commonwealth')+'</h2>'+
 '<p>'+t('Solarie propose deux juges à la Cour constitutionnelle du Commonwealth et trois à la Haute Cour. Ils sont désignés par la Couronne sur l’avis du Conseil de la Couronne et confirmés par le Sénat des Îles.','Solaria nominates two judges to the Commonwealth Constitutional Court and three to the High Court. They are nominated by the Crown on the advice of the Council of the Crown and confirmed by the Sénat des Îles.')+'</p>'}},
{n:7,fr:'Les Finances',en:'Finances',dfr:'Fonds souverain, Domaine, liste civile',den:'Sovereign Fund, Estate, Civil List',f:function(){return ''+
 '<p>'+t('Le Royaume est riche comme centre financier et maritime, et il redistribue: la banque, l’assurance et le transport maritime financent, par le budget, le Fonds et le Domaine, un État-providence à la française.','The Kingdom is rich as a financial and maritime centre, and it redistributes: banking, insurance and shipping fund a French-style welfare state through the budget, the Fund and the Estate.')+'</p>'+
 '<h2 class="sub">'+t('Le Fonds souverain','The Sovereign Fund')+'</h2>'+
 '<p>'+t('Il détient l’excédent des recettes bancaires, d’assurance et maritimes, et le revenu du Domaine de la Couronne, pour le peuple et les générations futures. Tout retrait exige une loi de l’Assemblée avec l’assentiment du Sénat des Îles. Il est audité chaque année, et son rapport est publié dans les deux langues. Il ne peut être engagé pour une obligation du Commonwealth sans l’accord du Parlement.','It holds the surplus of the Kingdom’s banking, insurance and shipping revenue, and the income of the Crown Estate, for the people and future generations. Withdrawals require a law passed by the Assemblée with the assent of the Sénat des Îles. It is audited each year and its report is published in both languages. It may not be pledged to any Commonwealth obligation without the consent of Parliament.')+'</p>'+
 '<h2 class="sub">'+t('Le Domaine de la Couronne','The Crown Estate')+'</h2>'+
 '<p>'+t('Détenu en fiducie pour le peuple de Solarie. Il n’appartient ni au monarque ni au gouvernement du jour. Un conseil indépendant, nommé par le Conseil de la Couronne et confirmé par le Sénat des Îles, le gère et rend compte chaque année au Parlement. Son revenu va au Fonds souverain.','Held in trust for the people of Solaria. It belongs neither to the monarch nor to the Government of the day. An independent board, appointed by the Council of the Crown and confirmed by the Sénat des Îles, manages it and reports annually to Parliament. Its income is paid to the Sovereign Fund.')+'</p>'+
 '<h2 class="sub">'+t('La liste civile','The Civil List')+'</h2>'+
 '<p>'+t('Une somme annuelle fixe, fixée par la loi au début de chaque règne et révisée au plus tous les dix ans. Elle paie la maison du monarque, les devoirs cérémoniels et le bureau du Chancelier royal. La Couronne n’a aucun autre droit sur l’argent public, et aucun pouvoir sur le Domaine ni sur le Fonds.','A fixed annual sum, set by law at the start of each reign and reviewed no more often than every ten years. It pays for the monarch’s household, ceremonial duties and the Royal Chancellor’s office. The Crown has no other claim on public money and no power over the Estate or the Fund.')+'</p>'+
 '<h2 class="sub">'+t('Budget','Budget')+'</h2>'+
 '<p>'+t('Tout budget naît à l’Assemblée nationale; le Sénat des Îles peut l’amender mais non initier un crédit. À défaut de budget au début de l’exercice, les dépenses continuent au niveau précédent, sans nouveau programme.','Budget bills originate in the Assemblée nationale. The Sénat des Îles may amend a budget but may not initiate an appropriation. If no budget is enacted by the start of the fiscal year, spending continues at the previous year’s level and no new programme may be funded.')+'</p>'+
