<title>LTV</title><meta name="description" content="LTV, Meridian&rsquo;s television channel on channel 4: news, drama, films and quizzes. Schedule, programmes and about.">
<style>

:root{
  --bg:#f3f2ed;--bg2:#eae8e0;--card:#fbfaf6;--ink:#0a0b10;--ink2:#3a3d48;--mut:#656874;--line:#d6d3c8;
  --brand:#1f43f0;--brand-ink:#fff;--night:#05060a;--night2:#0d1019;--night-ink:#f4f4f0;--night-mut:#9a9eae;--night-line:#1f2331;
  --vnc:#169c00;--v3:#e0206f;--vrs:#0a8fc0;--one:#1f43f0;--live:#e5262d;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07080c;--bg2:#0d0f16;--card:#111420;--ink:#f1f1ec;--ink2:#c9cbd4;--mut:#8e92a3;--line:#222637;
  --brand:#7a90ff;--brand-ink:#05060a;--vnc:#3cdc1c;--v3:#ff5aa0;--vrs:#2cc3f5;--one:#7a90ff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07080c;--bg2:#0d0f16;--card:#111420;--ink:#f1f1ec;--ink2:#c9cbd4;--mut:#8e92a3;--line:#222637;
  --brand:#7a90ff;--brand-ink:#05060a;--vnc:#3cdc1c;--v3:#ff5aa0;--vrs:#2cc3f5;--one:#7a90ff;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.lg{display:block;height:auto}
.soon{display:inline-flex;align-items:center;gap:8px;font:500 13px/1 "Trebuchet MS";letter-spacing:.04em;color:var(--mut)}
.soon::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mut);opacity:.6}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}

/* header */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;flex:none}
.brand .wm{height:23px;width:auto;aspect-ratio:681/443;color:var(--ink)}
.brand small{font:600 10.5px/1 "Trebuchet MS";letter-spacing:.24em;text-transform:uppercase;color:var(--mut);padding-left:12px;border-left:1px solid var(--line)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 11px;font:500 14.5px/1 "Trebuchet MS";color:var(--ink2);text-decoration:none;border-radius:8px}
nav.main a:hover{background:var(--bg2);color:var(--ink)}
.tools{display:flex;align-items:center;gap:10px}
.date{font:500 12.5px/1.2 "Trebuchet MS";color:var(--mut);white-space:nowrap;text-align:right}
.ib{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;font:inherit}
.ib:hover{background:var(--bg2)}
.ib svg{width:17px;height:17px}
.menu{display:none}
@media (max-width:980px){
  .date{display:none}.menu{display:inline-grid}
  nav.main{display:none;position:absolute;left:0;right:0;top:62px;flex-direction:column;background:var(--bg);padding:10px 16px 16px;border-bottom:1px solid var(--line);margin:0}
  nav.main.open{display:flex}
  nav.main a{padding:13px 8px;font-size:16px}
  .top .wrap{justify-content:space-between}
  .tools{margin-left:auto}
}
@media (max-width:480px){.brand small{display:none}}


/* footer */
footer{background:var(--night);color:var(--night-ink);padding-block:64px 36px}
footer .top2{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-start;padding-bottom:36px;border-bottom:1px solid var(--night-line)}
footer .wm{height:36px;aspect-ratio:681/443;color:#fff;width:auto}
footer .addr{color:var(--night-mut);font-size:15px;margin-top:14px;max-width:34ch}
footer .links{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:8px 40px}
footer .links a{color:#d8dae4;text-decoration:none;font:500 15px "Trebuchet MS"}footer .links a:hover{color:#fff;text-decoration:underline}
footer .partners{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:34px}
footer .partners small{font:600 11px/1 "Trebuchet MS";letter-spacing:.18em;text-transform:uppercase;color:var(--night-mut);margin-right:6px}
footer .legal{margin-top:32px;color:var(--night-mut);font-size:13.5px;max-width:90ch}


.visit{font:600 14px/1 "Trebuchet MS";color:var(--brand);text-decoration:none}.visit:hover{text-decoration:underline}.eyebrow{font:600 12px/1 "Trebuchet MS";letter-spacing:.2em;text-transform:uppercase}h1,h2,h3{margin:0}h1{font:600 clamp(46px,7vw,98px)/.96 "Trebuchet MS",system-ui,sans-serif}h1 em{font-style:italic}.lede{max-width:64ch;color:var(--ink2);font-size:19px}.note{color:var(--mut);font-size:14.5px}.rv{opacity:1}.js .rv{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.js .rv.in{opacity:1;transform:none}@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none}}

.hd2{padding-block:56px 18px}.hd2 h1{font-size:clamp(40px,6vw,76px);margin-block:.2em .25em}.hd2 h1 em{color:var(--vnc)}
.hd2 .eyebrow{color:var(--vnc)}.hd2 .lede{margin-top:.4em}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.days a{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font:500 14px/1 "Trebuchet MS";text-decoration:none;color:var(--ink2)}
.days a:hover{background:var(--card)}.days a[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:34px;padding-bottom:70px;align-items:start}
.lead{display:block;text-decoration:none;background:var(--night);color:#fff;border-radius:22px;padding:34px;border-top:5px solid var(--a);margin-bottom:22px}
.lead small,.sc small{font:600 10.5px/1 "Trebuchet MS";letter-spacing:.18em;text-transform:uppercase;color:var(--a)}
.lead h2{font:600 clamp(28px,4vw,46px)/1.08 "Trebuchet MS",system-ui,sans-serif;margin:.4em 0 .5em;color:#fff}
.lead p{color:#c7cad6;margin:0 0 16px;font-size:17.5px}.lead time{font:500 13px/1 "Trebuchet MS";color:var(--night-mut)}
.lead:hover h2{text-decoration:underline}
.g2,.g3{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sc{display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;min-width:0;border-top:3px solid var(--a)}
.sc h3{font:500 20px/1.25 "Trebuchet MS"}.sc p{margin:0;color:var(--ink2);font-size:15.5px}.sc time{margin-top:auto;font:500 12.5px/1.3 "Trebuchet MS";color:var(--mut)}
.sc:hover h3{text-decoration:underline}
.sh{font:600 30px/1.1 "Trebuchet MS",system-ui,sans-serif;margin:42px 0 16px}
.tl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:14px 20px;border-top:1px solid var(--line);border-left:3px solid var(--a)}
.tl li:first-child{border-top:0}.tl time{font:500 14px/1.5 "Trebuchet MS";color:var(--mut);font-variant-numeric:tabular-nums}
.tl a{text-decoration:none}.tl a:hover{text-decoration:underline}.tl b{font:600 11px/1 "Trebuchet MS";letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin-right:6px}
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:80px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.box h4{margin:0 0 12px;font:600 11px/1 "Trebuchet MS";letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.box .visit{display:inline-block;margin-top:12px}.mut{color:var(--mut)}.big{font:600 26px/1.1 "Trebuchet MS",system-ui,sans-serif;margin:0}
.wrow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px;align-items:baseline}.wrow:first-of-type{border-top:0}
.wrow i{font-style:normal;color:var(--mut)}.wrow.t3{grid-template-columns:1fr auto auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb th,.tb td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
.tb thead th{border-top:0;font:600 11px/1 "Trebuchet MS";letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.side .tb th,.side .tb td{padding:6px 8px;font-size:14px}.wxt td{white-space:normal;vertical-align:top;min-width:120px}.wxt small{color:var(--mut)}

function wdate(d){return WDAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+(d.getFullYear()-1860)+' AAX'}
function sdate(d){return d.getDate()+' '+MONTHS[d.getMonth()]}
function p2(n){return (n<10?'0':'')+n}
function expand(str,rng,memo,POOL){
  var out=str,guard=0;
  while(out.indexOf('{')>-1&&guard++<4){
    out=out.replace(/\{([a-z]+)(\d*)(?:\.([a-zA-Z]+))?(?::([^}]+))?\}/g,function(m,name,idx,field,arg){
      var key=name+idx;
      if(!(key in memo)){
        if(arg){if(arg.indexOf('|')>-1){memo[key]=rng.p(arg.split('|'))}else{var mm=arg.split('-'),a=parseFloat(mm[0]),b=parseFloat(mm[1]);memo[key]=arg.indexOf('.')>-1?(a+rng.f()*(b-a)).toFixed(1):String(rng.i(a,b))}}
        else{if(!POOL[name])return m;var v0,tries=0,clash;do{v0=rng.p(POOL[name]);clash=false;for(var kk in memo){if(kk!==key&&kk.replace(/\d+$/,'')===name&&memo[kk]===v0)clash=true}}while(clash&&tries++<8);memo[key]=v0}
      }
      var v=memo[key];
      if(typeof v==='object')return field?v[field]:v.name;
      return v;
    });
  }
  return out;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function setupChrome(storeKey){

  var saved=store(storeKey);if(saved==='dark'||saved==='light')root.setAttribute('data-theme',saved);
  document.getElementById('theme').addEventListener('click',function(){var cur=root.getAttribute('data-theme');if(!cur)cur=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var nx=cur==='dark'?'light':'dark';root.setAttribute('data-theme',nx);store(storeKey,nx)});
  var nav=document.getElementById('nav'),mb2=document.getElementById('menu');
  mb2.addEventListener('click',function(){var o=nav.classList.toggle('open');mb2.setAttribute('aria-expanded',o?'true':'false')});
  nav.addEventListener('click',function(e){if(e.target.tagName==='A'){nav.classList.remove('open');mb2.setAttribute('aria-expanded','false')}});
  var n=new Date();
  document.getElementById('aaxdate').innerHTML=WDAYS[n.getDay()]+' '+n.getDate()+' '+MONTHS[n.getMonth()]+'<br>'+(n.getFullYear()-1860)+' AAX';
  var yr=document.getElementById('yr');if(yr)yr.textContent=n.getFullYear()-1860;
}

 return{star:st.name,show:st.show,mayor:mname(r),town:r.p(TOWNS),host:fname(r),out:r.f()<.5?'apology':'stand',c:String(r.i(40,210)),a:String(r.i(640,990)),lawyer:mname(r)}}

/* compose a story from template + pools */
function composeStory(tpl,desk,rng,memo,POOLX,CP){
 var o={pl:expand(tpl.pl,rng,memo,POOLX),h:expand(tpl.h,rng,memo,POOLX),k:expand(tpl.k,rng,memo,POOLX),p:tpl.p.map(function(x){return expand(x,rng,memo,POOLX)})};
 var bg=CP.BG[desk+':'+tpl.k]||CP.BG[desk+':_'];if(bg)o.bg=expand(bg,rng,memo,POOLX);
 var pv=CP.PREV&&(CP.PREV[desk+':'+tpl.k]||CP.PREV[desk+':_']);if(pv)o.pv=expand(pv,rng,memo,POOLX);
 var qs=CP.QUO[desk],qi=Math.floor(rng.f()*qs.length);o.q=expand(qs[qi],rng,memo,POOLX);o.q2=expand(qs[(qi+1+Math.floor(rng.f()*(qs.length-1)))%qs.length],rng,memo,POOLX);
 o.nx=expand(rng.p(CP.NEXT[desk+':'+tpl.k]||CP.NEXT[desk]),rng,memo,POOLX);return o}

function aboutV(){return'<section class="hd2 wrap"><div class="eyebrow">About</div><h1>About <em>LTV</em></h1><p class="lede">LTV, Lumen Television, is a commercial broadcaster owned by Meridian. It went off the air at the end of the civil war and returned to television on 21 Ennia 166 AAX, on channel 4.</p></section><div class="wrap" style="padding-bottom:70px"><div class="g2"><div class="sc" style="--a:var(--gold)"><small>Its own</small><h3>Made by LTV</h3><p>LTV makes its own programmes and its own news, from its own newsroom.</p></div><div class="sc" style="--a:var(--gold)"><small>Competition</small><h3>One voice among several</h3><p>LTV was built to compete.</p></div></div>'+
