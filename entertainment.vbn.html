<style>



:root{
  --bg:#f3f2ed;--bg2:#eae8e0;--card:#fbfaf6;--ink:#0a0b10;--ink2:#3a3d48;--mut:#656874;--line:#d6d3c8;
  --brand:#3a52c9;--brand-ink:#fff;--night:#0b0d12;--night2:#12151c;--night-ink:#f4f4f0;--night-mut:#9a9eae;--night-line:#272d3b;
  --vnc:#3f8a3a;--v3:#c4457a;--vrs:#3f86a8;--one:#3a52c9;--live:#bf4a46;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f14;--bg2:#12151c;--card:#171b24;--ink:#f1f1ec;--ink2:#c9cbd4;--mut:#8e92a3;--line:#2a3040;
  --brand:#93a3e6;--brand-ink:#0b0d12;--vnc:#7fbf74;--v3:#e58aab;--vrs:#6fb5d4;--one:#93a3e6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f14;--bg2:#12151c;--card:#171b24;--ink:#f1f1ec;--ink2:#c9cbd4;--mut:#8e92a3;--line:#2a3040;
  --brand:#93a3e6;--brand-ink:#0b0d12;--vnc:#7fbf74;--v3:#e58aab;--vrs:#6fb5d4;--one:#93a3e6;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Verdana,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.lg{display:block;height:auto}
.soon{display:inline-flex;align-items:center;gap:8px;font:500 13px/1 Verdana;letter-spacing:.04em;color:var(--mut)}
.soon::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mut);opacity:.6}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}

/* header */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;flex:none}
.brand .wm{height:23px;width:auto;aspect-ratio:681/443;color:var(--ink)}
.brand small{font:600 10.5px/1 Verdana;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);padding-left:12px;border-left:1px solid var(--line)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 11px;font:500 14.5px/1 Verdana;color:var(--ink2);text-decoration:none;border-radius:8px}
nav.main a:hover{background:var(--bg2);color:var(--ink)}
.tools{display:flex;align-items:center;gap:10px}
.date{font:500 12.5px/1.2 Verdana;color:var(--mut);white-space:nowrap;text-align:right}
.ib{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;font:inherit}
.ib:hover{background:var(--bg2)}
.ib svg{width:17px;height:17px}
.menu{display:none}
@media (max-width:980px){
  .date{display:none}.menu{display:inline-grid}
  nav.main{display:none;position:absolute;left:0;right:0;top:62px;flex-direction:column;background:var(--bg);padding:10px 16px 16px;border-bottom:1px solid var(--line);margin:0}
  nav.main.open{display:flex}
  nav.main a{padding:13px 8px;font-size:16px}
  .top .wrap{justify-content:space-between}
  .tools{margin-left:auto}
}
@media (max-width:480px){.brand small{display:none}}


/* footer */
footer{background:var(--night);color:var(--night-ink);padding-block:64px 36px}
footer .top2{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-start;padding-bottom:36px;border-bottom:1px solid var(--night-line)}
footer .wm{height:36px;aspect-ratio:681/443;color:#fff;width:auto}
footer .addr{color:var(--night-mut);font-size:15px;margin-top:14px;max-width:34ch}
footer .links{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:8px 40px}
footer .links a{color:#d8dae4;text-decoration:none;font:500 15px Verdana}footer .links a:hover{color:#fff;text-decoration:underline}
footer .partners{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:34px}
footer .partners small{font:600 11px/1 Verdana;letter-spacing:.18em;text-transform:uppercase;color:var(--night-mut);margin-right:6px}
footer .legal{margin-top:32px;color:var(--night-mut);font-size:13.5px;max-width:90ch}


.visit{font:600 14px/1 Verdana;color:var(--brand);text-decoration:none}.visit:hover{text-decoration:underline}.eyebrow{font:600 12px/1 Verdana;letter-spacing:.2em;text-transform:uppercase}h1,h2,h3{margin:0}h1{font:400 clamp(46px,7vw,98px)/.96 "Helvetica Neue",Arial,sans-serif}h1 em{font-style:italic}.lede{max-width:64ch;color:var(--ink2);font-size:19px}.note{color:var(--mut);font-size:14.5px}.rv{opacity:1}.js .rv{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.js .rv.in{opacity:1;transform:none}@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none}}

.hd2{padding-block:56px 18px}.hd2 h1{font-size:clamp(40px,6vw,76px);margin-block:.2em .25em}.hd2 h1 em{color:var(--vnc)}
.hd2 .eyebrow{color:var(--vnc)}.hd2 .lede{margin-top:.4em}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.days a{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font:500 14px/1 Verdana;text-decoration:none;color:var(--ink2)}
.days a:hover{background:var(--card)}.days a[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:34px;padding-bottom:70px;align-items:start}
.lead{display:block;text-decoration:none;background:var(--night);color:#fff;border-radius:22px;padding:34px;border-top:5px solid var(--a);margin-bottom:22px}
.lead small,.sc small{font:600 10.5px/1 Verdana;letter-spacing:.18em;text-transform:uppercase;color:var(--a)}
.lead h2{font:400 clamp(28px,4vw,46px)/1.08 "Helvetica Neue",Arial,serif;margin:.4em 0 .5em;color:#fff}
.lead p{color:#c7cad6;margin:0 0 16px;font-size:17.5px}.lead time{font:500 13px/1 Verdana;color:var(--night-mut)}
.lead:hover h2{text-decoration:underline}
.g2,.g3{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sc{display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;min-width:0;border-top:3px solid var(--a)}
.sc h3{font:500 20px/1.25 Verdana}.sc p{margin:0;color:var(--ink2);font-size:15.5px}.sc time{margin-top:auto;font:500 12.5px/1.3 Verdana;color:var(--mut)}
.sc:hover h3{text-decoration:underline}
.sh{font:400 30px/1.1 "Helvetica Neue",Arial,serif;margin:42px 0 16px}
.tl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:14px 20px;border-top:1px solid var(--line);border-left:3px solid var(--a)}
.tl li:first-child{border-top:0}.tl time{font:500 14px/1.5 Verdana;color:var(--mut);font-variant-numeric:tabular-nums}

function expand(str,rng,memo,POOL){
  var out=str,guard=0;
  while(out.indexOf('{')>-1&&guard++<4){
    out=out.replace(/\{([a-z]+)(\d*)(?:\.([a-zA-Z]+))?(?::([^}]+))?\}/g,function(m,name,idx,field,arg){
      var key=name+idx;
      if(!(key in memo)){
        if(arg){if(arg.indexOf('|')>-1){memo[key]=rng.p(arg.split('|'))}else{var mm=arg.split('-'),a=parseFloat(mm[0]),b=parseFloat(mm[1]);memo[key]=arg.indexOf('.')>-1?(a+rng.f()*(b-a)).toFixed(1):String(rng.i(a,b))}}
        else{if(!POOL[name])return m;var v0,tries=0,clash;do{v0=rng.p(POOL[name]);clash=false;for(var kk in memo){if(kk!==key&&kk.replace(/\d+$/,'')===name&&memo[kk]===v0)clash=true}}while(clash&&tries++<8);memo[key]=v0}
      }
      var v=memo[key];
      if(typeof v==='object')return field?v[field]:v.name;
      return v;
    });
  }

}

CPE.BG['news:_']='VBN Productions makes the Corporation&rsquo;s dramas, variety shows and films at the Compound in Xareionople. Its programmes are broadcast on VBN 1 and V3, and its music is played on Radio 1 and Kiss FM.';
CPE.BG['gos:_']='The Gossip desk reports on public figures in the entertainment business. Claims in these stories are attributed and unconfirmed unless it says otherwise, and anyone named may reply on this site. Stories about officials and elected politicians are reported by the VNC Newsroom, not here.';
CPE.PREV['news:_']='The Compound has had a busy year, with two new dramas, a live music series and a games tournament all launched since the spring. VBN says the investment has begun to repay itself in audience.';
CPE.PREV['gos:_']='The people in these stories are regularly photographed in the Compound canteen, on the ferry to Solaria and at the first nights of the Erday Film Premiere. Most of what is said about them never turns out to be true.';
var TE={news:[],gos:[]};
TE.news=[
 {k:'Drama',h:'{show} renewed for another series',p:['VBN has renewed {show} for another full series, the Compound announced today. Filming begins after the winter break, and the cast, including {actor} and {actor2}, will return.','The renewal follows a run of strong ratings. The show has been among the most-watched programmes on {ch:VBN 1|V3} for {n:6-14} weeks.','Producers said the new series would take the story &ldquo;somewhere we have not been&rdquo;, but gave no further details.'],pl:'The Compound',w:3},
 {k:'Casting',h:'{actor} joins the cast of {show}',p:['The actor {actor} is to join the cast of {show} for its next series, VBN announced. {actor} said it was &ldquo;a part I have wanted for years&rdquo;.','{actor} has appeared in several Erday Film Premieres and was last seen on {ch:VBN 1|V3} in a guest role.','The producers said the new character would be &ldquo;someone the others did not expect&rdquo;.'],pl:'The Compound',w:2},
 {k:'Audiences',h:'The Long Table breaks its audience record with {n:910-990} thousand viewers',p:['Erday Night at the Long Table drew {n} thousand viewers at its peak, the largest audience for a live variety show this year, VBN&rsquo;s audience panel reported.','The show was hosted by {pres} and included a live set from {band}. The studio audience of eight hundred was the largest the Compound has seated.','VBN said it would repeat the highlights on Sunday.'],pl:'The Compound',w:3},
 {k:'Film',h:'Cameras roll on a new Erday Film Premiere shot on the Gulf of Latreionople',p:['Filming began this week on the next Erday Film Premiere, shot on location along the Gulf of Latreionople and at the Compound. The film stars {actor} and {actor2}.','The director said the shoot would last {n:5-9} weeks and that much of the action took place on ferries and at harbour cafés.','The film will be shown first on VBN 1 and then on V3.'],pl:'The Gulf of Latreionople',w:2},
 {k:'Music',h:'{band} announce a live date at the Compound',p:['{band} will play a live set at the Compound on Erday {n:6-24} Deka, VBN announced. The date is part of the Studio Three Live season and will be broadcast on V3 and simulcast on Kiss FM.','Tickets, which are free, will be allocated by ballot.','The band said it was &ldquo;grateful and slightly terrified&rdquo;.'],pl:'The Compound',w:2},
 {k:'Games',h:'Game On finals sell out the Compound',p:['The finals of Game On, the competitive gaming series, have sold out the Compound&rsquo;s largest studio. {n:2-5} teams from Baybay, Alexagrad and Lancia will take part.','The finals will be shown live on V3, with commentary on Kiss FM and Radio 1.','Organisers said the prize pool was the largest yet.'],pl:'The Compound',w:2},
 {k:'Awards',h:'VBN Screen Awards shortlist: {show} leads with {n:5-9} nominations',p:['{show} leads the shortlist for the VBN Screen Awards with {n} nominations, ahead of {show2} and Hearth &amp; Harbour. The awards will be presented at a ceremony at the Compound.','{actor} is shortlisted for best actor and {actor2} for best supporting performance. The shortlist is chosen by a panel of critics and by viewers&rsquo; votes.','The ceremony will be shown live on VBN 1.'],pl:'The Compound',w:3},
 {k:'Radio',h:'Radio 1 adds a Sunday drama in sound',p:['Radio 1 will broadcast a new Sunday drama, adapted from {show}, beginning next month. The cast will include {actor}.','The drama will run for {n:6-12} episodes and will be repeated on Erday afternoon. It will be made at the Compound&rsquo;s radio studio.','Radio 1 said the aim was to give the show &ldquo;a second life in the ear&rdquo;.'],pl:'Radio 1',w:2},
 {k:'Studios',h:'Studio Three gets a new stage and a bigger audience',p:['Studio Three at the Compound has been rebuilt with a new stage, new lighting and room for {n:300-600} more people. The first show on the new stage will be Studio Three Live.','VBN said the work cost less than planned and had been finished on time. The studio will host the live music, games and variety shows.','Visitors will be able to join the audience by ballot.'],pl:'The Compound',w:1},
 {k:'Drama',h:'{show} to end after its next series',p:['VBN confirmed that {show} will end after its next series. The producers said the decision had been made &ldquo;with love, and after a long conversation with the cast&rdquo;.','{actor}, one of the leads, said it was &ldquo;a good time to stop and a sad one&rdquo;. A farewell episode is planned for the end of the series.','The Compound said a new drama would take its place on the schedule.'],pl:'The Compound',w:1}
];
TE.gos=[
 {k:'Romance',h:'{actor} and {actor2} seen together at {place}',p:['The actors {actor} and {actor2}, who play opposite each other in {show}, were seen having lunch together at {place}, according to readers who contacted this desk.','Both have said in the past that they are &ldquo;just colleagues&rdquo;. Neither has commented on the sighting.','Friends say the two have been seen together on several recent evenings.'],pl:'Xareionople',w:3},
 {k:'Rumours',h:'Is {pres} leaving {mshow}? Insiders say the presenter is tired',p:['Rumours at the Compound say the presenter {pres} may leave {mshow} at the end of the season, though no announcement has been made.','Colleagues describe the presenter as &ldquo;very good and very tired&rdquo;. {pres}&rsquo;s agent said the presenter was &ldquo;busy, and happy&rdquo;.','VBN said there was nothing to announce.'],pl:'The Compound',w:2},
 {k:'On set',h:'{actor} spotted filming in secret on the ferry to Solaria',p:['The actor {actor} was seen on the Solaria ferry on Winsday with a camera crew, according to passengers. The scene is thought to be for an Erday Film Premiere.','A VBN spokesperson said that no filming had been announced and that the crew &ldquo;had every right to take the ferry like anyone else&rdquo;.','Passengers said the actor signed several tickets.'],pl:'The Sea Lane',w:2},
 {k:'Style',h:'Who wore what at the Erday Film Premiere',p:['The red carpet outside the Compound was busy on Erday, with {actor}, {actor2} and {singer} arriving in a series of striking outfits.','{singer} wore a long coat in dark green that had, according to the designer, &ldquo;taken three months and a lot of tea&rdquo;. Fashion writers were divided.','The film itself was well received.'],pl:'The Compound',w:2},
 {k:'Feud?',h:'{actor} and {actor2} deny a row over a scene',p:['The actors {actor} and {actor2} have both denied that they quarrelled on the set of {show} this week, after reports that filming had stopped for an afternoon.','A representative for {actor} said that the two were &ldquo;the best of colleagues&rdquo;, and that the delay had been caused by the weather.','Crew said the mood had been tense, though not unusually so.'],pl:'The Compound',w:2},
 {k:'Homes',h:'{singer} buys a house on the Gulf of Latreionople',p:['The singer {singer} has bought a house on the Gulf of Latreionople, according to reports in the Port of Erimos. The house is said to have a view of the lighthouse and a very small garden.','{singer} has not confirmed the purchase. A neighbour said the singer &ldquo;seems very quiet, and plays the piano at night&rdquo;.','The price was not disclosed.'],pl:'The Gulf of Latreionople',w:1},
 {k:'On air',h:'{pres} loses voice live on air',p:['The presenter {pres} lost their voice during a live broadcast of {mshow} on Fyrday and had to hand over to a colleague mid-sentence. The moment was widely shared.','{pres} returned later in the programme and made a joke of it. A VBN spokesperson said the presenter was &ldquo;fine and a little hoarse&rdquo;.','Viewers sent messages of sympathy.'],pl:'The Compound',w:2},
 {k:'Reunion',h:'{actor} and {actor2} to reunite on screen',p:['The actors {actor} and {actor2}, who starred together in {show} before it ended its previous series, are to reunite on screen in a special, according to people at the Compound.','Neither would confirm the story, though both were seen at the production office on Winsday.','VBN said it would announce any new programme in the usual way.'],pl:'The Compound',w:2},
 {k:'Fans',h:'Fans queue overnight outside the Compound for {singer}',p:['Dozens of fans queued overnight outside the Compound gates for a chance to see the singer {singer} at a rehearsal for Studio Three Live. Some had brought chairs and flasks.','Security said the crowd was well behaved. {singer} appeared at the gate at dawn and signed autographs for twenty minutes.','The show is on V3 on Erday.'],pl:'The Compound',w:2}
];

var DLE=[
 {key:20261026,desk:'gos',t:1195,w:48,k:'Exclusive',h:'Odile Dellarosa on the 19:00 bulletin: &ldquo;I would rather say it myself&rdquo;',pl:'The Compound',
  p:['Odile Dellarosa, the host of The Long Table and Hearsay and VBN&rsquo;s best-known face, gave an emotional live interview to the VNC Evening Bulletin tonight in which she made a serious claim about the conduct of her former partner, Mayor Joaquín Ferreira of Prado.','&ldquo;I loved him,&rdquo; she told the bulletin&rsquo;s anchor, Livia Castellan. &ldquo;But I would rather say it myself than have it said for me.&rdquo; The bulletin is carried live on VBN 1 every evening, so the interview was seen on both channels at once.','Ms Dellarosa, the daughter of President Casimir Dellarosa, who held office from 114 to 120 AAX, has been on television since she was a teenager. Her representatives asked for privacy.']},
 {key:20261027,desk:'news',t:620,w:44,k:'Statement',h:'VBN: Odile Dellarosa&rsquo;s programmes continue as planned',pl:'VBN Compound',
  p:['VBN said that Odile Dellarosa&rsquo;s programmes would continue as planned, including The Long Table on Erday and Hearsay on Sunday. The Corporation said the interview on the VNC Evening Bulletin, which VBN 1 carries live under its agreement with the Trust, was a matter for VNC and that VBN had had no part in it.','&ldquo;Odile has our full support,&rdquo; a spokesperson said. VBN said it would not comment on the claims themselves, which concern a public official.','Staff at the Compound said the mood on Tuesday was subdued but that rehearsals went ahead.']},
 {key:20261027,desk:'gos',t:1230,w:46,k:'Rival',h:'The mayor goes to LTV, and LTV&rsquo;s bulletin has its biggest night',pl:'The Compound',
  p:['Mayor Joaquín Ferreira of Prado chose the new channel LTV for his reply to Odile Dellarosa, turning down VNC. LTV News at Seven had its largest audience since the channel returned to the air last month.','Observers at the Compound said the choice made sense: the mayor is a former VBN actor who left the Corporation some years ago and, they said, &ldquo;does not owe the family any favours&rdquo;.','Ms Dellarosa&rsquo;s representatives said she would not respond through the television.']},
 {key:20261028,desk:'news',t:900,w:42,k:'Ratings',h:'The Dellarosa interview made the Evening Bulletin the most-watched news programme on record',pl:'The Compound',
  p:['The interview with Odile Dellarosa made the 19:00 bulletin the most-watched news programme on record, with 1.2 million viewers at its peak across VNC 2 and VBN 1, VNC reported.','The Federal Media Authority said it had received 142 complaints about the broadcast. The VNC Trust said it stood by its decision to broadcast.','The Long Table, which Ms Dellarosa hosts on Erdays, is expected to see a rise in viewers this week.']},
 {key:20261029,desk:'news',t:840,w:40,k:'Taxes',h:'Odile Dellarosa tops the list of highest taxpayers again',pl:'The Compound',
  p:['Odile Dellarosa headed the annual list of the country&rsquo;s highest individual taxpayers for the seventh year running, according to figures published this week. The list was prepared before her interview on the Evening Bulletin.','Her income comes from her programmes, her investments and her family&rsquo;s holdings, which predate the presidency of her father. Colleagues describe her as &ldquo;the hardest-working rich person on the Compound&rdquo;.','Ms Dellarosa has not commented on the list.']},
 {key:20261030,desk:'gos',t:1000,w:44,k:'Reaction',h:'Long Table crew rally round Odile Dellarosa ahead of Erday',pl:'The Compound',
  p:['The crew of The Long Table said that Odile Dellarosa would host the Erday show as planned, to an audience of eight hundred. A banner reading &ldquo;We are with you&rdquo; went up in the studio on Fyrday.','A V3 presenter said on air that the interview was &ldquo;brave, and I would not have had the courage&rdquo;. Fans left flowers at the Compound gate.','The producers said she had asked for no changes to the running order.']},
 {key:20261031,desk:'gos',t:1305,w:50,k:'Erday',h:'Standing ovation as Odile Dellarosa hosts The Long Table',pl:'The Compound',
  p:['Odile Dellarosa received a long standing ovation from an audience of eight hundred as she opened Erday Night at the Long Table. She said only: &ldquo;Thank you. Now let us have an evening.&rdquo; She did not mention the interview.','The show went ahead as planned, with a live set from Studio Three and a first showing of the Erday film introduced from the studio.','VBN said the programme drew the largest audience of the year.']},
 {key:20261101,desk:'gos',t:1095,w:42,k:'Sunday',h:'Odile Dellarosa and Mateo Novak open Hearsay as usual',pl:'The Compound',
  p:['Odile Dellarosa returned to Hearsay on V3 on Sunday with her co-host Mateo Novak. The programme opened with the week&rsquo;s showbiz talk and moved to the Truth Box with the usual studio guest.','Asked by a panellist how she was, she said: &ldquo;I said what I had to say. Next question.&rdquo; The programme did not return to the subject.']},
 {key:20261102,desk:'gos',t:800,w:44,k:'A week on',h:'A week on: what the Dellarosa interview changed',pl:'The Compound',
  p:['A week after Odile Dellarosa spoke on the Evening Bulletin, the affair has left Mayor Joaquín Ferreira on leave, a lively argument about broadcasting and a rise in viewers for The Long Table.','The Federal Media Authority is working through 142 complaints. The VNC Trust has said it will publish a note on its reasoning. Ms Dellarosa&rsquo;s representatives say she is &ldquo;getting on with her work&rdquo;.','Whatever the outcome, the interview will be remembered as the most talked-about hour on Kosmos television this year.']}
];

 {k:'Feud?',h:'Rumours of a row between {a} and {b} on the set of {show}',p:['Rumours are spreading at the Compound that {a} and {b}, who play the leads in {show}, have not been speaking off set. Crew say the two have not shared a dressing-room corridor for a fortnight.','Neither actor has commented. A production source said &ldquo;they are professionals&rdquo;, in a tone that left little doubt.','The show is currently filming episode {ep}.']},
 {k:'Feud?',h:'{show} producers say there is &ldquo;no row&rdquo; as {a} and {b} attend table read',p:['Producers of {show} said there was &ldquo;no row of any kind&rdquo;, and that {a} and {b} had both attended the table read for episode {ep} on Winsday.','Those present said the two sat at opposite ends of the table and were &ldquo;perfectly civil&rdquo;. A crew member said that the scene they were reading was a quarrel, which may have helped.','Fans have begun taking sides online.']},
 {k:'Interview',h:'{a} breaks silence: &ldquo;We disagreed about a scene&rdquo;',p:['{a} has broken silence on the reports of a row with {b}, telling a V3 programme that they had &ldquo;disagreed about a scene, and neither of us was gracious&rdquo;.','&ldquo;It is a disagreement, not a war,&rdquo; the actor said. &ldquo;We have worked together for years and we will again.&rdquo;','{b} has not yet replied. The scene in question is understood to be in episode {ep}.']},
 {k:'Reply',h:'{b} answers: &ldquo;I respect {a} more than a bad afternoon&rdquo;',p:['{b} has replied to {a}, saying in a statement that &ldquo;I respect {a} more than I resent a bad afternoon, and I am sorry that our afternoon became public&rdquo;.','The two are expected to film together on Fyrday. Friends said they had spoken privately over the weekend.','The producers said they were &ldquo;relieved and not at all surprised&rdquo;.']},
 {k:'Episode',h:'{show} writes the row into episode {ep}',p:['Writers of {show} have put the real-life quarrel between {a} and {b} into episode {ep}, VBN confirmed, with the actors&rsquo; consent. The scene is said to be one of the best of the series.','&ldquo;It is the first time I have been asked to rehearse an argument I actually had,&rdquo; {a} told the Compound&rsquo;s magazine.','The episode will be shown on Erday on V3.']}
 ]};

 {k:'Rumours',h:'Is {p} leaving {show}? Compound insiders say yes',p:['Insiders at the Compound say the presenter {p} may be leaving {show} after {n} years. No announcement has been made, but colleagues say a farewell has been discussed.','{p} has been on the programme since the early years of the show and is closely identified with it. Viewers said they would &ldquo;not be pleased&rdquo;.','VBN said it did not comment on rumours.']},
 {k:'Rumours',h:'{p}&rsquo;s agent: &ldquo;No comment, and not a no&rdquo;',p:['The agent of the presenter {p} said only that there was &ldquo;no comment and not a no&rdquo; on whether the presenter would leave {show}.','A VBN source said talks about the presenter&rsquo;s future had been &ldquo;warm and long&rdquo;. Another said the presenter had been offered a different programme.','The programme was on air as usual.']},
 {k:'Confirmed',h:'VBN confirms {p} to leave {show} after {n} years',p:['VBN confirmed today that {p} will leave {show} at the end of the month after {n} years. The presenter said in a statement that it had been &ldquo;the privilege of my working life&rdquo;.','VBN thanked {p} and said the presenter would be &ldquo;back on our screens in another role&rdquo;, without saying which.','Viewers sent hundreds of messages to the programme.']},
 {k:'Replacement',h:'{s} favourite to take over {show}',p:['The presenter {s} is the favourite to take over {show} when {p} leaves, according to people at the Compound. VBN said no decision had been made.','{s} has presented the programme on holiday cover several times and is popular with viewers. {s} said it would be &ldquo;an honour, and a very large pair of shoes&rdquo;.','A decision is expected within the week.']},
 {k:'Farewell',h:'{p}&rsquo;s farewell show: date and guests announced',p:['VBN announced that {p}&rsquo;s last edition of {show} will be on air on the last day of the month, with guests from the programme&rsquo;s {n} years. The studio audience will be the largest yet.','{p} said it would be &ldquo;a party, and I intend to cry only briefly&rdquo;. {s} will take over the following Monday.','The programme will be repeated on Sunday.']}
 ]};

 {k:'Romance',h:'{a} and {b} seen near the registry in {town}',p:['The actor {a} and the singer {b} were seen near the registry office in {town} on Winsday, according to witnesses, dressed in what one described as &ldquo;suspiciously good clothes&rdquo;.','Neither has commented. Both have said in the past that they were &ldquo;good friends&rdquo;.','The pair have been seen together at several recent first nights.']},
 {k:'Romance',h:'{a} and {b} neither confirm nor deny',p:['The representatives of {a} and {b} said the pair would &ldquo;neither confirm nor deny anything about their private lives&rdquo;. A friend said both were &ldquo;very happy and very tired of being asked&rdquo;.','Fans on social pages have taken the silence as confirmation.','{a} is currently working on {show}.']},
 {k:'Romance',h:'A ring on Studio Three Live: {b} shows it off',p:['Viewers noticed a ring on the hand of {b} during Studio Three Live on Erday, and the programme&rsquo;s pages were quickly full of questions.','{b} joked about it on air, saying that it was &ldquo;a very expensive piece of jewellery and nothing more&rdquo;. {a} was reportedly in the audience.','VBN said it had no comment on the private lives of its performers.']},
 {k:'Confirmed',h:'{a} and {b} confirm: married quietly in {town}',p:['The actor {a} and the singer {b} have confirmed that they were married in a small ceremony in {town}, with a handful of friends and no cameras.','&ldquo;We wanted one day that belonged to us,&rdquo; {b} said in a statement. &ldquo;We hope you will forgive us for not inviting you all.&rdquo;','The couple will not take a holiday until {show} finishes filming. Congratulations arrived from across the Compound.']}
 ]};

 {k:'Music',h:'{band} cancel a rehearsal at the Compound',p:['{band} cancelled a rehearsal for Studio Three Live at the Compound on Winsday, VBN confirmed, without giving a reason. The band had been due to play on Erday.','Crew said the members had arrived separately and left separately. A representative said the band was &ldquo;taking a day&rdquo;.','The show will go ahead as planned.']},
 {k:'Music',h:'Rumours of a split at {band}',p:['Rumours that {band} are about to split have spread through the Compound. People close to the band say that {n} of the members have not spoken to each other for weeks.','The singer {singer} was seen leaving the Compound alone on Fyrday. A representative said the singer was &ldquo;writing, not leaving&rdquo;.','The band has not made a statement.']},
 {k:'Music',h:'{band} announce a long break',p:['{band} have announced that they will take a &ldquo;long break&rdquo; after their next date at the Compound. In a joint statement the members said they had &ldquo;done everything we set out to do and want to do something else&rdquo;.','The break has no end date. Fans said they were &ldquo;sad and a little relieved that it was not a split&rdquo;.','The final shows will be broadcast on V3.']},
 {k:'Music',h:'{singer} to record a solo album',p:['The singer {singer}, of {band}, will record a solo album at the Compound during the break, VBN announced. {singer} said the songs were &ldquo;the ones that did not fit anywhere else&rdquo;.','The album will be released next year and a live set will be shown on Studio Three Live.','The other members of the band wished {singer} well.']},
 {k:'Music',h:'{band} final show announced for Studio Three Live',p:['VBN announced that the last show before the break by {band} will be shown live on Studio Three Live on Erday, with guests from the Compound&rsquo;s music scene. Tickets will be allocated by ballot.','The band said it would play &ldquo;every song we know, in an order that makes no sense&rdquo;.','The show will also be carried on Kiss FM.']}
