<title>VNC Newsroom</title><meta name="description" content="The VNC Newsroom: Federation, Commonwealth, neighbours, Regnum, sport and weather, filed daily.">
<style>/* Charter: VNC Trust family (paper, serif, double rules, flat) */
:root{--bg:var(--pg);--line:var(--ln);--card:var(--bx);--pg:#ece6d4;--bx:#f7f3e6;--bx2:#e3dcc6;--ln:#9a9378;--ink:#1c241c;--ink2:#3d463c;--mut:#5f6654;--acc:#2f5a2c;--live:#a4423c;--vnc:#2f5a2c;--vrs:#2d6b86;--tx:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#0f1511;--bx:#151d17;--bx2:#1c261e;--ln:#3b4a3d;--ink:#e6ebe0;--ink2:#bcc7b8;--mut:#869283;--acc:#8fc084;--vnc:#8fc084;--vrs:#74b6d2;--live:#d9726b;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#0f1511;--bx:#151d17;--bx2:#1c261e;--ln:#3b4a3d;--ink:#e6ebe0;--ink2:#bcc7b8;--mut:#869283;--acc:#8fc084;--vnc:#8fc084;--vrs:#74b6d2;--live:#d9726b;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;background:var(--pg);color:var(--ink);font:16px/1.6 Georgia,"Times New Roman",serif}
a{color:inherit;text-decoration:none;cursor:pointer}h1,h2,h3,h4,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
img,svg{max-width:100%}.lg{display:block;height:auto}
:focus-visible{outline:2px dashed var(--acc);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:14px}
/* masthead */
.mast{background:var(--bx);border-bottom:6px double var(--acc)}
.mast .wrap{display:flex;align-items:center;gap:16px;padding-block:14px}
.mast .vl{width:82px}
.mast .nm{font:700 12px Georgia;letter-spacing:.2em;text-transform:uppercase;border-left:1px solid var(--ln);padding-left:16px;line-height:1.45}
.mast .nm small{display:block;font:italic 13px Georgia;letter-spacing:0;text-transform:none;color:var(--mut)}
.seal{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;border:2px solid var(--acc);outline:1px solid var(--acc);outline-offset:3px;font:700 9px/1.15 Georgia;letter-spacing:.12em;text-transform:uppercase;text-align:center;color:var(--acc);flex:none;margin-left:6px}
.tools{margin-left:auto;display:flex;align-items:center;gap:12px}
.date{font:12px/1.4 Verdana,sans-serif;text-align:right;color:var(--ink2)}
.ib{font:700 11px Georgia;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;background:transparent;color:var(--acc);border:1px solid var(--acc);cursor:pointer}
.ib:hover{background:var(--acc);color:var(--bx)}
.menu{display:none!important}
nav.main{max-width:1120px;margin:0 auto;padding:0 14px;display:flex;flex-wrap:wrap;border-bottom:1px solid var(--ln);position:relative}
nav.main a{font:700 12px Georgia;letter-spacing:.14em;text-transform:uppercase;padding:12px 18px 11px 0;margin-right:18px;color:var(--ink2)}
nav.main a:hover{color:var(--acc);box-shadow:inset 0 -3px var(--acc)}
.navbar{background:var(--pg)}

:root{--d-fed:#3d5a8a;--d-comm:#8a6a1f;--d-nbr:#8a3d56;--d-reg:#6a4f8f;--d-spt:#2f6b2c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--d-fed:#8fa8d8;--d-comm:#d2b05e;--d-nbr:#d98aa6;--d-reg:#b4a0dc;--d-spt:#8fc084}}
:root[data-theme="dark"]{--d-fed:#8fa8d8;--d-comm:#d2b05e;--d-nbr:#d98aa6;--d-reg:#b4a0dc;--d-spt:#8fc084}
.eyebrow{font:700 11px Georgia;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
h1,h2,h3{margin:0}
.visit{color:var(--acc);border-bottom:1px solid currentColor;font:700 12px Georgia;letter-spacing:.06em;text-transform:uppercase}
.lede{color:var(--ink2);max-width:68ch}
.note,.mut{color:var(--mut)}.note{font-size:13px}
.hd2{max-width:1120px;margin:22px auto 0;padding:18px 24px 18px;background:var(--bx);border:1px solid var(--ln);border-top:4px double var(--acc)}
.hd2.wrap{max-width:calc(1120px - 28px)}
.hd2 h1{font:700 clamp(28px,4.2vw,42px)/1.12 Georgia,serif;margin:.1em 0 .25em}.hd2 h1 em{font-style:italic;color:var(--acc)}
.hd2 .eyebrow{color:var(--acc)}
.days{display:flex;gap:0;flex-wrap:wrap;margin-top:14px;border-top:1px solid var(--ln)}
.days a{font:700 12px Georgia;letter-spacing:.1em;text-transform:uppercase;padding:10px 16px 9px 0;margin-right:16px;color:var(--ink2)}
.days a:hover{color:var(--acc)}.days a[aria-current="true"]{color:var(--acc);box-shadow:inset 0 -3px var(--acc)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;padding:22px 14px 10px;align-items:start}
.lead{display:block;background:var(--bx);border:1px solid var(--ln);border-top:4px double var(--a,var(--acc));padding:20px 24px;margin-bottom:18px}
.lead small,.sc small{font:700 10px Georgia;letter-spacing:.18em;text-transform:uppercase;color:var(--a,var(--acc))}
.lead h2{font:700 clamp(24px,3.2vw,34px)/1.18 Georgia,serif;margin:.3em 0 .4em}
.lead p{color:var(--ink2);margin:0 0 12px;font-size:16.5px}.lead time,.sc time{font:11px Verdana,sans-serif;color:var(--mut);letter-spacing:.03em}
.lead:hover h2,.sc:hover h3,.tl a:hover{text-decoration:underline}
.g2,.g3{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sc{display:flex;flex-direction:column;gap:7px;background:var(--bx);border:1px solid var(--ln);border-top:3px solid var(--a,var(--acc));padding:14px 16px;min-width:0}
.sc h3{font:700 17px/1.3 Georgia}.sc p{color:var(--ink2);font-size:14.5px}.sc time{margin-top:auto}
.sh{font:700 12px Georgia;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:26px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--acc)}
.tl{background:var(--bx);border:1px solid var(--ln)}
.tl li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 16px;border-top:1px dotted var(--ln);border-left:3px solid var(--a,var(--acc))}
.tl li:first-child{border-top:0}.tl time{font:700 12.5px "Courier New",monospace;color:var(--acc)}
.tl a{font:700 15.5px/1.35 Georgia}.tl b{font:700 10px Georgia;letter-spacing:.12em;text-transform:uppercase;color:var(--a,var(--acc));margin-right:6px}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:14px}
.box{background:var(--bx);border:1px solid var(--ln);border-top:4px double var(--acc);padding:14px 18px}
.box h4{margin:0 0 10px;font:700 11px Georgia;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.box .visit{display:inline-block;margin-top:10px}.big{font:700 22px/1.2 Georgia;margin:0}
.wrow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:6px 0;border-top:1px dotted var(--ln);font-size:14.5px;align-items:baseline}.wrow:first-of-type{border-top:0}
.wrow i{font-style:normal;color:var(--mut)}.wrow.t3{grid-template-columns:1fr auto auto}
.tw{overflow-x:auto;border:1px solid var(--ln);background:var(--bx)}
.tb{width:100%;border-collapse:collapse;font-size:14.5px}.tb th,.tb td{padding:7px 12px;text-align:left;border-top:1px solid var(--ln);white-space:nowrap}
.tb thead th{border-top:0;border-bottom:2px solid var(--acc);font:700 10.5px Georgia;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.side .tb th,.side .tb td{padding:5px 8px;font-size:13.5px}.wxt td{white-space:normal;vertical-align:top;min-width:120px}.wxt small{color:var(--mut)}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.res li{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--bx);border:1px solid var(--ln);padding:10px 14px}
.res li span:last-child{text-align:right}.res b{font:700 22px Georgia}
.art{max-width:min(780px,calc(100% - 28px));margin:22px auto 0;padding:22px 28px 28px;background:var(--bx);border:1px solid var(--ln);border-top:4px double var(--a,var(--acc))}
.art h1{font:700 clamp(26px,4vw,40px)/1.15 Georgia,serif;margin:.3em 0 .3em}.art p{font-size:17px;color:var(--ink2);margin:.7em 0}
.art .meta{font:12px Verdana,sans-serif;color:var(--mut);margin-bottom:20px;letter-spacing:.03em}.art .g3{margin-top:6px}.art .sc p{font-size:14px}
.art blockquote{margin:22px 0;padding:4px 0 4px 18px;border-left:3px solid var(--a,var(--acc));font:italic 20px/1.45 Georgia,serif;color:var(--ink)}
.bgbox{margin:22px 0;padding:14px 18px;border:1px solid var(--ln);background:var(--bx2)}.bgbox h4{margin:0 0 6px;font:700 11px Georgia;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}.bgbox p{margin:0;font-size:15.5px}
.art p b{color:var(--ink)}
.apg{max-width:1120px;margin:0 auto;padding-inline:14px}
.wrap.grid2,.wrap.sec2{max-width:1120px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}.side{position:static}.g3{grid-template-columns:1fr}.res{grid-template-columns:1fr}.date{display:none}}
@media (max-width:640px){.g2{grid-template-columns:1fr}.lead{padding:16px}.hd2,.art{padding:16px}.mast .nm small,.seal{display:none}nav.main a{padding-right:0;margin-right:14px}}
/* footer */
footer{margin-top:30px;border-top:6px double var(--acc);background:var(--bx);color:var(--mut);font-size:12.5px;padding:20px 0 28px}
footer .top2{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer .vl{width:72px}footer .addr{margin-top:8px}
footer .links{display:flex;gap:6px 16px;flex-wrap:wrap;max-width:560px;justify-content:flex-end}
footer .links a{font:700 12px Georgia;color:var(--ink2);border-bottom:1px dotted var(--ln)}
footer .legal{margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
.rv{opacity:1}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

function xm(s){var h=1779033703^s.length;for(var i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0}

function RNG(seed){var f=mb(xm(String(seed)));return{f:f,i:function(a,b){return a+Math.floor(f()*(b-a+1))},p:function(x){return x[Math.floor(f()*x.length)]},sh:function(x){var a=x.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(f()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}}}
function dkey(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function fromKey(k){return new Date(Math.floor(k/10000),Math.floor(k/100)%100-1,k%100,12,0)}
function addDays(d,n){var e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12,0);return e}

function p2(n){return (n<10?'0':'')+n}
function expand(str,rng,memo,POOL){
  var out=str,guard=0;
  while(out.indexOf('{')>-1&&guard++<4){
    out=out.replace(/\{([a-z]+)(\d*)(?:\.([a-zA-Z]+))?(?::([^}]+))?\}/g,function(m,name,idx,field,arg){
      var key=name+idx;
      if(!(key in memo)){
        if(arg){if(arg.indexOf('|')>-1){memo[key]=rng.p(arg.split('|'))}else{var mm=arg.split('-'),a=parseFloat(mm[0]),b=parseFloat(mm[1]);memo[key]=arg.indexOf('.')>-1?(a+rng.f()*(b-a)).toFixed(1):String(rng.i(a,b))}}

      }
      var v=memo[key];
      if(typeof v==='object')return field?v[field]:v.name;
      return v;
    });
  }
  return out;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

 {k:'Federal Assembly',h:'House passes the {bill} by {yes:165-215} votes to {no:45-85}',p:['The House of Representatives passed the {bill} this afternoon, sending it to the Senate. Representatives from the governing coalition were joined by a handful of sectoral members; the United Conservatives voted against, saying the costs had been understated.','Speaker Lorraine Dominguez closed the division. The Senate may amend the bill but, as with every bill that touches money, the House has the last word on appropriations.','Ministers say the Act would take effect at the start of the next fiscal year if it is signed within the President&rsquo;s fifteen days.'],pl:'Federal Assembly',w:3},
 {k:'Federal Assembly',h:'Senate sends the {bill} back to the House with {n:3-9} amendments',p:['The Senate voted {yes:27-33} to {no:14-19} to pass the {bill} with amendments, most of them tabled by senators from the Eastern States who asked for the funds to be spread more evenly.','The bill now returns to the House. The government said it expected to accept the large majority of the changes.'],pl:'Federal Assembly',w:2},
 {k:'Prime Minister',h:'Prime Minister de Lune faces fortnightly questions on {topic}',p:['Prime Minister Astrid de Lune answered questions in the House for just over an hour, most of them from the Opposition benches on {topic}. She said the Cabinet had &ldquo;no wish to hide the sums&rdquo; and promised a written statement within the week.','Leader of the Opposition Ruy Duca replied that the answers were &ldquo;sincere but late&rdquo;. The exchange was courteous by the House&rsquo;s standards.'],pl:'Federal Assembly',w:2},
 {k:'Opposition',h:'United Conservatives press for a ceiling on {fedmin} spending',p:['Ruy Duca, leader of the United Conservatives, called on the government to set a ceiling for the {fedmin} budget before the draft budget reaches the House, arguing that {pct:3-9}% growth a year &ldquo;cannot be promised forever&rdquo;.','The government replied that the Control Commission already audits the department and that the draft budget will be published in full, ninety days before the fiscal year, as the Constitution requires.'],pl:'Federal Assembly',w:1},
 {k:'The States',h:'Senator {sen} asks the Assembly for {ask} in {sen.st}',p:['Senator {sen} ({sen.par}) told the Senate that {sen.st} had waited long enough for {ask}. &ldquo;Every State sends two senators,&rdquo; the senator said, &ldquo;so that the small and the far are heard in the same room as the large.&rdquo;','The request was referred to the committee that handles regional estimates. The Minister for {fedmin} said the department would study it and report in the next session.'],pl:'{sen.st}',w:3},
 {k:'Audit',h:'Control Commission reports on {fedmin} spending in {state}',p:['The Control Commission published its audit of {fedmin} spending in {state}, covering the last two fiscal years. It found no misconduct, but asked the department to keep clearer ledgers and to explain {n:2-7} unexplained transfers.','The Commission&rsquo;s five commissioners serve eight-year terms and answer to no elected officeholder. Its reports are sent to the House and published the same day.'],pl:'Control Commission',w:2},
 {k:'Civil Service',h:'Examination results published for {exam}; {pct:3-12}% more candidates than last year',p:['The Civil Service Commission published the results of this year&rsquo;s examination for {exam}. More candidates sat the paper than last year, and the Commission said the pass rate was steady.','Appointments to the federal service are made from the published list. Candidates have thirty days to lodge an appeal.'],pl:'Civil Service Commission',w:2},
 {k:'Courts',h:'Constitutional Court sets a hearing for a petition against the {bill}',p:['The Constitutional Court said it will hear a petition against the {bill} next month. The petition was brought by one third of the Senate, which the Constitution allows, on the ground that the bill gives too much discretion to the Minister.','The seven judges serve non-renewable twelve-year terms. A law the Court strikes down is void from the date of the ruling.'],pl:'Constitutional Court',w:1},
 {k:'Elections',h:'Electoral Commission opens the register drive for the 168 AAX House election',p:['The Federal Electoral Commission has opened its register drive ahead of the House election in 168 AAX. Mobile registration desks will visit {state}, {state2} and {state3} first.','The Commission also runs the sectoral lists, from which twenty percent of the House is elected, and said it would publish the list rules for labour, women, youth, Eulons and omegas well ahead of the vote.'],pl:'Federal Electoral Commission',w:1},
 {k:'Recovery',h:'Lancian Recovery Act: a {lanc} reopens in {lancp}',p:['A {lanc} rebuilt under the Lancian Recovery Act reopened in {lancp} today. Local officials said the work had finished {n:2-6} weeks behind plan, mostly because of a late delivery of timber.','The Act&rsquo;s reconstruction fund is audited by the Control Commission each year. The Opposition has asked for a firmer ceiling; the government says the work is on budget.'],pl:'Lancia',w:3},
 {k:'The East',h:'Governors of the Eastern States meet in {east}',p:['Governors from the ten Eastern States met in {east} for a working session on the Ostmarchia Autonomous Region&rsquo;s budget and on road links between the highland and coastal states. The meeting ended without a communique, which participants called &ldquo;a good sign&rdquo;.','The Eastern Alliance sits in the governing coalition and holds about five percent of the House.'],pl:'{east}',w:2},
 {k:'The States',h:'{state} legislature passes a {fedmin} measure with cross-party support',p:['The legislature of {state} passed a measure on {fedmin} yesterday with votes from both the governing and opposition benches. States keep their own constitutions, courts and governments, and the measure needs no federal approval.','Officials in {state} said they would share their draft with neighbouring states, several of which face the same problem.'],pl:'{state}',w:2},
 {k:'Protected Territory',h:'Rangers report {n:2-9} thousand visitors to Mt. Xarpeius over the weekend',p:['Rangers in the Mt. Xarpeius Protected Federal Territory counted about {n} thousand visitors over the weekend, many of them walking up to the peak or through the Cassius Flower Forest at its base.','The territory is a permanent heritage reserve east of Erimos. It cannot be privatised, given to any state or opened to extractive industry, and no emergency power can suspend its protections.'],pl:'Mt. Xarpeius',w:2},
 {k:'Media',h:'Federal Media Authority publishes its quarterly complaints report',p:['The Federal Media Authority published its quarterly report on complaints about broadcasters. It received {n:60-180} complaints, upheld {n2:6-20}, and ordered corrections on air in each case.','The Authority is an independent regulator set up by law. It does not see running orders before broadcast.'],pl:'Federal Media Authority',w:1},
 {k:'Water',h:'Water levels in {dry} reservoirs {up:rise|fall}',p:['The Ministry of Environment says reservoirs in {dry} are within the seasonal range. Officials asked households to keep to the summer schedule for garden watering.','The Desert Corridor states share a river system, and the Assembly is expected to debate the Water Rights (Desert Corridor) Bill later this session.'],pl:'{dry}',w:1},
 {k:'Police',h:'Federal Police Service joins {state} officers in a border-road exercise',p:['The Federal Police Service held a joint exercise with state police in {state}, practising how a state force hands a case to the federal service when it crosses a state line.','States run policing under federal minimum standards; the Service handles federal offences only.'],pl:'{state}',w:1}
];

 {k:'Commonwealth Congress',h:'Congress passes the {cbill} with {yes:190-250} votes in the House',p:['The Commonwealth House passed the {cbill} with {yes} votes. The measure, which touches the two entities&rsquo; shared institutions, now goes to the Senate, where fifty senators from each entity sit.','Majority Floor Leader Maricel Dimaculangan said the measure was &ldquo;a small joint thing, done properly&rdquo;. The Commonwealth may legislate on internal matters of the entities only with the consent of both.'],pl:'The Dome, Latreionople',w:3},
 {k:'Commonwealth',h:'Commonwealth Central Bank holds the Latrum rate at {rate:1.5-4.5}%',p:['The Commonwealth Central Bank left its main rate unchanged at {rate}% after its monthly meeting in Latreionople. The Bank said prices were broadly steady and that the Latrum remained sound.','The Bank has its seat in Latreionople with a branch in Solaria, and is independent of both entities&rsquo; governments.'],pl:'Latreionople',w:2},
 {k:'Prime Minister',h:'Commonwealth Prime Minister Granitseyevich meets the Council of Ministers on {topic}',p:['Prime Minister David Granitseyevich IV chaired the Council of Ministers, five Latrevian and four Solarian, at the Dome. The ministers agreed the order of work for the coming Congress session and discussed {topic}.','A spokesperson said no decisions needing a vote had been taken and the minutes would be published.'],pl:'The Dome, Latreionople',w:2},
 {k:'Defence',h:'Commonwealth Defence Force holds a coastal exercise in the {sea}',p:['The Commonwealth Defence Force carried out a short exercise in the {sea} with ships from both entities. The Force said the aim was to test joint signals and harbour handling rather than to practise any scenario.','The Council of Defence was briefed afterwards. Mutual defence treaties and any declaration of war need two thirds of both chambers.'],pl:'{sea}',w:1},
 {k:'The Sea Lane',h:'Ferries between Latrei and Solaria run to schedule despite {wx:wind|fog|swell}',p:['The ferry service between the capital and the Crown of Solaria&rsquo;s islands kept to its schedule, with crossings through the Niklas Strait and the Straits of Alexagrad slowed by {wx}. The longest passage runs through the Sea of Cassiopeia to reach {solis}.','Free movement between the two entities is one of the Commonwealth&rsquo;s founding guarantees. Customs officers say the checks on cargo, not on travellers, take the time.'],pl:'Sea Lane',w:2},
 {k:'Solaria',h:'Solarian Parliament debates {topic} as the Union Royale asks for delay',p:['In the Solarian Parliament, the royalist Union Royale asked for a delay to a bill on {topic}, while the Travaillistes said the islands had waited long enough. The vote is expected next week.','Solaria is a constitutional monarchy within the Commonwealth. Queen Zarpaii is also President of the Commonwealth, under the personal exception in Article 31 of the Charter.'],pl:'Solaria',w:2},
 {k:'Solaria',h:'Work continues on plans for the Cité-couronne de Solarie',p:['Planners in Solaria said they had finished a new survey of the site chosen for the Cité-couronne, the royal capital that has been marked on the maps but not yet built. A public exhibition of the plans opens this week in {solis}.','No date has been set for the first stone. The Crown said the city would be &ldquo;built slowly, and paid for in daylight&rdquo;.'],pl:'Solaria',w:1},
 {k:'The Dome',h:'Grand Library of the Commonwealth opens an exhibition of {exh:maps|letters|instruments}',p:['The Grand Library at the Dome opened an exhibition of {exh} from the Exile and Reconquest, drawn from its Latrevian holdings and from the archive kept in Solaria. Admission is free.','The Library is a common institution of the Commonwealth, with a Solarian archive. Curators said several items had not been displayed since before the Imperial Republic.'],pl:'The Dome, Latreionople',w:2},
 {k:'Courts',h:'Commonwealth High Court sits on circuit in Solaria',p:['The Commonwealth High Court opened a circuit sitting in Solaria this week, hearing {n:4-12} cases that arose under the Charter. The Court has its seat at the Hall of Justice in Latreionople.','Court officials said the circuit gives islanders access to the Commonwealth&rsquo;s courts without a long sea voyage.'],pl:'Solaria',w:1},
 {k:'Congress',h:'Senate committee questions the Audit Commission on the Dome&rsquo;s upkeep',p:['A joint committee questioned the Commonwealth Audit Commission over the cost of keeping up the Dome, the Arch and the Eternal Flame. The Commission said upkeep cost had risen by {pct:2-8}% and gave a breakdown.','The Dome is the seat of both the Commonwealth Congress and the Federal Assembly.'],pl:'The Dome, Latreionople',w:1}
];

 {k:'Luisara',h:'Dongmyeong Region debates a change to its Special Statute',p:['Councillors in the Dongmyeong Region, on Luisara&rsquo;s southwestern peninsula, debated a small change to the Special Statute that governs the region. No vote was taken.','The peninsula, also called Jungrad, is Luisaran territory and sits outside any Commonwealth state. The Latrevian embassy there said it was following the debate.'],pl:'Dongmyeong',w:1},
 {k:'The Border',h:'Latrevian and Luisaran officers meet at the Bahsin&ndash;Aronia line',p:['Border officers from Latrevia and Luisara met at the line south of Bahsin and Aronia for their regular talks on crossings and livestock. The meeting lasted most of the morning and ended in agreement on seasonal grazing permits.','Four Latrevian states, Lancia, Bahsin, Aronia and Bambu, share a land border with Luisara.'],pl:'Bahsin',w:2},
 {k:'The Tripoint',h:'Grenzgebiet reports a quiet week at the tripoint',p:['Officials in Grenzgebiet said the weekly report from the tripoint where three powers meet was uneventful. A repair crew replaced two border posts that had weathered.','The tripoint sits at the western edge of Grenzgebiet, facing Bambu across the line.'],pl:'Grenzgebiet',w:1}

CP.BG['fed:Federal Assembly']='The Federal Assembly has two chambers of equal standing. The House of Representatives has 300 members elected by proportional representation; the Senate has 52 senators, two from each of the 26 States. No bill becomes law without both, and the President has fifteen days to sign it or return it with objections.';
CP.BG['fed:Prime Minister']='The Prime Minister is appointed by the President from the leader of the majority coalition in the House, and can be removed only by a constructive vote of no confidence that names a successor. She answers questions in the House at least once a fortnight.';
CP.BG['fed:Opposition']='The United Conservatives are the largest party outside the governing coalition, with about 17 percent of the House. The coalition of the Centre Democratic Party, the Social Progressive Party, the Labour and Land Party and the Eastern Alliance holds roughly 55 percent.';
CP.BG['fed:The States']='The 26 States keep their own constitutions, governments and courts. They run local government, schools, primary and secondary health care, policing under federal minimum standards, and land use. Each sends two senators to the Federal Assembly, whatever its size.';
CP.BG['fed:Audit']='The Control Commission has five commissioners, who serve eight-year terms and answer to no elected officeholder. It audits public spending, may investigate any federal official, and can start impeachment proceedings before the House.';
CP.BG['fed:Civil Service']='The Civil Service Commission has seven commissioners on staggered ten-year terms. It runs the public examinations, publishes the results, appoints federal judges on merit and enforces the affirmative action programmes.';
CP.BG['fed:Courts']='The Constitutional Court has seven judges on non-renewable twelve-year terms. It can void a law on a petition from one third of either chamber, and a law it strikes down is void from the date of the ruling.';
CP.BG['fed:Elections']='The House is elected every four years, all seats at once, by proportional representation from State lists, with at least three seats for every State. Twenty percent of seats are sectoral, elected by party list; the Federal Electoral Commission runs those votes.';
CP.BG['fed:Recovery']='The Lancian Recovery Act set up a reconstruction fund for Lancia, once an independent kingdom and now an ordinary State of the Federation. Its spending is audited each year by the Control Commission.';
CP.BG['fed:The East']='Ten Eastern States send twenty of the Senate&rsquo;s 52 seats between them, and the Eastern Alliance sits in the governing coalition. The Ostmarchia Autonomous Region is part of the Federal Republic under Article 27-A of the Constitution.';
CP.BG['fed:Protected Territory']='The Mt. Xarpeius Protected Federal Territory lies east of Erimos around the 113-metre peak and the Cassius Flower Forest. It is a permanent heritage reserve open to all citizens and cannot be privatised, given to any State or opened to extractive industry.';
CP.BG['fed:Media']='The Federal Media Authority is the independent media regulator set up by law. It hears complaints, may order corrections on air, and does not see running orders before broadcast.';
CP.BG['fed:Water']='Six States run along the desert corridor from the savanna of New Solaris to the grassland of Aronia, and several of them draw on the same river system, including the Duaterre River.';
CP.BG['fed:Police']='The Federal Police Service handles federal offences only. Ordinary policing is a State matter, carried out under federal minimum standards.';
CP.BG['fed:_']='Latrevia is the Federal Republic of the Third Republic, adopted at the Dome of the Commonwealth on 1 Ixarius 162 AAX. It is governed by an executive, a legislature, the courts and two independent commissions.';
CP.BG['comm:Commonwealth Congress']='The Commonwealth Congress has a Senate of 100 members, 50 from each entity, and a House of 300 representatives elected from the whole Commonwealth. Both meet at the Dome in Latreionople and both must pass a bill.';
CP.BG['comm:Commonwealth']='The Commonwealth Central Bank has its seat in Latreionople with a branch in Solaria. The Latrum is the common currency of both entities, and monetary policy is one of the powers delegated to the Commonwealth.';
CP.BG['comm:Prime Minister']='The Commonwealth Prime Minister and the Council of Ministers, five Latrevian and four Solarian, govern day to day from the Dome. The President of the Commonwealth is whoever is President of Latrevia.';
CP.BG['comm:Defence']='The Commonwealth Defence Force is a joint force of both entities. Two thirds of both chambers are required to declare war or to ratify mutual defence treaties.';
CP.BG['comm:The Sea Lane']='A ship leaving Latrei sails through the Sea of Kosmos, the Niklas Strait, the Straits of Alexagrad and the Sea of Lancia before crossing the Sea of Cassiopeia to the Sea of Solaria. Free movement between the entities is a founding guarantee.';
CP.BG['comm:Solaria']='Solaria is a constitutional monarchy and one of the two equal entities of the Commonwealth. Its parliament sits in its own right, and its language is French. Queen Zarpaii holds the Solarian crown by a personal exception that the Charter allows for her alone.';
CP.BG['comm:The Dome']='The Dome of the Commonwealth in Latreionople houses the Congress, the Federal Assembly and the Grand Library. The Arch and the Eternal Flame stand at the district&rsquo;s southern edge.';
CP.BG['comm:Courts']='The Commonwealth High Court sits at the Hall of Justice in Latreionople, with circuit sittings in Solaria. The Commonwealth Constitutional Court has a branch chamber on the islands.';
CP.BG['comm:_']='The Commonwealth of Latrevia and Solaria is a single sovereign state of two equal entities, under the Charter of 162 AAX. It handles defence, foreign affairs, the Latrum, citizenship and free movement; everything else stays with the entities.';
CP.BG['nbr:Nicolatia']='Nicolatia holds the northern forests and the Northern Massif, from Port Aleksandr on the north coast to Nikolatsk in the south-west. Its settlements keep to a Slavic naming tradition, and four Commonwealth states touch its forest border.';
CP.BG['nbr:Luisara']='Luisara is a unitary republic with devolved regions, founded in 169 PAX, and stands outside the Commonwealth. It holds the south, including the Mt. Miguel range, the inland sea of Mar del Sud and the Dongmyeong Region on its south-western peninsula.';
CP.BG['nbr:The Border']='Four Latrevian States, Lancia, Bahsin, Aronia and Bambu, share a land border with Luisara. Officers on both sides meet regularly to settle crossings, grazing and customs.';
CP.BG['nbr:The Tripoint']='The tripoint sits at the western edge of Grenzgebiet, facing Bambu across the line. It is where Latrevian, Ostmarchian and Luisaran territory meet.';
CP.BG['nbr:_']='Latrevia has two neighbours on its own continent: Nicolatia to the north and Luisara to the south, with the Commonwealth&rsquo;s Solaria across the sea to the west.';
CP.BG['reg:_']='Regnum is a separate world, reached from Kosmos by portal. The portal station is the Federation&rsquo;s main crossing. Bulk cargo goes by end-ship, which can make the crossing slowly when a window opens.';
CP.BG['spt:Kosmos Cup']='The Kosmos Cup is the Commonwealth&rsquo;s top football league. Twelve clubs from Latrevia and Solaria play each other twice over 22 rounds, with one matchday each Erday from March.';
CP.BG['spt:_']='Sport in the Commonwealth is run by the clubs and associations of each entity, with Commonwealth championships in the major sports.';

var AX={};
AX.sen={d:'fed',pr:.11,span:7,cast:function(sk){var r=RNG('sarc'+sk),s=r.p(SENS);return{sen:s,state:s.st,n:String(r.i(11,38)),n2:String(r.i(3,9)),fedmin:r.p(POOL.fedmin)}},
 ph:[
 {k:'Ethics',h:'Travel claims of Senator {sen} referred to the Control Commission',p:['VNC has learned that the Senate secretariat has referred travel claims by Senator {sen} ({sen.par}) of {sen.st} to the Control Commission for review. The claims cover {n} journeys over two years, and include several hotel stays in the capital that Senate records show as overlapping with sittings in {sen.st}.','The secretariat said such referrals are routine when its own auditors query a claim. It declined to say who raised the query or how many other senators&rsquo; claims had been reviewed.','Senators are paid a salary and may claim the cost of travel between their State and the Dome, against receipts. The Control Commission may investigate any federal official.','Senator {sen}&rsquo;s office said the senator would comment once the file had been reviewed.']},
 {k:'Ethics',h:'Senator {sen} denies wrongdoing over travel claims',p:['Senator {sen} said today that every claim had been made &ldquo;in good faith and on the advice of the secretariat&rdquo;, and that any overlap was explained by the senator&rsquo;s duties in {sen.st}.','&ldquo;I travel a great deal because my State is far from the Dome,&rdquo; the senator said. &ldquo;If I have made an error, I will correct it, and I will not hide behind a lawyer to do so.&rdquo;','The senator&rsquo;s party said it had &ldquo;full confidence&rdquo; in its member but would await the Commission&rsquo;s findings. The Opposition said the explanation was &ldquo;a start, not an answer&rdquo;.','The Senate secretariat has agreed to give the Commission the full set of receipts.']},
 {k:'Ethics',h:'Control Commission opens a formal inquiry into Senator {sen}&rsquo;s claims',p:['The Control Commission announced it had opened a formal inquiry into the travel claims of Senator {sen}. The five commissioners voted unanimously, a spokesperson said, and the inquiry would cover the last two financial years.','The Commission can ask for documents, interview officials and recommend that the House begin impeachment proceedings, though it said it saw no reason to consider that step at this stage.','&ldquo;An inquiry is not a verdict,&rdquo; the spokesperson said. &ldquo;It is the ordinary way of finding out.&rdquo;','The senator welcomed the inquiry and promised full co-operation.']},
 {k:'Ethics',h:'{sen.par} asks Senator {sen} to step back from committee work during inquiry',p:['Leaders of the senator&rsquo;s own party group asked Senator {sen} to step back from committee duties while the Control Commission&rsquo;s inquiry continues. The senator agreed.','Ruy Duca, leader of the United Conservatives, said it was &ldquo;the right thing to do and the late thing to do&rdquo;, and asked the Senate&rsquo;s presiding officer to publish the rules on claims in full.','Colleagues from {sen.st} said the State&rsquo;s business in the Senate would be taken up by the other senator, who is not under inquiry.','The Senate has two senators from each State, so {sen.st} will not lose a voice in the chamber.']},
 {k:'Ethics',h:'Senate secretariat tightens rules on travel claims',p:['The Senate secretariat announced new rules requiring receipts for every claim to be lodged within thirty days, and a monthly summary to be published. The change was agreed before the Control Commission&rsquo;s inquiry reached any finding, officials said.','The secretariat said the new rules were &ldquo;overdue&rdquo; and applied to all 52 senators equally.','Several senators said they welcomed the change. One, speaking privately, said some colleagues had &ldquo;never been asked for a receipt in their lives&rdquo;.','The Commission&rsquo;s inquiry continues.']},
 {k:'Ethics',h:'Control Commission: no misconduct by Senator {sen}, but {n2} thousand latrum to be repaid',p:['The Control Commission reported that it had found no misconduct by Senator {sen}, but that claims worth {n2} thousand latrum were not supported by receipts and should be repaid.','The Commission praised the senator&rsquo;s co-operation and said the errors were &ldquo;clerical and cumulative, not corrupt&rdquo;. It recommended that the Senate adopt its new claims rules in law.','Senator {sen} said the senator would repay the sum in full this week and thanked the Commission &ldquo;for doing its job without fear of anyone, including me&rdquo;.','The Opposition said the case showed why independent audit mattered; the senator&rsquo;s party said it showed the system worked.']},
 {k:'Ethics',h:'Senator {sen} returns to committee after repaying claims',p:['Senator {sen} returned to committee duties today after the Control Commission&rsquo;s report. The Senate formally noted the report without a vote.','The senator told colleagues the episode had been &ldquo;an education in the difference between a receipt and a memory&rdquo;. There was some laughter in the chamber.','The new claims rules take effect next month. The Control Commission said it would report on how they were working in a year.','This closes the matter, according to the Senate secretariat.']}
 ]};
AX.memo={d:'fed',pr:.09,span:6,cast:function(sk){var r=RNG('marc'+sk);return{fedmin:r.p(POOL.fedmin),n:String(r.i(14,60)),state:r.p(STATES)}},
 ph:[
 {k:'Leak',h:'Leaked memo from the Ministry of {fedmin} says a programme will miss its targets',p:['A memo from the Ministry of {fedmin}, passed to VNC and the Opposition, says an internal review expects a flagship programme to miss its targets by {n} percent this year. The memo is dated three weeks ago and addressed to the Minister.','It names delays in {state} and a shortage of trained staff as the main causes, and proposes announcing a revised timetable &ldquo;at a moment of the Minister&rsquo;s choosing&rdquo;.','The Ministry said it would not comment on documents it had not authenticated.','Government sources said the memo was a working paper and did not reflect settled policy.']},
 {k:'Leak',h:'Ministry of {fedmin} says memo is genuine but &ldquo;out of context&rdquo;',p:['The Ministry of {fedmin} confirmed today that the leaked memo is genuine, but said it was one of several scenarios and that the headline figure was the worst of them.','&ldquo;We write down bad cases so that we can avoid them,&rdquo; a Ministry spokesperson said. &ldquo;That is a sign of seriousness, not of failure.&rdquo;','The Opposition said the explanation raised more questions than it answered, and asked why the revised timetable had not been published when the memo was written.','The Ministry said it had asked its legal officers to look into how the document left the building.']},
 {k:'The Cabinet',h:'Prime Minister de Lune asks for a full account from the Ministry of {fedmin}',p:['Prime Minister Astrid de Lune said she had asked the Minister for {fedmin} for a full written account of the programme&rsquo;s position and of the circumstances of the leak, to be delivered within the week.','&ldquo;The public is entitled to know how its money is being spent, and the Cabinet is entitled to hear bad news before the newspapers do,&rdquo; she told the House during questions.','Ruy Duca, leader of the Opposition, said the Prime Minister&rsquo;s response was &ldquo;correct, and a few days overdue&rdquo;.','The Minister is expected to appear before a committee next week.']},
 {k:'The Cabinet',h:'Minister for {fedmin} publishes revised timetable for programme',p:['The Minister for {fedmin} published a revised timetable for the programme, extending the final date by {n} weeks and adding a monthly progress report that will be sent to the House.','The Minister said she accepted that the first timetable had been &ldquo;too ambitious and too quietly corrected&rdquo;, and that the department had hired more trainers for {state}.','The Opposition welcomed the report but asked for the original memo to be published in full. The Ministry said it would consider the request.','The Control Commission said it would include the programme in its next review.']},
 {k:'Audit',h:'Control Commission to review procurement at the Ministry of {fedmin}',p:['The Control Commission announced that it would review how the Ministry of {fedmin} buys equipment and services for the programme, following the leaked memo.','A spokesperson said the Commission was acting on its own initiative and that nothing in the memo suggested wrongdoing; it was an ordinary review of an expensive programme.','The Ministry said it would give the Commission full access to its records.','The Commission&rsquo;s reports are published and are sent to the House.']},
 {k:'Leak',h:'Ministry of {fedmin} brings in new rules after the memo affair',p:['The Ministry of {fedmin} issued new guidance on how internal reviews are written, circulated and marked, saying that its staff should &ldquo;write the truth, and write it carefully&rdquo;.','Unions representing federal workers said they welcomed the guidance but would object to any action against the person who leaked the memo.','The Opposition said the leak had been &ldquo;the most useful event in the Ministry&rsquo;s year&rdquo;.','The affair is expected to come up again when the Control Commission reports.']}
 ]};
AX.bill={d:'fed',pr:.12,span:7,cast:function(sk){var r=RNG('barc'+sk);return{bill:r.p(POOL.bill),fedmin:r.p(POOL.fedmin),yes:String(r.i(165,215)),no:String(r.i(45,85)),sy:String(r.i(27,33)),sn:String(r.i(14,19))}},
 ph:[
 {k:'Federal Assembly',h:'Government introduces the {bill} in the House',p:['The Minister for {fedmin} introduced the {bill} in the House of Representatives today, saying it would &ldquo;do a modest thing well&rdquo;. The Cabinet is sponsoring the bill, which must pass both chambers.','The bill sets out new national standards, a funding formula for the States and a duty on the Ministry to report each year to the House.','The Opposition said it would study the text and would not oppose the principle. Several members of the Eastern Alliance said the formula treated their States unfairly.','A first debate is expected within days.']},
 {k:'Federal Assembly',h:'Committee begins hearings on the {bill}',p:['A House committee began public hearings on the {bill}, hearing from officials, State representatives and the groups the bill would affect.','Witnesses from several States said the bill would help, but asked for more time to put it into effect. A senior official said the Ministry was &ldquo;open to a longer transition for smaller States&rdquo;.','Hearings, which are filmed by VNC, will continue through the week.','The committee has asked the Ministry for a note on cost.']},
 {k:'Federal Assembly',h:'Committee recommends changes to the {bill}',p:['The House committee recommended a number of changes to the {bill}, including a longer transition for smaller States and a clause requiring the Ministry to publish its costings.','The government said it would accept most of the changes. The Opposition said it would vote for the bill if the costing clause remained.','The committee&rsquo;s report is now with the House. A vote is expected shortly.','No amendment was made to the bill&rsquo;s main purpose.']},
 {k:'Federal Assembly',h:'House passes the {bill} by {yes} votes to {no}',p:['The House of Representatives passed the {bill} this afternoon by {yes} votes to {no}. Representatives from the governing coalition voted for it, joined by most of the United Conservatives after the costing clause was kept.','Speaker Lorraine Dominguez closed the division. The bill now goes to the Senate.','The Minister for {fedmin} thanked members and said the Ministry would begin preparing for the new standards at once.','Some Eastern Alliance members voted against, saying the formula still favoured the larger States.']},
 {k:'Federal Assembly',h:'Senate takes up the {bill}; Eastern senators ask for changes',p:['The Senate began its debate on the {bill} today. Senators from the Eastern States asked for a change to the funding formula, saying it counted people rather than distances.','The Senate may amend a bill but cannot start a budget bill, and an amended bill must return to the House.','The government said it was ready to accept a limited change. A vote is expected tomorrow or the day after.','Senators of every party said the debate had been &ldquo;unusually good&rdquo;.']},
 {k:'Federal Assembly',h:'Senate passes the {bill} by {sy} votes to {sn}',p:['The Senate passed the {bill} by {sy} votes to {sn}, with a change to the funding formula that adds a small allowance for States with long roads.','The House is expected to accept the change without a debate, since the government has said it agrees with it.','Senators from the Eastern States called the outcome &ldquo;fair, and a long time coming&rdquo;.','The bill goes to the President for signature.']},
 {k:'The Presidency',h:'President signs the {bill} into law',p:['President Zarpaii Xarpeius signed the {bill} into law this morning at the Executive Palace, the day after the House accepted the Senate&rsquo;s change.','The President has fifteen days to sign or return a bill; the Palace said she had read it twice. A short ceremony was attended by the Minister for {fedmin} and members of both chambers.','The Act takes effect at the start of the next fiscal year. The Ministry will publish a guide within a month.','The Constitutional Court can still review the law on a petition from one third of either chamber.']}
 ]};

var DLN=[
 {key:20261026,desk:'fed',t:1185,w:46,k:'Public affairs',h:'Mayor of Prado faces questions after a televised claim by Odile Dellarosa',pl:'Prado',
  p:['The Mayor of Prado, Joaquín Ferreira, is facing questions after the broadcaster and actor Odile Dellarosa told the VNC Evening Bulletin, live at 19:00, that he had harmed her during their relationship and had threatened to make the matter public during a quarrel.','Ms Dellarosa, who hosts The Long Table on VBN 1 and Hearsay on V3, spoke to the bulletin&rsquo;s anchor, Livia Castellan, in the studio. &ldquo;I would rather say it myself than have it said for me,&rdquo; she said. The bulletin is carried live on VBN 1 every evening under VBN&rsquo;s agreement with the VNC Trust, so the interview was seen on both channels at once.','Mr Ferreira, a former star of VBN serials, was elected mayor of Prado in 164 AAX. His office said it had no immediate comment. No complaint has been made to the police.','The Federal Police Service said it would take a statement from anyone who wished to make one.']},
 {key:20261027,desk:'fed',t:1195,w:50,k:'Public affairs',h:'Mayor Ferreira denies the claims on LTV: &ldquo;I will answer anyone who gives me the time&rdquo;',pl:'Prado',
  p:['Mayor Joaquín Ferreira of Prado denied the claims made by Odile Dellarosa in an interview on LTV News at Seven this evening, saying he had never threatened her and that he would answer questions &ldquo;anywhere that gives me the time to answer them properly&rdquo;.','The interview was broadcast live on LTV News at Seven, which airs at the same hour as the VNC bulletin, on the channel owned by Meridian that returned to the air last month. The mayor did not take up an invitation to appear on VNC. His lawyer, Anselm Quillon, said a defamation claim was being prepared.','Ms Dellarosa&rsquo;s representatives said she stood by what she had said and would not respond to the mayor through the television.','Councillors in Prado asked the mayor to attend an emergency session of the council.']},
 {key:20261028,desk:'fed',t:640,w:44,k:'Media',h:'Media Authority receives 142 complaints about the Dellarosa interview',pl:'Federal Media Authority',
  p:['The Federal Media Authority said it had received 142 complaints about the live broadcast of the interview with Odile Dellarosa on the Evening Bulletin, most of them from viewers who said the claims were too personal to be shown on a news programme.','The VNC Trust said the decision to broadcast was an editorial one, taken in the public interest, because the claims concerned an elected official. It said that the mayor had been offered a right of reply and had chosen to give it elsewhere. VBN, which must carry the bulletin, said it had no say in what was broadcast.','The Authority said it would examine the complaints, and noted that it does not see running orders before broadcast.','Ruy Duca, leader of the United Conservatives, asked in the Assembly whether public money should be used to broadcast a private quarrel. The Prime Minister&rsquo;s office said the matter was for the Trust and the Authority.']},
 {key:20261028,desk:'fed',t:1190,w:42,k:'Public affairs',h:'Prado council meets in emergency session over the mayor',pl:'Prado',
  p:['The council of Prado met in emergency session this evening to discuss the allegations against Mayor Joaquín Ferreira. The mayor attended and told councillors he had nothing to hide and nothing to add.','Opposition councillors called for him to take leave while the matter was clarified. His supporters said no complaint had been lodged and no rule broken.','The council&rsquo;s clerk said any decision on the mayor&rsquo;s position was for the council and the State, and that no such motion had been tabled.','The session lasted three hours and ended without a vote.']},
 {key:20261029,desk:'fed',t:1000,w:46,k:'Public affairs',h:'Mayor Ferreira takes leave of absence pending inquiry',pl:'Prado',
  p:['Mayor Joaquín Ferreira of Prado announced that he was taking leave of absence &ldquo;to spare the town a distraction&rdquo;, the deputy mayor taking charge in his place.','He said he would continue to deny the claims. His lawyer, Anselm Quillon, said no date had yet been set for the defamation claim.','The council welcomed the step. Ms Dellarosa&rsquo;s representatives said she had no comment.','A State prosecutor said a file had been opened, but declined to say what it concerned.']},
 {key:20261030,desk:'fed',t:960,w:40,k:'Media',h:'VNC Trust stands by the Dellarosa broadcast, will publish its reasons',pl:'VNC Trust',
  p:['The VNC Trust said it stood by its decision to broadcast the interview with Odile Dellarosa and would publish a note on its editorial reasoning within the month.','The Trust said that the claims concerned an elected official, that the interview was given freely, and that the mayor had been offered a right of reply. It said it did not regret the decision.','The Federal Media Authority is still working through the complaints. VBN, which employs Ms Dellarosa, said the interview was a matter for VNC and that her programmes would continue.']},
 {key:20261102,desk:'fed',t:700,w:42,k:'Public affairs',h:'A week on: the Prado affair and what it changed',pl:'Prado',
  p:['A week after Odile Dellarosa spoke on the Evening Bulletin, the Prado affair has left the mayor on leave and the broadcasters arguing over how far a public service should go with a private matter.','The Federal Media Authority is working through 142 complaints. The VNC Trust has said it will publish a note on its reasoning. LTV, which carried the mayor&rsquo;s reply, said it stood by its coverage.','In Prado, opinion is divided. Many residents said they thought the mayor should return; others said he should resign.','The Control Commission has said it has no role, since the mayor is not a federal official. A State prosecutor said no charges were expected.']}
];

CP.PREV['fed:Federal Assembly']='The Assembly has sat on {n:34-61} days since the start of the session and sent {n2:6-14} bills to the President. Most were uncontested, and the governing coalition has not lost a division in the House this year.';
CP.PREV['fed:Prime Minister']='Fortnightly questions were one of the Third Republic&rsquo;s first reforms. They are held in the House on Winsdays, and in the last session the Prime Minister answered {n:18-40} questions from members of every party.';
CP.PREV['fed:Opposition']='The United Conservatives rebuilt themselves after the Imperial Republic and the civil war, and have grown steadily since the 164 AAX election. They have been careful to oppose particular measures rather than the government as a whole.';
CP.PREV['fed:The States']='Requests of this kind come before the Senate every few weeks, usually from a State that feels far from the Dome. Most are settled quietly in committee, and the Assembly funds a handful of them in each year&rsquo;s estimates.';
CP.PREV['fed:Audit']='The Commission has published {n:3-9} reports this year. Its reports have usually found small errors rather than serious wrongdoing, and the departments concerned have generally accepted its recommendations.';
CP.PREV['fed:Civil Service']='Examination is the way into the federal service and into the bench. Candidates sit the same papers across the 26 States, and results are published with the names of those who pass, in order of rank.';
CP.PREV['fed:Courts']='The Court&rsquo;s first years have been spent settling how the Third Republic&rsquo;s Constitution is to be read. It has heard {n:4-11} cases since the start of the year, most of them on petitions from members of the Assembly.';
CP.PREV['fed:Elections']='The 164 AAX election was the first held under the Third Republic. Turnout was high and the new State lists were seated without serious dispute, which officials say they hope to repeat in 168 AAX.';
CP.PREV['fed:Recovery']='Lancia was the largest block of the desert corridor and was ruined by the war. Reconstruction has been steady rather than quick, and the fund is paid out in stages as each phase is certified.';
CP.PREV['fed:The East']='The Eastern States are numerous and individually small, and have long felt overlooked by the capital. The Eastern Alliance was formed to give them a voice in the coalition, and holds seats in the Cabinet.';
CP.PREV['fed:Protected Territory']='The territory is named for Mt. Xarpeius, which rises 113 metres above the sea, and for the Flower Forest at its foot. It has been open to the public since the Third Republic was proclaimed and admits visitors without charge.';
CP.PREV['fed:Media']='The Authority was set up under the Constitution to regulate broadcasting without directing it. It has ordered corrections on air in most of the cases it has upheld, and has never asked to see a script in advance.';
CP.PREV['fed:Water']='Desert and savanna States depend on the Duaterre River and on reservoirs fed by the rains in the east. The Ministry publishes the level of each reservoir on the first of the month.';
CP.PREV['fed:Police']='Policing was one of the powers the Constitution left with the States, but the Federal Police Service handles crimes that cross State lines. The two kinds of force train together twice a year.';
CP.PREV['fed:_']='The same subject came up in the House {when:last month|earlier this session|before the recess}, when members asked for more detail. Officials say the answers have since been put in writing.';
CP.PREV['comm:Commonwealth Congress']='The Congress is still young. It has passed {n:7-19} bills since it first sat at the Dome, and each has needed the consent of both entities where the Charter requires it.';
CP.PREV['comm:Commonwealth']='The Latrum became the common currency when the Charter took effect. The Central Bank meets monthly and publishes a short statement afterwards.';
CP.PREV['comm:Prime Minister']='Prime Minister Granitseyevich took office when the first Council of Ministers was formed. The Council has met every week since, and its minutes are published.';
CP.PREV['comm:Defence']='The Defence Force was created from the forces of both entities under Article 19 of the Charter. Its headquarters are classified, established by law, and its budget is set by the Congress.';
CP.PREV['comm:The Sea Lane']='The crossing is one of the oldest on the continent and was cut during the exile. It reopened with the Commonwealth, and ferries now sail daily in each direction in good weather.';
CP.PREV['comm:Solaria']='Solaria has been a kingdom since long before the Federation, and the Crown passed to Queen Zarpaii when her brother renounced the throne. It keeps its own constitution and its own parliament.';
CP.PREV['comm:The Dome']='The Dome was built to house the common institutions of the Commonwealth. It is open to visitors on most days, and the Eternal Flame in front of it has burned since the Charter was adopted.';
CP.PREV['comm:Courts']='The Commonwealth courts are new, and hear matters that arise under the Charter. They sit in Latreionople and, on circuit, in Solaria.';
CP.PREV['comm:_']='Commonwealth business is usually quiet and technical. Most of it concerns the Latrum, customs, citizenship papers and the sea lane between the two entities.';
CP.PREV['nbr:Nicolatia']='Nicolatia has a short summer and a long winter, and politics there tends to follow the weather. The Duma meets in sessions that are reported from each region in turn.';
CP.PREV['nbr:Luisara']='Luisara has devolved regions and a loose style of politics, in which regional leaders trade votes for projects in the open. It held part of Latrevia&rsquo;s coast from 1 AAX until the siege of 49 AAX.';
CP.PREV['nbr:The Border']='The line between Latrevia and Luisara runs south of the savanna and grassland states. Officers meet monthly, and most of what they discuss concerns cattle, customs and the condition of the roads.';
CP.PREV['nbr:The Tripoint']='The tripoint was surveyed after the reconquest and has been marked ever since. Weekly reports are routine and are usually brief.';
CP.PREV['nbr:_']='Relations between Latrevia and its neighbours are correct and rarely warm. Most of the news from across the border concerns trade, roads and the weather.';
CP.PREV['reg:_']='Crossings to Regnum have been regular since the portal station opened. Traders say the long delays are over, though the end-ship windows still set the rhythm of the bulk trade.';
CP.PREV['spt:Kosmos Cup']='Twelve clubs from Latrevia and Solaria play for the Cup each year. Crowds have grown since the Third Republic and several clubs have had to extend their stands.';
CP.PREV['spt:_']='The sport is popular in every State, and several of the events on the calendar draw crowds from across the Commonwealth.';

CP.NEXT['fed:Federal Assembly']=['The bill now goes to the other chamber, where a vote is expected {when:next week|within the fortnight|before the recess}.','If both chambers agree, the bill goes to the President, who has fifteen days to sign it or return it with objections.'];
CP.NEXT['fed:Audit']=['The Commission&rsquo;s reports are published within sixty days of the end of an inquiry, and the department has thirty days to reply to its recommendations.','The department said it would respond in writing and publish its reply on the same day as the report.'];
CP.NEXT['fed:Civil Service']=['Candidates have thirty days to lodge an appeal. Appointments will be made from the published list at the start of the next quarter.'];
CP.NEXT['fed:Courts']=['The Court will hear argument over {n:2-3} days and has said it will give its ruling in writing, with reasons, as soon as it can.'];
CP.NEXT['fed:Elections']=['The Commission will publish the full timetable for the 168 AAX election well before the register closes.'];
CP.NEXT['fed:Recovery']=['The next stage of the fund will be paid out when the work certified in this phase has been inspected.','The Control Commission audits the fund each year and will include this work in its next report.'];
CP.NEXT['fed:Prime Minister']=['The Prime Minister will be back before the House in a fortnight, as the Constitution requires.'];
CP.NEXT['fed:Media']=['The Authority will publish its next report in three months.'];
CP.NEXT['comm:Commonwealth']=['The Bank&rsquo;s next meeting is in a month, and its statement will be published the same afternoon.'];

T.reg=[
 {k:'Regnum',h:'Federation and Triumterra close {num:3-9} customs items at the portal station',p:['Negotiators at the portal station closed {num} items on the shared customs list this week, among them the weighing of bulk grain and the stamp used on salt. Both sides said the remaining items depend on the next end-ship window.','The talks follow the Treaty of 170 AAX, which opened visa-free travel and trade between the two worlds. Officials on both sides said they expect the list to be finished before the year ends.'],pl:'Portal station',w:2},
 {k:'Regnum',h:'Colline harbour reports a record month for ferry crossings to the Iles Theoi',p:['Harbour officers in Colline said ferry crossings to the Iles Theoi, the island group east of the port, were {pct:5-14}% higher than last month. Pilots credited a run of calm days.','The islands are a popular summer stop and a trading post for dried fish and salt.'],pl:'Colline',w:1},
 {k:'Regnum',h:'Portal station asks traders to lodge manifests for the end-ship window of {date}',p:['Officials at the portal station reminded traders that manifests for bulk cargo must be lodged before the window opens. Goods that cross by end-ship are slow to move and cannot be reloaded once the window closes.','The station said it would publish a notice if the window moved. Travellers on foot cross by portal and are not affected.'],pl:'Portal station',w:1},
 {k:'Regnum',h:'Triumterra holds a day of remembrance at the Golden Field',p:['Crowds gathered at the Golden Field Memorial outside Colline for the day of remembrance for those killed there in RR 0. Wreaths were laid at the Martyrs&rsquo; Monument, whose inscription reads &ldquo;The spark, the heart, the victory. Freedom is not free.&rdquo;','A delegation from the Latrevian embassy in Colline attended. Shops in the capital closed at noon.'],pl:'Colline',w:1},
 {k:'Regnum',h:'Colline traders ask for longer hours on market days at the portal station',p:['A group of Colline traders asked the station to stay open later on market days, saying carts were turned back at dusk with their goods unsold. Station officials said they would weigh it against the cost of extra staff.','The station is the Federation&rsquo;s main crossing to Regnum, and market days are its busiest.'],pl:'Portal station',w:1},
 {k:'Regnum',h:'Colline schools add {num:2-6} places for Latrevian exchange pupils',p:['Schools in Colline announced {num} more places for pupils from the Federation under the exchange scheme, to be taught partly in Kassan. The Grand Council&rsquo;s education office said applications from Latrevia had doubled since the visa-free treaty.','Pupils in the scheme live with host families for a term. Latrevian officials said the first returning pupils had reported &ldquo;mostly good food and a lot of vocabulary&rdquo;.'],pl:'Colline',w:1},
 {k:'Regnum',h:'People&rsquo;s Net adds {num:8-40} public terminals in Montagne libraries',p:['Montagne&rsquo;s libraries took delivery of {num} new public terminals for the People&rsquo;s Net, the network that links Triumterra&rsquo;s towns. The machines run RevoltOS and can be used without an account for the first hour.','Librarians said the terminals were already booked through the week. The network does not connect to the Federation&rsquo;s Datagraph.'],pl:'Montagne',w:1},
 {k:'Regnum',h:'Montagne quarry sends {num:200-900} tonnes of stone to the Colline harbour works',p:['Quarry crews in Montagne loaded {num} tonnes of cut stone onto barges bound for the Colline harbour works, where a new quay is under construction. Harbour engineers said the work was on schedule.','The quarry employs several hundred people and is run by a workers&rsquo; committee rather than a company.'],pl:'Montagne',w:1},
 {k:'Regnum',h:'Iles Theoi fishermen land a record haul of {fish:salt cod|silver herring|red crab}',p:['Boats from the Iles Theoi landed their largest catch of {fish} this season, filling the cold stores at Colline. Harbour officers said prices on the quay fell by a tenth.','Dried fish and salt from the islands are among the goods most often carried to the portal station for the Federation&rsquo;s markets.'],pl:'Iles Theoi',w:1},
 {k:'Regnum',h:'{num:900-4000} visa-free crossings recorded at the portal station last month',p:['The portal station recorded {num} crossings by travellers under the Treaty of 170 AAX last month, most of them day traders and relatives visiting family. Officials said the count was close to the monthly average.','Under the treaty neither side needs a visa. Both worlds keep embassies, in Xareionople and in Colline.'],pl:'Portal station',w:1},
 {k:'Regnum',h:'Triumterran embassy in Xareionople hosts an evening of Kassan music',p:['The Triumterran embassy in Xareionople opened its garden for an evening of Kassan music, with singers from Colline and a Latrevian choir joining for the last song. Guests included staff from the Ministry of Culture.','The embassy said it holds an evening of this kind each season, open to the public by ticket.'],pl:'Xareionople',w:1},
 {k:'Regnum',h:'Colline harbour pilots test a new beacon at the mouth of the bay',p:['Pilots in Colline tested a new lamp at the mouth of the bay on a clear night this week, a tall beacon meant to replace the older light on the south breakwater. The harbour master said the old light would stay in use until the new one passes a full winter.','The bay is the entrance to the Iles Theoi ferries and the main sea route to the capital.'],pl:'Colline',w:1},
 {k:'Regnum',h:'Grand Council publishes its quarterly accounts',p:['Triumterra&rsquo;s Grand Council published its accounts for the quarter, showing spending on the harbour works, schools and the People&rsquo;s Net, and customs receipts from the portal station. The Council said receipts were slightly above forecast.','Councillors take questions on the accounts at an open sitting each quarter.'],pl:'Colline',w:1},
 {k:'Regnum',h:'Triumterra&rsquo;s schools open the new term of year RR 31',p:['Schools across Triumterra opened the new term this week for the year RR 31, which falls in 166 AAX by Latrevian reckoning. Pupils in Colline gathered in the main square for the reading of the school oath.','Triumterra keeps the Regnum Reckoning, which begins at the Golden Field in 135 AAX. Latrevian visitors often have to convert dates at the station.'],pl:'Colline',w:1},
 {k:'Regnum',h:'Gales on the east coast delay Iles Theoi ferries for {num:1-3} days',p:['Strong winds off the east coast kept the Iles Theoi ferries in port for {num} days. Harbour officers in Colline said no one was stranded and that supply boats would leave once the swell dropped.','The islanders keep a month of stores for weather of this kind.'],pl:'Colline',w:1},
 {k:'Regnum',h:'Grain prices {dir:fall|rise} {pct:2-9}% in Colline as harvest deliveries arrive',p:['Wheat prices in Colline&rsquo;s market {dir} by {pct}% as deliveries from the harvest arrived. Traders said the price reflected a good crop on the plain west of the capital.','The Grand Council&rsquo;s grain office said it would not intervene in the market unless prices moved by more than a quarter.'],pl:'Colline',w:1},
 {k:'Regnum',h:'First Marshal Polemistis III reviews the harbour guard in Colline',p:['First Marshal Polemistis III reviewed the harbour guard in Colline in a short ceremony on the quay, inspecting the ranks and the patrol boats. The Marshal spoke for a few minutes and did not take questions.','Polemistis III was an admiral before he became First Marshal, and the harbour guard has long been a favourite duty of his.'],pl:'Colline',w:1},
 {k:'Regnum',h:'Golden Field Memorial reports {num:300-1400} Latrevian visitors this month',p:['The Golden Field Memorial outside Colline counted {num} visitors from the Federation this month, most of them arriving through the portal station on a day pass. Guides said many asked to see Johan&rsquo;s grave.','The memorial is free to enter. Latrevian visitors are asked to leave a flower or a stone, as Triumterrans do.'],pl:'Colline',w:1},
 {k:'Regnum',h:'Portal station narrows crossings for {num:2-5} days to repair a gantry',p:['The portal station will run a reduced timetable for {num} days while crews repair the loading gantry on the Regnum side. Foot passengers will cross as usual, but carts will be limited to one lane.','Station officials said the work had been planned for months and was timed to fall between busy periods.'],pl:'Portal station',w:1},
 {k:'Regnum',h:'Regnum wheat looks {crop:strong|average|late} after a wet spring',p:['Farmers on the plain west of Colline said the wheat crop looked {crop} after a wet spring. Several said they would hold back a share of the harvest in case the next end-ship window brought a price rise.','The plain is the heart of Triumterra&rsquo;s farmland, and the field where the revolt began.'],pl:'Colline',w:1},
 {k:'Regnum',h:'Federation customs officers seize {num:12-60} crates at the portal station',p:['Customs officers at the portal station seized {num} crates of goods that had not been declared, among them radios and a quantity of dyes. The goods were being carried by a trader from Nicolatia who said he had mislaid the paperwork.','The trader was fined and released. Station officials said such seizures happen a few times a month.'],pl:'Portal station',w:1},
 {k:'Regnum',h:'Triumterran surveyors plan a memorial at the site of Dasos',p:['A team of Triumterran surveyors travelled to the site of Dasos, the colony town on a distant continent destroyed by bombing in 139 AAX, to plan a memorial. They said the ruins were overgrown but could be walked.','The Grand Council has not said when work would begin. Dasos was one of the colonies of the Latrevian Governor-General before the revolt.'],pl:'Dasos',w:1},
 {k:'Regnum',h:'Latrevian school group spends a week in Colline',p:['A school group from the Federation spent a week in Colline under the exchange scheme, visiting the harbour works, a farm on the plain and the Martyrs&rsquo; Monument. Teachers said the pupils had come home with a good many new words.','Under the Treaty of 170 AAX the two worlds encourage exchanges of this kind.'],pl:'Colline',w:1},
 {k:'Regnum',h:'Colline&ndash;Montagne coach fares go to a Grand Council vote',p:['Triumterra&rsquo;s Grand Council will vote next week on whether to lower fares on the coach route between Colline and Montagne. Supporters said the quarry workers and students who use it could not afford the present fares.','Opponents said the Council would have to cut spending elsewhere. The vote is open to the public.'],pl:'Colline',w:1}
];
T.nbr=T.nbr.concat([
 {k:'Nicolatia',h:'Tsarskiy Port loads {num:8-30} timber ships for Commonwealth buyers',p:['Tsarskiy Port, the ice-free harbour on the northern frontier, loaded {num} timber ships this month, most of them bound for the Federation. Port officials said the season was running ahead of last year.','The port was founded under Aleksandr III after the Alexagrad Cession and is the seat of the frontier governors.'],pl:'Tsarskiy Port',w:1},
 {k:'Nicolatia',h:'Duma committee in Nikolatsk approves a zemstvo school grant',p:['A committee of the State Duma in Nikolatsk approved a grant for zemstvo schools in the northern provinces, paying for {num:6-30} new classrooms. Members said the grant would be spent on timber and stoves.','The zemstva run schools, health and roads in Nicolatia, and elect part of the State Council.'],pl:'Nikolatsk',w:1},
 {k:'Nicolatia',h:'Port Aleksandr opens the herring season',p:['Boats left Port Aleksandr at dawn for the first herring of the season, with the harbour church bells rung for the fleet. Fishermen said the water was clear and the shoals early.','Fish from the port is salted for export to the Federation and Luisara.'],pl:'Port Aleksandr',w:1},
 {k:'Nicolatia',h:'Nikolatsk court hears a timber-contract case with a jury',p:['A district court in Nikolatsk heard a timber-contract dispute between two merchant houses before a jury, a procedure that dates from the judicial reform. Lawyers said the case turned on a delayed delivery.','The reformed courts are the institution Nicolatians say they trust most.'],pl:'Nikolatsk',w:1},
 {k:'Luisara',h:'Puerto Del Mar dockers give notice of a {num:24-72}-hour stoppage',p:['Dockers at Puerto Del Mar gave notice of a {num}-hour stoppage over rotas, the latest round in a dispute that has run since the spring. Port owners said they were willing to talk.','The port is one of the main outlets on the Sea of Xarvaii. Luisara has no national mediator, so talks are held directly.'],pl:'Puerto Del Mar',w:1},
 {k:'Luisara',h:'Selva road crews repair {num:3-12} jungle bridges after the rains',p:['Crews in the Selva region began repairs on {num} bridges damaged by the rains, working from the Sitio Pantal depot. Regional officials said the main road would stay open one lane at a time.','Roads in the Selva are paid for by the region, not the republic, so repairs follow the regional budget.'],pl:'Sitio Pantal',w:1},
 {k:'Luisara',h:'Miguel Glacier survey finds the ice {dir:thinner|steadier} than last year',p:['A survey team measured the Miguel Glacier this month and found the ice {dir} than last year, according to the regional council. The team has surveyed the glacier every autumn for some years.','The glacier and the Sud Glacier supply fresh water to the highland towns.'],pl:'Nuevo Alexa',w:1},
 {k:'Luisara',h:'Dongmyeong Penitentiary: Region council asks for a say in visits',p:['The Dongmyeong Region council asked the national government for a say in the visiting rules at the Dongmyeong Penitentiary, which the central government runs on the peninsula. Officials in Luisara Viejo said the matter was under review.','The prison is the sharpest point of friction between the Region and the capital.'],pl:'Dongmyeong',w:1},
 {k:'Luisara',h:'Chamber of Deputies sits late on a {motion:budget amendment|water bill|port levy}',p:['The Chamber of Deputies in Luisara Viejo sat past midnight on a {motion}, the latest in a run of late sittings. Several members of the governing coalition said they would vote for it in return for regional appointments.','Governments in Luisara fall to a simple motion of censure, so sittings of this kind are watched closely.'],pl:'Luisara Viejo',w:1}
]);

 {k:'Marshals',h:'Commonwealth Marshals Service reports {num:40-160} warrants served this month',p:['The Commonwealth Marshals Service said its officers served {num} warrants from the Commonwealth courts this month, most of them in customs and Charter cases. The Service said all were served without incident.','The Marshals Service enforces the orders of the Commonwealth courts and is independent of both entities&rsquo; police.'],pl:'Latreionople',w:1},
 {k:'Civil Service',h:'Commonwealth Civil Service Board opens {num:30-120} posts to applicants',p:['The Commonwealth Civil Service Board opened {num} posts at the Dome and in Solaria to applicants, with entry by examination. The Board said candidates may sit the paper in Latrevian English or French.','Posts are open to citizens of both entities.'],pl:'The Dome, Latreionople',w:1},

 {k:'Latrum',h:'Latrum notes and coins: new {den:2|5|10}-Latrum issue goes into circulation',p:['The Commonwealth Central Bank released a new issue of the {den}-Latrum note this week, with the Dome on one side and a Solarian lighthouse on the other. Older notes remain valid.','The Latrum is the common currency of the Commonwealth. Luisara and Nicolatia do not use it.'],pl:'Latreionople',w:1},
 {k:'Customs',h:'Commonwealth customs receipts rise {pct:2-7}% as border trade grows',p:['Customs receipts at the Commonwealth&rsquo;s external borders rose {pct}% on the year, officials said, with Luisaran and Nicolatian trade leading the increase. The receipts are Commonwealth revenue and are not shared out by entity.','Goods entering from outside the Commonwealth pay duty. Goods moving between Latrevia and Solaria do not.'],pl:'Latreionople',w:1},
 {k:'Intelligence',h:'Commonwealth Intelligence Service publishes its yearly report to Congress',p:['The Commonwealth Intelligence Service delivered its yearly report to the Congress in closed session and released a short public summary. The summary said the Service had no operations against citizens of either entity.','The Service reports to the Council of Defence and is overseen by a joint committee.'],pl:'The Dome, Latreionople',w:1}

var ROUNDS=(function(){var n=12,arr=[],R=[],i,r;for(i=0;i<n;i++)arr.push(i);
 for(r=0;r<n-1;r++){var m=[];for(i=0;i<n/2;i++){var a=arr[i],b=arr[n-1-i];m.push(r%2?[b,a]:[a,b])}R.push(m);arr.splice(1,0,arr.pop())}

function pois(l,f){var L=Math.exp(-l),k=0,p=1;do{k++;p*=f()}while(p>L&&k<9);return k-1}
function result(y,r,m){var s=strength(y),f=ROUNDS[r][m],g=RNG('m'+y+'-'+r+'-'+m).f;var lh=1.3*Math.pow(s[f[0]]/75,1.3),la=1.0*Math.pow(s[f[1]]/75,1.3);return[pois(lh,g),pois(la,g)]}
function seasonOf(d){var y=d.getFullYear();return seasonStart(y)>d?y-1:y}

function table(y,k){var t=TEAMS.map(function(n,i){return{i:i,n:n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}});
 for(var r=0;r<k;r++)for(var m=0;m<6;m++){var f=ROUNDS[r][m],s=result(y,r,m),a=t[f[0]],b=t[f[1]];a.p++;b.p++;a.gf+=s[0];a.ga+=s[1];b.gf+=s[1];b.ga+=s[0];
  if(s[0]>s[1]){a.w++;a.pts+=3;b.l++}else if(s[0]<s[1]){b.w++;b.pts+=3;a.l++}else{a.d++;b.d++;a.pts++;b.pts++}}
